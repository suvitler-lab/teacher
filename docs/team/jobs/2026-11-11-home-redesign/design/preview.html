<!-- Fonts: Google Fonts (SIL OFL 1.1). Fallbacks: Leelawadee UI / Thonburi / system sans. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&family=Mali:wght@500;600;700&family=Anuphan:wght@400;500;600;700&display=swap">
<!-- Icons: Phosphor Icons v2.1.1 (MIT). If the CDN fails, icons fall back to small dots (labels are always shown). -->

<style>
/* =====================================================================
   1. Draft chrome (the switcher bar around the device) — not part of the app
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;background:#d7dbe2;color:#1b1f27;line-height:1.5;overflow-x:hidden}
.chrome{position:sticky;top:0;z-index:50;background:#1c2029;color:#e9edf4;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.chrome h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
.chrome h1 small{display:block;font-weight:400;color:#aab3c2;font-size:12.5px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl>span{font-size:12.5px;color:#aab3c2}
.seg{display:flex;flex-wrap:wrap;background:#2a303c;border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13.5px;color:#d9dfe9;background:transparent;border:0;border-radius:8px;padding:0 10px;min-height:36px;cursor:pointer;white-space:nowrap}
.seg button:hover{background:#363d4b}
.seg button[aria-pressed="true"]{background:#f4f6fa;color:#141820;font-weight:600}
.seg button:focus-visible{outline:2px solid #8fb4ff;outline-offset:1px}
.menu-row{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 8px;border-radius:10px;background:#252b37;border:1px solid #3d4556}
.menu-info{flex-basis:100%;margin:0;font-size:13px;color:#dfe5ee}
.menu-info b{color:#ffd78a;font-weight:600}
.chrome-info{flex-basis:100%;font-size:13px;color:#c7cfdc;margin:0}
.chrome-info b{color:#fff;font-weight:600}
.stage{padding:16px;display:flex;justify-content:center}
.frame-box{position:relative;border-radius:22px;box-shadow:0 0 0 8px #11141a,0 18px 40px rgba(0,0,0,.28);overflow:hidden;flex:none}
.size-note{text-align:center;font-size:12.5px;color:#4a5160;margin:-4px 0 18px}
@media (max-width:700px){.chrome{padding:8px 10px;gap:6px 10px}.chrome h1 small{display:none}.seg button{padding:0 8px;font-size:13px}.stage{padding:12px 8px}}

/* =====================================================================
   2. Theme tokens — names follow src/styles/tokens.css so they can move into the app
   ===================================================================== */
.device{
  --tap:44px;
  --t-xs:max(13px,calc(var(--fs)*.8125)); --t-sm:max(13px,calc(var(--fs)*.875)); --t-md:var(--fs);
  --t-lg:calc(var(--fs)*1.125); --t-xl:calc(var(--fs)*1.375); --t-2xl:calc(var(--fs)*1.75);
  --t-3xl:calc(var(--fs)*2.375); --t-4xl:calc(var(--fs)*3.25);
  --s1:calc(4px*var(--density)); --s2:calc(8px*var(--density)); --s3:calc(12px*var(--density));
  --s4:calc(16px*var(--density)); --s5:calc(24px*var(--density)); --s6:calc(32px*var(--density)); --s7:calc(48px*var(--density));
  --rail-w:max(92px,calc(var(--fs)*5.4));
}
/* ---- theme: มืออาชีพสะอาดตา (pro) ---- */
[data-theme="pro"]{
  --font-sans:"IBM Plex Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;

  --card-bw:1px; --btn-bw:1px; --density:1;
}

[data-theme="playful"]{

/* =====================================================================
   3. App frame (container queries = device widths)
   ===================================================================== */
.device{position:absolute;top:0;left:0;transform-origin:0 0;container-type:inline-size;container-name:app;overflow:hidden;
  background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);font-size:var(--fs);line-height:1.6;
  -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%}
.main{overflow-y:auto;overflow-x:hidden;padding:var(--s5) var(--s6) var(--s7);min-width:0;scroll-behavior:smooth}
.inner{max-width:1320px;margin:0 auto}
:where(.app) :where(button){font:inherit;color:inherit;cursor:pointer}
.app :focus-visible{outline:3px solid var(--text-accent);outline-offset:2px}
.app h1,.app h2,.app h3,.app p{margin:0}
.ic{display:inline-block;line-height:1;flex:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}
.display{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);line-height:1.3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}

/* rail */
.rail{background:var(--rail-bg);color:var(--rail-fg);display:flex;flex-direction:column;align-items:stretch;padding:var(--s3) var(--s2);gap:2px;overflow:hidden;min-height:0}
.brand{display:grid;place-items:center;padding:var(--s1) 0 var(--s3);flex:none}
.brand svg{width:46px;height:46px}
/* T-06: menu list scrolls on its own; fades + "มีต่อ" chip show there is more (honest overflow for menu ค) */
.rail-mid{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.rail-list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--rail-fg) 45%,transparent) transparent}
.rail-mid::before,.rail-mid::after{content:"";position:absolute;left:0;right:0;height:40px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
.rail-mid::before{top:0;background:linear-gradient(var(--rail-bg) 15%,transparent);border-top:2px solid color-mix(in srgb,var(--rail-fg) 35%,transparent)}
.rail-mid::after{bottom:0;background:linear-gradient(transparent,var(--rail-bg) 75%);border-bottom:2px solid color-mix(in srgb,var(--rail-fg) 35%,transparent)}
.rail-mid.up::before,.rail-mid.down::after{opacity:1}
.rail-more{display:none;position:absolute;bottom:4px;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;align-items:center;gap:2px;white-space:nowrap;font-size:13px;line-height:20px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--rail-active-bg);color:var(--rail-active-fg)}
.rail-more .ic{font-size:13px}
.rail-mid.down .rail-more{display:inline-flex}
.rail-label{flex:none;font-size:13px;line-height:1.3;font-weight:600;color:var(--rail-label);text-align:center;padding:5px 2px 1px;margin-top:2px;border-top:1px solid color-mix(in srgb,var(--rail-fg) 18%,transparent)}
.rail-label:first-child{border-top:0;margin-top:0;padding-top:0}
.device.short .brand{padding:0 0 var(--s2)}
.device.short .brand svg{width:40px;height:40px}
.nb{position:absolute;top:1px;right:0;font-size:13px;line-height:17px;font-weight:700;font-style:normal;padding:0 3px;border-radius:999px;background:var(--rail-active-bg);color:var(--rail-active-fg)}
.rail-item[aria-current="page"] .nb{background:var(--rail-bg);color:var(--rail-active-bg)}
.nb-in{display:inline-block;margin-left:auto;font-size:13px;line-height:20px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--accent-2);color:var(--on-accent-2)}
.rail-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:var(--tap);padding:4px 4px;flex:none;border-radius:var(--radius);border:0;background:transparent;color:var(--rail-fg);font-size:var(--t-xs);line-height:1.3;text-align:center;transition:background-color .15s}
.rail-item .ic{font-size:24px}
.rail-item:hover{background:rgba(255,255,255,.08)}
.rail-item[aria-current="page"]{background:var(--rail-active-bg);color:var(--rail-active-fg);font-weight:600}
[data-theme="luxe"] .rail-item[aria-current="page"]{box-shadow:inset 3px 0 0 var(--illo-1)}
[data-theme="playful"] .rail-item[aria-current="page"]{box-shadow:3px 3px 0 #000}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:var(--s3)}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-xs);line-height:1.3;color:var(--rail-fg)}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#3ccf86;box-shadow:0 0 0 3px rgba(60,207,134,.25);flex:none}

/* phone tab bar */
.tabbar{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--surface-2);border-top:var(--card-bw) solid var(--card-border);padding:6px 6px 16px;justify-content:space-around;align-items:flex-end;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;min-height:var(--tap);border:0;background:transparent;font-size:var(--t-xs);color:var(--text-secondary);line-height:1.25}
.tab .ic{font-size:24px}
.tab[aria-current="page"]{color:var(--text-accent);font-weight:600}
.tab-scan .bubble{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);margin-top:-26px;box-shadow:var(--shadow-pop);border:var(--btn-bw) solid var(--card-border)}
[data-theme="playful"] .tab-scan .bubble{background:var(--accent-2);color:var(--on-accent-2)}

/* top bar inside main */
.topbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.topbar .where{font-size:var(--t-sm);color:var(--text-secondary);display:flex;align-items:center;gap:var(--s2)}
.topbar .grow{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 var(--s3);border-radius:var(--radius-btn);border:var(--btn-bw) solid var(--border-control);background:var(--surface-2);color:var(--text-primary);font-size:var(--t-sm)}
.chip-btn .ic{font-size:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);border-radius:var(--radius-btn);border:var(--btn-bw) solid var(--border-control);background:var(--surface-2);color:var(--text-primary);font-weight:600;font-size:var(--t-sm);line-height:1.3;white-space:nowrap;transition:transform .12s,background-color .15s,box-shadow .15s}
.btn .ic{font-size:1.25em}
.btn:hover{background:var(--surface-1)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-hl{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent-2)}
.btn-hl:hover{background:var(--accent-2);filter:brightness(.96)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-accent)}
.btn-ghost:hover{background:var(--bg-accent)}
.btn-lg{min-height:56px;font-size:var(--t-md);padding:0 var(--s5)}
[data-theme="playful"] .btn:not(.btn-ghost){border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
[data-theme="playful"][data-mode="dark"] .btn:not(.btn-ghost){border-color:var(--card-border)}
[data-theme="playful"] .btn:active{transform:translate(2px,2px);box-shadow:none}
[data-theme="luxe"] .btn{letter-spacing:.01em}
.on-hero .btn:not(.btn-primary):not(.btn-hl){background:var(--hero-chip);border-color:color-mix(in srgb,var(--hero-fg) 35%,transparent);color:var(--hero-fg)}
.icon-btn{width:var(--tap);height:var(--tap);display:inline-grid;place-items:center;border-radius:50%;border:var(--btn-bw) solid var(--border-control);background:var(--surface-2);color:var(--text-secondary);flex:none}
.icon-btn .ic{font-size:20px}

/* cards & headings */
.card{background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--s5)}
.card-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.card-head h2{font-size:var(--t-lg)}
.card-head .ic{font-size:22px;color:var(--text-accent)}
.card-head .grow{flex:1}
.h-ic{width:36px;height:36px;border-radius:var(--radius);display:grid;place-items:center;background:var(--bg-accent);color:var(--text-accent);flex:none}
[data-theme="luxe"] .h-ic{background:transparent;border:1px solid var(--border-strong);color:var(--text-gold)}
[data-theme="luxe"] .card-head h2{font-family:var(--font-display);font-weight:600}
.eyebrow{font-size:var(--t-xs);letter-spacing:.04em;color:var(--text-muted);font-weight:600}
[data-theme="luxe"] .eyebrow{letter-spacing:.14em;color:var(--text-gold)}

/* proposal tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;line-height:1.35;padding:1px 7px;border-radius:4px;border:1px dashed currentColor;white-space:nowrap;vertical-align:middle;font-family:var(--font-sans)}
.tag-old{color:var(--text-success);background:var(--bg-success)}
.tag-api{color:var(--text-warning);background:var(--bg-warning)}
.on-hero .tag{background:var(--hero-chip);color:var(--hero-fg)}
.no-tags .tag{display:none}

/* status pills (text + icon, never color alone) */
.st{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:var(--radius-xs);line-height:1.4;white-space:nowrap}
.st .ic{font-size:14px}
.st-ok{background:var(--bg-success);color:var(--text-success)}
.st-warn{background:var(--bg-warning);color:var(--text-warning)}
.st-bad{background:var(--bg-danger);color:var(--text-danger)}
.st-mute{background:var(--surface-1);color:var(--text-secondary)}

/* hero (color area) */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s5) var(--s6);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center;overflow:hidden}
.hero .kicker{font-size:var(--t-sm);color:var(--hero-muted)}
.hero h1{font-size:var(--t-2xl)}
.hero .muted-h{color:var(--hero-muted)}
.hero-illo svg{display:block;width:clamp(150px,22cqi,260px);height:auto}
[data-theme="playful"] .hero{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
[data-theme="luxe"] .hero::after{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--illo-1) 45%,transparent);border-radius:2px;pointer-events:none}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.qa{display:flex;align-items:center;gap:var(--s3);min-height:72px;padding:var(--s3) var(--s4);border-radius:var(--radius-lg);border:var(--card-bw) solid var(--card-border);background:var(--surface-2);color:var(--text-primary);text-align:left;box-shadow:var(--shadow-card);transition:transform .12s,box-shadow .15s}
.qa:hover{transform:translateY(-1px)}
.qa:active{transform:translateY(1px)}
.qa .qi{width:48px;height:48px;border-radius:var(--radius);display:grid;place-items:center;flex:none;font-size:28px}
.qa b{display:block;font-size:var(--t-md);line-height:1.35}
.qa small{display:block;font-size:var(--t-xs);color:var(--text-muted);line-height:1.35}
.qa.main-qa{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qa.main-qa small{color:var(--on-accent);opacity:.92}
.qa.main-qa .qi{background:color-mix(in srgb,var(--on-accent) 16%,transparent)}
.qi-1{background:color-mix(in srgb,var(--cls-2) 22%,var(--surface-2));color:var(--text-primary)}
.qi-2{background:color-mix(in srgb,var(--cls-3) 24%,var(--surface-2));color:var(--text-primary)}
.qi-3{background:color-mix(in srgb,var(--att-sick) 20%,var(--surface-2));color:var(--text-primary)}
[data-theme="playful"] .qa{border-color:var(--ink)}
[data-theme="playful"][data-mode="dark"] .qa{border-color:var(--card-border)}
[data-theme="playful"] .qa.main-qa{background:var(--accent-2);border-color:var(--ink);color:var(--on-accent-2)}
[data-theme="playful"] .qa.main-qa small{color:var(--on-accent-2)}
[data-theme="luxe"] .qa .qi{background:transparent;border:1px solid var(--border-strong);color:var(--text-gold)}
[data-theme="luxe"] .qa.main-qa .qi{border-color:color-mix(in srgb,var(--on-accent) 40%,transparent);color:var(--on-accent)}

/* progress bars */
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--ring-track);gap:2px}
.bar>span{display:block;height:100%}
.seg-scored{background:var(--accent)}
.seg-await{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.seg-pend{background:transparent}
.seg-miss{background:var(--fill-danger)}
[data-theme="luxe"] .bar{height:8px;border-radius:0}
[data-theme="playful"] .bar{height:14px;border:2px solid var(--ink);background:var(--surface-2)}
[data-theme="playful"][data-mode="dark"] .bar{border-color:var(--card-border)}
.legend{display:flex;flex-wrap:wrap;gap:4px var(--s3);font-size:var(--t-xs);color:var(--text-secondary)}
.legend i.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sw-pend{border:1.5px solid var(--border-control)}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:var(--t-sm);background:var(--surface-1);color:var(--text-primary);box-shadow:inset 0 0 0 2.5px var(--c,var(--accent));flex:none;line-height:1}
[data-theme="luxe"] .av{border-radius:3px;font-family:var(--font-display);font-weight:600}
[data-theme="playful"] .av{box-shadow:inset 0 0 0 2.5px var(--ink);background:color-mix(in srgb,var(--c) 30%,var(--surface-2))}
.av-stack{display:flex}
.av-stack .av{margin-left:-8px;border:2px solid var(--surface-2)}
.av-stack .av:first-child{margin-left:0}

/* follow-up grouped by count (no repeated chip per row) */
.fgroup+.fgroup{margin-top:var(--s4)}
.fgroup-h{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.fgroup-h .big{font-size:var(--t-xl);font-weight:700;line-height:1}
.fgroup-h .big.bad{color:var(--text-danger)}
.people{display:flex;flex-wrap:wrap;gap:var(--s2)}
.person{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface-1);border:0;font-size:var(--t-sm);line-height:1.3;text-align:left;color:var(--text-primary)}
.person small{display:block;color:var(--text-muted);font-size:var(--t-xs)}
[data-theme="luxe"] .person{border-radius:4px;background:transparent;border:1px solid var(--border)}
[data-theme="playful"] .person{border:2px solid var(--border-strong)}

/* rings */
.ringbox{display:grid;place-items:center;flex:none}
.ringbox>*{grid-area:1/1}
.ringbox .rc{text-align:center;line-height:1.1}
.ring-val{transition:stroke-dasharray .6s ease}
.ringbox .rc .num{font-weight:700}

/* toast */
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--text-primary);color:var(--surface-2);padding:10px 18px;border-radius:var(--radius);font-size:var(--t-sm);pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@container app (max-width:599px){.toast{bottom:96px}}

/* ============ Layout ก : วันนี้ของครู (timeline) ============ */
.a-hero .big-line{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s2);flex-wrap:wrap}
.a-hero .big-line .num{font-size:var(--t-4xl);font-weight:700;line-height:1;color:var(--hero-fg)}
[data-theme="pro"] .a-hero .big-line .num,[data-theme="luxe"] .a-hero .big-line .num{color:var(--accent-2)}
[data-theme="luxe"][data-mode="light"] .a-hero .big-line .num{color:var(--illo-1)}
.a-hero .big-line span.t{font-size:var(--t-xl);font-family:var(--font-display);font-weight:var(--display-weight)}
.summary{margin-top:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.summary .pill{display:inline-flex;align-items:center;gap:6px;background:var(--hero-chip);border-radius:999px;padding:4px 12px;font-size:var(--t-sm);font-weight:500}
[data-theme="luxe"] .summary .pill{border-radius:2px;border:1px solid color-mix(in srgb,var(--hero-fg) 22%,transparent)}
.grid-a{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s5);align-items:start}
.side{display:flex;flex-direction:column;gap:var(--s4)}
.side .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
.side .qa{flex-direction:column;align-items:flex-start;gap:var(--s2)}
.tl-wrap{padding:var(--s5) var(--s5) var(--s4)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--tl-time) + 15px);top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--border-strong)}
[data-theme="playful"] .tl::before{background:repeating-linear-gradient(var(--ink) 0 8px,transparent 8px 14px);opacity:.5}
[data-theme="luxe"] .tl::before{width:1px;background:var(--illo-1)}
.tl{--tl-time:84px}
.tl-item{display:grid;grid-template-columns:var(--tl-time) 34px minmax(0,1fr);gap:0 var(--s3);padding:var(--s3) 0;position:relative}
.tl-time{text-align:right;font-size:var(--t-sm);font-weight:700;line-height:1.3;padding-top:6px}
.tl-time small{display:block;font-weight:500;color:var(--text-muted);font-size:var(--t-xs)}
.tl-node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:3px solid var(--node,var(--fill-warning));color:var(--node,var(--fill-warning));z-index:1;margin-top:2px}
.tl-node .ic{font-size:16px}
.tl-item.done .tl-node{background:var(--fill-success);border-color:var(--fill-success);color:#fff}
.tl-body{background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius-lg);padding:var(--s4);box-shadow:var(--shadow-card);transition:opacity .2s}
.tl-item.urgent .tl-body{border-left:5px solid var(--fill-warning)}
[data-theme="playful"] .tl-item.urgent .tl-body{border-left-width:6px}
.tl-item.done .tl-body{opacity:.62}
.tl-item.done h3{text-decoration:line-through;text-decoration-thickness:2px}
.tl-top{display:flex;gap:var(--s3);align-items:flex-start}
.tl-top .txt{flex:1;min-width:0}
.tl-body h3{font-size:var(--t-lg);line-height:1.4;font-weight:700}
[data-theme="luxe"] .tl-body h3,[data-theme="warm"] .tl-body h3{font-family:var(--font-display);font-weight:var(--display-weight)}
.tl-body p{font-size:var(--t-sm);color:var(--text-secondary);margin-top:2px}
.tl-acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.check{width:var(--tap);height:var(--tap);border-radius:50%;border:2px solid var(--border-control);background:var(--surface-2);display:grid;place-items:center;color:var(--text-muted);flex:none}
.check[aria-pressed="true"]{background:var(--fill-success);border-color:var(--fill-success);color:#fff}
.check .ic{font-size:22px}
.tl-now{display:grid;grid-template-columns:var(--tl-time) 34px 1fr;gap:0 var(--s3);align-items:center;padding:var(--s1) 0}
.tl-now .lbl{text-align:right;font-weight:700;font-size:var(--t-sm);color:var(--text-danger)}
.tl-now .dot{width:16px;height:16px;border-radius:50%;background:var(--fill-danger);justify-self:center;box-shadow:0 0 0 5px color-mix(in srgb,var(--fill-danger) 25%,transparent);z-index:1}
.tl-now .line{height:2px;background:var(--fill-danger)}
.tl-item.ghost .tl-body{background:transparent;box-shadow:none;border:2px dashed var(--border-strong)}
.tl-item.ghost .tl-node{border-style:dashed;--node:var(--text-muted)}
.tl-item.later .tl-node{--node:var(--text-muted)}
.rooms{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.room{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-sm);font-size:var(--t-sm);font-weight:600;background:var(--surface-1)}
.room.ok{background:var(--bg-success);color:var(--text-success)}
.room.no{background:var(--bg-warning);color:var(--text-warning)}
.mini-bars{display:grid;gap:6px;margin-top:var(--s3)}
.mini-bars .row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:var(--s2);align-items:center;font-size:var(--t-sm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.chips .st{white-space:normal;max-width:100%}

/* class rows (side, layout ก & ค) */
.cls-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--border)}
.cls-row:first-of-type{border-top:0}
.cls-name{font-weight:700;font-size:var(--t-md);font-family:var(--font-display)}
.pct{font-size:var(--t-xl);font-weight:700;line-height:1}
.pct small{font-size:var(--t-sm);font-weight:600}
.cls-row .meta{font-size:var(--t-xs);color:var(--text-muted);margin-top:4px;display:flex;gap:var(--s3);flex-wrap:wrap}

/* ============ Layout ข : แผงรายห้อง ============ */
.b-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:end;margin-bottom:var(--s4)}
.b-top h1{font-size:var(--t-2xl)}
.b-top .summary-line{font-size:var(--t-sm);color:var(--text-secondary);margin-top:4px}
.dock{background:var(--hero-bg);border-radius:var(--radius-hero);padding:var(--s3);display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:var(--s3)}
[data-theme="playful"] .dock{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.dock .qa{background:var(--hero-chip);border-color:transparent;color:var(--hero-fg);box-shadow:none}
.dock .qa small{color:var(--hero-muted)}
.dock .qa .qi{background:color-mix(in srgb,var(--hero-fg) 12%,transparent);color:var(--hero-fg)}
.dock .qa.main-qa{background:var(--accent-2);color:var(--on-accent-2)}
.dock .qa.main-qa small{color:var(--on-accent-2)}
.dock .qa.main-qa .qi{background:color-mix(in srgb,var(--on-accent-2) 12%,transparent);color:var(--on-accent-2)}
[data-theme="playful"] .dock .qa{background:#fff;color:#15142b;border:2px solid #15142b}
[data-theme="playful"] .dock .qa small{color:#3b3a5c}
[data-theme="playful"] .dock .qa .qi{background:#eaf3ff;color:#15142b}
[data-theme="playful"] .dock .qa.main-qa{background:#3b5bfd;color:#fff}
[data-theme="playful"] .dock .qa.main-qa small{color:#fff}
[data-theme="playful"] .dock .qa.main-qa .qi{background:rgba(255,255,255,.18);color:#fff}
[data-theme="warm"][data-mode="light"] .dock .qa{background:rgba(255,250,242,.7)}
.todo-strip{display:flex;gap:var(--s3);margin:var(--s4) 0;flex-wrap:wrap}
.todo-strip .lead{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:var(--t-md)}
.todo-strip .lead .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:999px;background:var(--text-danger);color:var(--surface-2);font-size:var(--t-sm);padding:0 8px}
.todo-pill{display:flex;align-items:center;gap:var(--s2);background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-radius:999px;padding:4px 4px 4px 14px;font-size:var(--t-sm);box-shadow:var(--shadow-card);min-height:52px}
[data-theme="luxe"] .todo-pill{border-radius:3px}
.todo-pill .ic{color:var(--text-warning);font-size:20px}
.todo-pill .btn{min-height:var(--tap);padding:0 14px}
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.panel{position:relative;text-align:left;border-radius:var(--radius-lg);border:var(--card-bw) solid var(--card-border);background:color-mix(in srgb,var(--c) 10%,var(--surface-2));padding:var(--s4) var(--s4) var(--s4);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:var(--s3);transition:transform .15s,box-shadow .15s;color:var(--text-primary)}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--c);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
[data-theme="luxe"] .panel::before{height:2px}
.panel[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:3px}
[data-theme="playful"] .panel[aria-pressed="true"]{transform:translate(-2px,-2px);box-shadow:var(--shadow-pop);outline:0}
.panel .p-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);padding-top:var(--s1)}
.panel .p-head h2{font-size:var(--t-2xl)}
.panel .p-mid{display:flex;align-items:center;gap:var(--s4)}
.panel .p-stats{display:grid;gap:6px;font-size:var(--t-sm);flex:1;min-width:0}
.panel .p-stats div{display:flex;justify-content:space-between;gap:var(--s2);border-bottom:1px dashed var(--border);padding-bottom:4px}

.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s5)}

.abs-row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:var(--t-sm)}

/* ============ Layout ค : โฟกัสงานถัดไป ============ */
.c-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:var(--s4);align-items:stretch}
.focus{position:relative;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s6);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);overflow:hidden;min-height:330px}
[data-theme="playful"] .focus{border:2px solid var(--ink);box-shadow:var(--shadow-pop)}
[data-theme="luxe"] .focus::after{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--illo-1) 45%,transparent);pointer-events:none}
.focus .step{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--hero-muted);font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--hero-fg) 25%,transparent)}

.dots i.dn{background:color-mix(in srgb,var(--hero-fg) 60%,transparent)}
.focus .f-ic{width:64px;height:64px;border-radius:var(--radius-lg);display:grid;place-items:center;background:var(--hero-chip);font-size:36px;margin:var(--s4) 0 var(--s3)}
[data-theme="pro"] .focus .f-ic{background:var(--accent-2);color:var(--on-accent-2)}
[data-theme="luxe"] .focus .f-ic{background:transparent;border:1px solid var(--illo-1);color:var(--illo-1)}
.focus h1{font-size:var(--t-3xl);line-height:1.25}
.focus .why{font-size:var(--t-lg);color:var(--hero-muted);margin-top:var(--s2);max-width:34em}
.focus .acts{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s5)}
.focus .btn-primary{background:var(--hero-fg);border-color:var(--hero-fg);color:var(--hero-bg)}
[data-theme="playful"] .focus .btn-primary{background:#15142b;border-color:#15142b;color:#ffd43b}
[data-theme="luxe"][data-mode="light"] .focus .btn-primary{background:#d4b26a;border-color:#d4b26a;color:#141a17}
[data-theme="luxe"][data-mode="dark"] .focus .btn-primary{background:#d4b26a;border-color:#d4b26a;color:#0e1110}
.focus .f-illo{align-self:end}
.focus .f-illo svg{width:clamp(140px,20cqi,250px);height:auto;display:block}
.next{display:flex;flex-direction:column;gap:var(--s2)}
.next h2{font-size:var(--t-lg)}
.nx{display:flex;align-items:center;gap:var(--s3);min-height:60px;padding:var(--s2) var(--s3);border-radius:var(--radius);border:var(--card-bw) solid var(--card-border);background:var(--surface-2);text-align:left;width:100%;color:var(--text-primary);box-shadow:var(--shadow-card)}
.nx .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-1);font-weight:700;font-size:var(--t-sm);flex:none}
.nx .t{flex:1;min-width:0;line-height:1.35}
.nx .t b{display:block;font-size:var(--t-sm)}

.nx.dn{opacity:.6}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-top:var(--s4)}
.att-tile .row{display:flex;align-items:center;gap:var(--s4)}
.att-legend{display:grid;gap:4px;font-size:var(--t-sm)}
.att-legend div{display:flex;align-items:center;gap:6px}
.att-legend i{width:10px;height:10px;border-radius:2px;flex:none}
.att-legend b{margin-left:auto;font-family:var(--font-num);padding-left:var(--s3)}
.empty{text-align:center;padding:var(--s5) 0}
.empty svg{width:200px;height:auto}

/* ---------- container breakpoints ---------- */
@container app (max-width:1180px){ .main{padding:var(--s5) var(--s5) var(--s7)} }
@container app (max-width:1100px){
  .grid-a{grid-template-columns:1fr}
  .side .quick{grid-template-columns:repeat(4,minmax(0,1fr))}
  .side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .side>.quick{grid-column:1/-1;order:-1}
  .detail{grid-template-columns:1fr}
  .c-grid{grid-template-columns:1fr}
  .next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .next h2{grid-column:1/-1}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles>.wide{grid-column:1/-1}
}
@container app (max-width:860px){
  .side{grid-template-columns:1fr}
  .quick,.side .quick{grid-template-columns:repeat(2,minmax(0,1fr))}

  .panel .p-mid{flex-direction:column;align-items:stretch}

}
@container app (max-width:599px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex}
  .main{padding:var(--s4) var(--s4) 120px}
  .hero{grid-template-columns:1fr;padding:var(--s4) var(--s4)}
  .hero-illo{position:absolute;right:-14px;top:-6px;opacity:.9}
  .hero-illo svg{width:120px}
  .hero h1,.b-top h1{font-size:var(--t-xl);padding-right:96px}
  .a-hero .big-line .num{font-size:var(--t-3xl)}
  .a-hero .big-line span.t{font-size:var(--t-lg)}
  .qa{min-height:64px;padding:var(--s2) var(--s3);gap:var(--s2)}
  .qa .qi{width:40px;height:40px;font-size:24px}
  .tl{--tl-time:0px}
  .tl::before{left:15px}
  .tl-item,.tl-now{grid-template-columns:34px minmax(0,1fr)}
  .tl-time{grid-column:2;text-align:left;padding:0 0 4px}
  .tl-node{grid-row:1/3;grid-column:1}
  .tl-body{grid-column:2}
  .tl-now .lbl{grid-column:2;grid-row:1;text-align:left}
  .tl-now .line{display:none}
  .tl-wrap{padding:var(--s4) var(--s3)}
  .card{padding:var(--s4)}
  .b-top{grid-template-columns:1fr}
  .panels{grid-template-columns:1fr}
  .todo-pill{flex-wrap:wrap;border-radius:var(--radius-lg);padding:var(--s2) var(--s2) var(--s2) var(--s3);width:100%}
  .todo-pill span.t{flex:1;min-width:0}
  .focus{grid-template-columns:1fr;padding:var(--s5) var(--s4);min-height:0}
  .focus .f-illo{position:absolute;right:-10px;top:10px;opacity:.85}
  .focus .f-illo svg{width:110px}
  .focus h1{font-size:var(--t-2xl);padding-right:70px}
  .focus .why{font-size:var(--t-md)}
  .focus .acts .btn{flex:1 1 auto}
  .next,.tiles{grid-template-columns:1fr}
  .topbar .where span.long{display:none}
}
@media (prefers-reduced-motion:reduce){ .device *, .device *::before, .device *::after{transition:none !important;animation:none !important;scroll-behavior:auto !important} }

/* icon font fallback (CDN unreachable): show a small dot, labels stay */
.no-icon-font .ic{width:.55em;height:.55em;border-radius:50%;background:currentColor;opacity:.5}
.no-icon-font .ic::before,.no-icon-font .ic::after{content:none !important}

/* =====================================================================
   4. Gate 2 (T-04) additions — override the Gate R draft above
   ===================================================================== */
/* icon/text colour on --fill-success (≥ 3:1 for icons — fixes playful 2.23) */
[data-theme="pro"][data-mode="light"]{--on-success:#ffffff}
[data-theme="pro"][data-mode="dark"]{--on-success:#0a1120}
[data-theme="warm"][data-mode="light"]{--on-success:#ffffff}

[data-theme="playful"][data-mode="dark"]{--on-success:#12112a}
.chrome .seg button{min-height:34px}

.stale{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;padding:1px 8px;border-radius:var(--radius-xs);background:var(--bg-warning);color:var(--text-warning);white-space:nowrap}
.on-hero .stale{background:var(--hero-chip);color:var(--hero-fg)}
.banner{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s3) var(--s4);border-radius:var(--radius);margin-bottom:var(--s4);background:var(--bg-warning);color:var(--text-primary);border:var(--card-bw) solid color-mix(in srgb,var(--text-warning) 45%,transparent)}

.summary .pill{border:1px solid color-mix(in srgb,var(--hero-fg) 30%,transparent);color:var(--hero-fg);min-height:var(--tap);font:inherit;font-size:var(--t-sm);font-weight:500;cursor:pointer;transition:background-color .15s}

/* short screens (desk 729px): hero ≤ ~200px, smaller illustration (ux #10). App: @media (max-height:760px) */
.device.short .hero{padding:var(--s4) var(--s5)}
.device.short .hero-illo svg,.device.short .focus .f-illo svg{width:170px}

/* layout ก — DOM order = visual order (quick actions before the timeline on narrow screens; no CSS order) */
.grid-a{grid-template-areas:"tl qs" "tl sd";grid-template-rows:auto 1fr}
.grid-a>.qs{grid-area:qs}.grid-a>.tl-wrap{grid-area:tl}.grid-a>.side{grid-area:sd}

.due-row .t{flex:1;min-width:0;font-size:var(--t-sm);line-height:1.45}
.due-row .t b{display:block}
button.cls-row{width:100%;background:transparent;border:0;border-top:1px solid var(--border);text-align:left;color:var(--text-primary);min-height:48px;border-radius:0;padding-left:var(--s1);padding-right:var(--s1)}

button.cls-row:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}

/* layout ข */
.sum-btns{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin-top:4px;font-size:var(--t-sm);color:var(--text-secondary)}
.link-btn{background:none;border:0;padding:0 6px;min-height:var(--tap);color:var(--text-accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

.panel[aria-pressed="true"]{border:3px solid var(--text-primary)}

.panel.cp{padding:var(--s3);gap:var(--s2)}

.detail-h{font-size:var(--t-lg)}

.scrim{position:absolute;inset:0;z-index:30;background:rgba(10,12,20,.5);display:flex;justify-content:flex-end}

.ap-head h2{font-size:var(--t-xl)}

.save-chip.off{background:var(--bg-warning);color:var(--text-warning)}
.ap-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s4);align-items:start}
.ap-preview{grid-column:2;grid-row:1;position:sticky;top:0}
.ap-opts{grid-column:1;grid-row:1;display:grid;gap:var(--s5)}
.app fieldset{border:0;margin:0;padding:0;min-width:0}
.app legend{font-weight:700;font-size:var(--t-lg);margin-bottom:var(--s2);padding:0;font-family:var(--font-display)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.choice{position:relative;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border-radius:var(--radius-lg);border:2px solid var(--border-control);background:var(--surface-2);color:var(--text-primary);cursor:pointer;font-family:var(--font-sans);line-height:1.5;transition:border-color .15s,transform .12s}
.choice:hover{transform:translateY(-1px)}
.choice input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.choice:has(input:focus-visible){outline:3px solid var(--text-accent);outline-offset:2px}
.choice:has(input:checked){border-color:var(--text-accent);box-shadow:inset 0 0 0 2px var(--text-accent)}
.choice b{font-size:var(--t-md);line-height:1.4}

.choice .txt{min-width:0}
.used{display:none;position:absolute;top:8px;right:8px;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;padding:2px 8px 2px 4px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.choice:has(input:checked) .used{display:inline-flex}
.thumb{border-radius:var(--radius);overflow:hidden;background:var(--surface-0);border:1px solid var(--border)}
.thumb svg{display:block;width:100%;height:auto}
.swatches{display:flex;gap:4px;margin-top:22px}
.swatches i{flex:1;height:30px;border-radius:6px;border:1px solid var(--border-strong)}
.sample{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--t-xl);line-height:1.6}
.segm{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:var(--radius);background:var(--surface-1);border:1px solid var(--border)}
.segm label{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 var(--s4);border-radius:var(--radius-sm);cursor:pointer;font-weight:500;color:var(--text-secondary)}
.segm input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.segm label:has(input:checked){background:var(--surface-2);color:var(--text-accent);font-weight:700;box-shadow:inset 0 0 0 2px var(--text-accent)}
.segm label:has(input:focus-visible){outline:3px solid var(--text-accent);outline-offset:2px}
.mini-hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s4);margin:var(--s3) 0}
.mini-hero small{color:var(--hero-muted);font-size:var(--t-xs)}
.mini-hero .display{font-size:var(--t-lg)}
.mini-hero .num{font-size:var(--t-3xl);font-weight:700;line-height:1}
[data-theme="pro"] .mini-hero .num{color:var(--accent-2)}
[data-theme="playful"] .mini-hero{border:2px solid var(--ink)}
.mini-row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.reset-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}

/* scan / gradebook mini pages */
.scan-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.viewfinder{position:relative;aspect-ratio:4/3;border-radius:var(--radius-lg);background:#101318;display:grid;place-items:center;overflow:hidden}
.vf-frame{width:44%;aspect-ratio:1;position:relative}
.vf-frame i{position:absolute;width:26%;height:26%;border:5px solid var(--accent-2)}
.vf-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.vf-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.vf-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.vf-hint{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;font-size:var(--t-sm);color:#eef1f6;background:rgba(0,0,0,.55);border-radius:999px;padding:4px 12px}
.scan-asg{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3)}
.scan-asg .t{flex:1;min-width:0}
.scan-list{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;gap:var(--s2)}
.scan-list li{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--radius);background:var(--surface-1);font-size:var(--t-sm)}
.scan-list li .t{flex:1;min-width:0}
.big-count{font-size:var(--t-3xl);font-weight:700;line-height:1.1}
.gb-wrap{overflow-x:auto}
table.gb{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
table.gb th,table.gb td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;line-height:1.5}
table.gb th{color:var(--text-secondary);font-weight:600;font-size:var(--t-xs);vertical-align:bottom}
table.gb td.n,table.gb th.n{text-align:right;font-variant-numeric:tabular-nums}
.gb-tools{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}

/* breakpoints for the additions */
@container app (max-width:1100px){
  .grid-a{grid-template-columns:1fr;grid-template-areas:"qs" "tl" "sd";grid-template-rows:auto}

}

}
@container app (max-width:599px){
  .quick,.qs .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick .qa{flex-direction:row;align-items:center}
  .panels,.panels.compact{grid-template-columns:1fr}
  .panels.compact .panel:not([aria-pressed="true"]){display:none}
  .room-chips{display:flex}
  .chip-btn .lbl{display:none}
  .chip-btn{width:var(--tap);justify-content:center;padding:0}
  .off-chip{display:none}
  .empty-card{grid-template-columns:1fr;text-align:center;padding:var(--s5)}
  .illo-box{margin:0 auto;width:150px}
  .empty-card .acts{justify-content:center}
  .choices{grid-template-columns:1fr}
  .choice{flex-direction:row;align-items:center}
  .choice .thumb{width:108px;flex:none}
  .theme-choice{flex-wrap:wrap}
  .theme-choice .swatches{width:100%}
  .scrim{align-items:flex-end}
  .sheet{height:auto;max-height:88%;border-radius:var(--radius-hero) var(--radius-hero) 0 0;padding-bottom:var(--s6)}
  .focus .acts .btn{flex:1 1 100%}
  .summary .pill{font-size:var(--t-xs);padding:2px 10px}
}

/* =====================================================================
   5. T-08 หน้าสแกนเต็ม — uses the same tokens/theme/icons as the home page (no new colours)
   ===================================================================== */
.chrome [hidden]{display:none !important}
.scan-row{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 8px;border-radius:10px;background:#1f2a40;border:1px solid #3d4a66}
/* Gate เมนู: menu ง must fit 1536×729 without scrolling → tighter rail only on short screens */
.device.short .rail{padding:var(--s2) var(--s2)}
.device.short .rail-item{padding:1px 4px;gap:0}
.device.short .rail-item .ic{font-size:22px}
.device.short .rail-label{padding:2px 2px 0;margin-top:1px}
.device.short .rail-foot{padding-top:var(--s2);gap:2px}
.only-phone{display:none !important}
.app .btn:disabled{background:var(--surface-1);color:var(--text-secondary);border-style:dashed;border-color:var(--border-control);box-shadow:none;cursor:not-allowed;transform:none}
.btn-danger{background:var(--text-danger);border-color:var(--text-danger);color:var(--surface-2)}
.btn-danger:hover{background:var(--text-danger);filter:brightness(.95)}
.btn-danger-o{color:var(--text-danger);border-color:var(--text-danger)}
.mrow{justify-content:flex-start;width:100%;white-space:normal;text-align:left}
.mrow small{font-weight:500}
.sc-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s2) var(--s4);margin-bottom:var(--s4)}
.sc-head h1{font-size:var(--t-2xl)}
.sc-head p{color:var(--text-secondary);font-size:var(--t-sm)}
.banner.sc-bad{background:var(--bg-danger);border-color:var(--text-danger)}
.banner.sc-bad>.ic{color:var(--text-danger)}
.banner.sc-acc{background:var(--bg-accent);border-color:color-mix(in srgb,var(--text-accent) 55%,transparent)}
.banner.sc-acc>.ic{color:var(--text-accent)}

/* state colours (5 work states) — shared by grid cells, legend, recent badges */
.s-scored{--cb:var(--text-success);--cbg:var(--bg-success);--ct:var(--text-success)}
.s-late{--cb:var(--text-warning);--cbg:var(--bg-warning);--ct:var(--text-warning)}
.s-awaiting{--cb:var(--text-accent);--cbg:var(--bg-accent);--ct:var(--text-accent)}
.s-pending{--cb:var(--border-control);--cbg:var(--surface-2);--ct:var(--text-secondary)}
.s-missing{--cb:var(--text-danger);--cbg:var(--surface-2);--ct:var(--text-danger)}
.s-excused{--cb:var(--border-control);--cbg:var(--surface-1);--ct:var(--text-secondary)}

/* hero */
.sc-hero{position:relative;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s4) var(--s5);display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"t n r" "p p r";gap:var(--s2) var(--s5);align-items:center;overflow:hidden}
[data-theme="playful"] .sc-hero{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.sc-hero .t{grid-area:t;min-width:0}
.sc-hero .kicker{font-size:var(--t-sm);color:var(--hero-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600}
.sc-hero h1{font-size:var(--t-xl);line-height:1.35}
.sc-hero .pills{grid-area:p;display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;min-width:0}
.sc-hero .count{grid-area:n;text-align:right;line-height:1.15}
.sc-hero .count .num{display:block;font-size:var(--t-4xl);font-weight:700;line-height:1}
[data-theme="pro"] .sc-hero .count .num{color:var(--accent-2)}
.sc-hero .count small{display:block;font-size:var(--t-sm);color:var(--hero-fg);font-weight:600}
.sc-hero .sc-ring{grid-area:r}
.hp{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px;border-radius:999px;background:var(--hero-chip);color:var(--hero-fg);font-size:var(--t-sm);font-weight:500;line-height:1.3;white-space:nowrap;border:1px solid transparent}
button.hp{border-color:color-mix(in srgb,var(--hero-fg) 38%,transparent);cursor:pointer;font-weight:600}
button.hp:hover{background:color-mix(in srgb,var(--hero-fg) 18%,transparent)}
.hp .cv{font-size:14px}
.hp.info{min-height:34px}
.hp.warn{background:var(--bg-warning);color:var(--text-warning);font-weight:700;border-color:currentColor}
.hp .sht{display:none}
.sc-ring{--sr-track:color-mix(in srgb,var(--hero-fg) 22%,transparent);--sr-val:var(--hero-fg)}
[data-theme="pro"] .sc-ring{--sr-val:var(--accent-2)}
.sc-ring.plain{--sr-track:var(--ring-track);--sr-val:var(--accent)}
.sc-ring .ring-val{transition:stroke-dasharray .3s ease}
.sc-ring .rc{color:inherit}
.device.short .sc-hero{grid-template-columns:minmax(0,1fr) minmax(0,auto) auto auto;grid-template-areas:"t p n r";padding:var(--s3) var(--s4);gap:var(--s2) var(--s4)}
.device.short .sc-hero h1{font-size:var(--t-lg);-webkit-line-clamp:1}
.device.short .sc-hero .count .num{font-size:var(--t-3xl)}
.device.short .sc-hero .pills{max-width:640px}

/* input row (always ready) + camera */
.sc-in{display:flex;gap:var(--s2);margin:var(--s4) 0 var(--s3);align-items:stretch}
.in-wrap{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.in-wrap>.ic{position:absolute;left:16px;font-size:26px;color:var(--text-secondary);pointer-events:none}
.sc-in input{width:100%;min-height:60px;padding:0 16px 0 54px;border-radius:var(--radius-lg);border:2px solid var(--border-control);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:var(--t-lg);font-weight:600;font-family:var(--font-sans)}
.sc-in input::placeholder{color:var(--text-muted);font-weight:400}
.sc-in input:focus{outline:3px solid var(--text-accent);outline-offset:2px;border-color:var(--text-accent)}
[data-theme="playful"] .sc-in input{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.cam-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:60px;min-height:60px;padding:0 var(--s4);border-radius:var(--radius-lg);border:2px solid var(--border-control);background:var(--surface-2);color:var(--text-primary);font-weight:700}
.cam-btn .ic{font-size:26px}
.cam-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sc-cam{margin-bottom:var(--s3)}
.sc-cam .viewfinder{aspect-ratio:auto;height:min(240px,46cqi);width:100%}
.sc-cam .vf-frame{width:auto;height:70%}
.cam-tools{display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}

/* main + side columns */
.sc-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.sc-mainc,.sc-side{display:flex;flex-direction:column;gap:var(--s4);min-width:0}

/* result card (big) */
.res{position:relative;border-radius:var(--radius-lg);border:2px solid var(--rt);background:var(--rb);box-shadow:var(--shadow-card);overflow:hidden;color:var(--text-primary)}
.res::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--rf)}
.res.t-ok{--rt:var(--text-success);--rb:var(--bg-success);--rf:var(--fill-success)}
.res.t-warn{--rt:var(--text-warning);--rb:var(--bg-warning);--rf:var(--fill-warning)}
.res.t-bad{--rt:var(--text-danger);--rb:var(--bg-danger);--rf:var(--fill-danger)}
.res.t-acc{--rt:var(--text-accent);--rb:var(--bg-accent);--rf:var(--accent)}
.res.t-idle{--rt:var(--text-accent);--rb:var(--surface-2);--rf:var(--border-control);border-style:dashed;border-color:var(--border-control)}
[data-theme="playful"] .res{border-width:3px}
.res.pop{animation:resPop .15s ease-out}

.res-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s4) var(--s5) var(--s4) calc(var(--s5) + 10px);min-height:132px}

.res .sfx{display:flex;flex-wrap:wrap;gap:4px var(--s3);font-size:var(--t-xs);margin-top:6px;font-weight:600}
.res .sfx span{display:inline-flex;align-items:center;gap:4px}
.res .score{font-size:var(--t-3xl);font-weight:700;color:var(--rt);text-align:right;line-height:1;white-space:nowrap}
.res .score small{font-size:var(--t-md);color:var(--text-primary);font-weight:600}
.res-acts{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s5) var(--s4) calc(var(--s5) + 10px)}
.res-acts .btn{min-height:56px}
.cand{flex-direction:column;align-items:flex-start;line-height:1.35;padding:var(--s2) var(--s4);text-align:left;white-space:normal}
.cand small{font-weight:500;font-size:var(--t-xs)}
.undo-bar{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s5) var(--s3) calc(var(--s5) + 10px);border-top:2px dashed color-mix(in srgb,var(--rt) 45%,transparent)}
.undo-bar .meter{flex:1;height:8px;border-radius:4px;background:color-mix(in srgb,var(--rt) 22%,transparent);overflow:hidden}
.undo-bar .meter i{display:block;height:100%;background:var(--rt);transition:width 1s linear}
.undo-btn{min-height:56px;min-width:150px}
.undo-hint{display:flex;align-items:center;gap:6px;padding:0 var(--s5) var(--s3) calc(var(--s5) + 10px);font-size:var(--t-sm);font-weight:500}

/* score pad (type mode) */
.pad-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);gap:var(--s4);padding:var(--s4) var(--s5) var(--s4) calc(var(--s5) + 10px)}
.pad-who{display:flex;align-items:center;gap:var(--s3)}
.pad-who .res-ic{width:56px;height:56px;font-size:30px}
.pad-l{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.pad-in{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.pad-in label{font-weight:700}
.pad-in input{width:4.4em;min-height:64px;font-size:var(--t-3xl);font-weight:700;text-align:center;border:2px solid var(--border-control);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font-family:var(--font-num)}
.pad-in input[aria-invalid="true"]{border-color:var(--text-danger);border-width:3px}
.pad-in .of{font-size:var(--t-xl);font-weight:700}

.keys button:active{transform:translateY(1px)}
.pad-acts{display:grid;gap:var(--s2);margin-top:var(--s2)}

/* failed (never collapsed) */
.fail{border:2px solid var(--text-danger);background:var(--bg-danger);border-radius:var(--radius-lg);padding:var(--s4);color:var(--text-primary)}
.fail-h{display:flex;align-items:center;gap:var(--s2);color:var(--text-danger);font-size:var(--t-lg)}
.fail-h .ic{font-size:26px}
.fail-row{background:var(--surface-2);border-radius:var(--radius);padding:var(--s3);margin-top:var(--s2);display:grid;gap:var(--s2)}
.fr-top{display:flex;flex-wrap:wrap;gap:4px var(--s3);align-items:baseline}
.fail-row .why{font-size:var(--t-sm);display:flex;gap:6px;align-items:flex-start}
.fail-row .why .ic{color:var(--text-danger);margin-top:4px}
.fr-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}

/* number grid */
.g-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-bottom:var(--s3)}
.g-head h2{font-size:var(--t-lg)}
.g-head .grow{flex:1}
.g-leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s4)}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:var(--radius-xs);border:1.5px solid var(--cb);background:var(--cbg);color:var(--text-primary);line-height:1.5}
.lg .ic{color:var(--ct);font-size:14px}
.lg.s-pending,.lg.s-missing{border-style:dashed}
.g-filter{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.cells{--cols:10;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px 8px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;min-width:44px;padding:4px 2px;border-radius:var(--radius-sm);border:2px solid var(--cb);background:var(--cbg);color:var(--text-primary);line-height:1.25;text-align:center;transition:transform .12s}
.cell:hover{transform:translateY(-1px)}
.cell .no{display:flex;align-items:center;gap:3px;font-family:var(--font-num);font-weight:700;font-size:var(--t-lg);font-variant-numeric:tabular-nums}
.cell .no .ic{font-size:16px;color:var(--ct)}
.cell .nm{font-size:var(--t-xs);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.s-pending,.cell.s-missing{border-style:dashed}
.cell.s-excused{border-width:1px}
.cell.s-excused .no,.cell.s-excused .nm{color:var(--text-secondary)}
.cell .ov{position:absolute;top:-7px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface-2);border:2px solid currentColor}
.cell .ov.q{color:var(--text-warning)}
.cell .ov.f{color:var(--text-danger)}
.cell.hit{border-width:3px;border-style:solid;border-color:var(--text-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--text-primary) 16%,transparent)}
.hit-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:13px;line-height:18px;padding:0 6px;border-radius:999px;background:var(--text-primary);color:var(--surface-2);font-weight:700;white-space:nowrap}
.nostu-g{padding:var(--s4);border:2px dashed var(--border-control);border-radius:var(--radius)}

/* side panels */
.sp .card-head h2{font-size:var(--t-lg)}
.sp .big{font-size:var(--t-xl);font-weight:700;line-height:1}
.rec{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.rec li{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s3);border-radius:var(--radius);background:var(--surface-1)}
.nb2{min-width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--cbg,var(--surface-2));border:2px solid var(--cb,var(--border-control));color:var(--text-primary);flex:none}
.rec .t{flex:1;min-width:0;line-height:1.4;font-size:var(--t-sm)}
.rec .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .t small{color:var(--text-secondary);font-size:var(--t-xs);display:flex;gap:2px 6px;flex-wrap:wrap;align-items:center}
.how{display:inline-flex;align-items:center;gap:3px}
.miss-chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:999px;border:1.5px dashed var(--border-control);font-size:var(--t-sm);background:var(--surface-2);color:var(--text-primary);line-height:1.3}
.mchip.missing{border-color:var(--text-danger)}
.mchip.missing .ic{color:var(--text-danger)}
.mchip.s-scored,.mchip.s-late,.mchip.s-awaiting{border-style:solid;border-color:var(--cb);background:var(--cbg)}
.mchip.more{border-style:solid;background:var(--surface-1)}
.side-tabs{display:none;gap:4px;padding:4px;border-radius:var(--radius);background:var(--surface-1);border:1px solid var(--border)}
.side-tabs button{flex:1;min-height:var(--tap);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-weight:600;font-size:var(--t-xs);line-height:1.25;padding:2px 4px}
.side-tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--text-accent);box-shadow:inset 0 0 0 2px var(--text-accent)}

/* setup (A) */
.su-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:var(--s5);align-items:start}
.su-steps{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.step-h{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.step-h .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:700;font-family:var(--font-num);flex:none}
[data-theme="playful"] .step-h .n{background:var(--accent-2);color:var(--on-accent-2);border:2px solid var(--ink)}
.step-h h2{font-size:var(--t-lg)}
.step-h .grow{flex:1}
.subj{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.asg-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.acard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:var(--s3) var(--s4);border-radius:var(--radius-lg);border:var(--card-bw) solid var(--card-border);background:var(--surface-2);box-shadow:var(--shadow-card);color:var(--text-primary);min-height:118px;transition:transform .12s}
.acard:hover{transform:translateY(-1px)}
.acard[aria-pressed="true"]{border:3px solid var(--text-accent);background:color-mix(in srgb,var(--bg-accent) 55%,var(--surface-2))}
.ok-mark{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--text-accent);color:var(--surface-2);display:none;place-items:center;font-size:16px}
[aria-pressed="true"]>.ok-mark{display:grid}
.acard h3{font-size:var(--t-md);line-height:1.4;padding-right:30px}
.acard .meta{font-size:var(--t-xs);color:var(--text-secondary);display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-right:30px}
.acard .rm{display:grid;gap:4px;font-size:var(--t-xs);color:var(--text-secondary)}
.acard .rm span{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.acard .rm b{color:var(--text-primary);font-family:var(--font-num)}
.mbar{height:6px;border-radius:3px;background:var(--ring-track);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.room-pick{display:flex;flex-wrap:wrap;gap:var(--s2)}
.rp{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:56px;padding:6px 40px 6px 16px;border-radius:var(--radius);border:2px solid var(--border-control);background:var(--surface-2);color:var(--text-primary);text-align:left;line-height:1.35}
.rp b{font-size:var(--t-md)}
.rp small{font-size:var(--t-xs);color:var(--text-secondary)}
.rp[aria-pressed="true"],.mc[aria-pressed="true"]{border-width:3px;border-color:var(--text-accent);background:var(--bg-accent)}
.rp .ok-mark{top:50%;transform:translateY(-50%)}
.meth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.mc{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:var(--s3) var(--s4);border-radius:var(--radius-lg);border:2px solid var(--border-control);background:var(--surface-2);color:var(--text-primary);min-height:96px;line-height:1.4}
.mc>.ic{font-size:28px;color:var(--text-accent)}
.mc b{font-size:var(--t-md);display:block}
.mc small{font-size:var(--t-xs);color:var(--text-secondary);display:block}
.su-start{position:sticky;top:0;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);z-index:3}
[data-theme="playful"] .su-start{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.su-start .lbl{color:var(--hero-muted);font-size:var(--t-sm);font-weight:600}
.su-start .ttl{font-size:var(--t-lg);line-height:1.4}
.su-start .det{font-size:var(--t-sm);font-weight:600}
.su-start .ring-row{display:flex;align-items:center;gap:var(--s3)}
.su-start .ring-row p{font-size:var(--t-sm);line-height:1.4}
.su-start .ring-row b{font-size:var(--t-2xl);font-family:var(--font-num);display:block;line-height:1.1}
.btn-start{min-height:60px;width:100%;font-size:var(--t-lg);background:var(--hero-fg);border-color:var(--hero-fg);color:var(--hero-bg)}
.btn-start:hover{background:var(--hero-fg);filter:brightness(1.08)}
[data-theme="playful"] .btn-start{background:#15142b;border-color:#15142b;color:#ffd43b}
.su-why{font-size:var(--t-sm);font-weight:700}
.su-dev{display:flex;flex-wrap:wrap;gap:4px var(--s3);font-size:var(--t-xs);color:var(--hero-fg)}
.su-dev span{display:inline-flex;align-items:center;gap:4px}

/* summary (C) */
.sm-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--s4);align-items:start}
.sm-hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
[data-theme="playful"] .sm-hero{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.sm-hero .top{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
.sm-hero .big-l{font-size:var(--t-xl);font-family:var(--font-display);font-weight:var(--display-weight);line-height:1.3}
.sm-hero .big-l .num{font-size:var(--t-4xl);font-weight:700}
[data-theme="pro"] .sm-hero .big-l .num{color:var(--accent-2)}
.sm-hero .det{font-size:var(--t-sm);font-weight:600}
.sm-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.sm-nums div{background:var(--hero-chip);border-radius:var(--radius);padding:var(--s2) var(--s3)}
.sm-nums b{display:block;font-size:var(--t-2xl);font-family:var(--font-num);line-height:1.2}
.sm-nums span{font-size:var(--t-xs);font-weight:600}
.sm-how{display:flex;flex-wrap:wrap;gap:4px var(--s3);font-size:var(--t-sm);align-items:center}
.sm-how span{display:inline-flex;gap:4px;align-items:center}
.sm-groups{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.grp-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.grp-h h2{font-size:var(--t-lg)}
.grp-h .grow{flex:1}
.gi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cb);background:var(--cbg);color:var(--ct);flex:none}
.gi.dash{border-style:dashed}
.all-done{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-lg);font-weight:700;color:var(--text-success)}
.all-done .ic{font-size:44px}
.sm-bar{position:sticky;bottom:0;margin-top:var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;padding:var(--s3);background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);z-index:3}
.sm-bar .why{font-size:var(--t-xs);color:var(--text-secondary);font-weight:600}
.close-row{display:inline-flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-left:auto}

/* projector (TV) */
.proj{position:absolute;inset:0;z-index:40;background:var(--hero-bg);color:var(--hero-fg);display:flex;flex-direction:column;padding:var(--s5) var(--s6);gap:var(--s4);overflow:auto}
.proj-top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.proj-top .grow{flex:1}
.proj-title{font-size:var(--t-lg);min-width:0}
.proj .btn{background:var(--hero-chip);border-color:color-mix(in srgb,var(--hero-fg) 40%,transparent);color:var(--hero-fg);box-shadow:none}
.proj-last{display:flex;align-items:center;gap:var(--s5);background:var(--hero-chip);border-radius:var(--radius-hero);padding:var(--s5)}
.pj-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--hero-fg);color:var(--hero-bg);font-size:48px;flex:none}
.proj-last .nm{font-size:var(--t-4xl);font-family:var(--font-display);font-weight:var(--display-weight);line-height:1.25;overflow-wrap:anywhere}
.proj-last .ps{font-size:var(--t-xl);font-weight:700}
.proj-count{font-size:var(--t-2xl);font-weight:700}
.proj-count .num{font-size:var(--t-4xl)}
.proj-bar{height:18px;border-radius:999px;background:color-mix(in srgb,var(--hero-fg) 20%,transparent);overflow:hidden;flex:none}
.proj-bar i{display:block;height:100%;background:var(--hero-fg)}
.proj-cells{--pc:12;display:grid;grid-template-columns:repeat(var(--pc),minmax(0,1fr));gap:8px}
.pcell{min-height:52px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-family:var(--font-num);font-size:var(--t-lg);border:2px dashed color-mix(in srgb,var(--hero-fg) 50%,transparent)}
.pcell.on{background:var(--hero-fg);color:var(--hero-bg);border-style:solid;border-color:var(--hero-fg)}
.proj-in input{width:min(520px,100%);min-height:52px;padding:0 16px;border-radius:var(--radius);border:2px solid color-mix(in srgb,var(--hero-fg) 45%,transparent);background:var(--hero-chip);color:var(--hero-fg);font:inherit;font-size:var(--t-md)}
.proj-in input::placeholder{color:var(--hero-fg);opacity:.8}
.proj-note{font-size:var(--t-sm);font-weight:600;display:flex;gap:6px;align-items:center}

/* breakpoints */
@container app (max-width:1300px){ .cells{--cols:8} }
@container app (max-width:1100px){
  .sc-grid{grid-template-columns:1fr}
  .sc-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .sc-side .wide{grid-column:1/-1}
  .cells{--cols:6}
  .su-grid{grid-template-columns:1fr}
  .su-start{position:sticky;top:auto;bottom:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:var(--s3) var(--s4);box-shadow:var(--shadow-pop)}
  .su-start .sum{flex:1;min-width:220px}
  .su-start .btn-start{width:auto;flex:0 0 auto}
  .su-start .ring-row,.su-start .su-dev{display:none}
  .sm-grid{grid-template-columns:1fr}
  .proj-cells{--pc:8}
}
@container app (max-width:599px){
  .no-phone{display:none !important}
  .only-phone{display:inline-flex !important}
  .sc-head h1{font-size:var(--t-xl)}
  .sc-hero{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t r" "n r" "p p";padding:var(--s3) var(--s4);gap:var(--s1) var(--s3)}
  .sc-hero .kicker{display:none}
  .sc-hero h1{font-size:var(--t-md);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc-hero .count{text-align:left;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .sc-hero .count .num{display:inline;font-size:var(--t-2xl)}
  .hp{font-size:var(--t-xs);padding:0 10px}
  .hp .lng{display:none}
  .hp .sht{display:inline}
  /* thumb dock: input + camera stay above the tab bar (one-handed) */
  .sc-in{position:absolute;left:0;right:0;bottom:100px;margin:0;padding:var(--s2) var(--s3);background:var(--surface-2);border-top:var(--card-bw) solid var(--card-border);box-shadow:0 -8px 18px rgba(0,0,0,.12);z-index:4}
  .sc-in input{min-height:56px;font-size:var(--t-md)}
  .cam-btn{min-width:56px;min-height:56px;padding:0}
  .cam-btn .lbl{display:none}
  .main[data-scan="scan"]{padding-bottom:210px}
  .sc-grid{margin-top:var(--s3)}
  .res-main{grid-template-columns:auto minmax(0,1fr);padding:var(--s3) var(--s3) var(--s3) calc(var(--s3) + 10px);gap:var(--s3);min-height:124px}
  .res-ic{width:52px;height:52px;font-size:30px}
  .res .score{grid-column:2;text-align:left;font-size:var(--t-2xl)}
  .res-acts,.undo-bar,.undo-hint{padding-left:calc(var(--s3) + 10px);padding-right:var(--s3)}
  .res-acts .btn{flex:1 1 100%}
  .pad-grid{grid-template-columns:1fr;padding:var(--s3) var(--s3) var(--s3) calc(var(--s3) + 10px)}
  .cells{--cols:5;gap:12px 6px}
  .cell{min-height:56px}
  .sc-side{display:flex}
  .side-tabs{display:flex}
  .sc-side .sp:not(.on){display:none}
  .asg-cards,.meth{grid-template-columns:1fr}
  .mc{min-height:64px;flex-direction:row;align-items:center;gap:var(--s3)}
  .su-start{bottom:100px}
  .su-start .btn-start{width:100%}
  .sm-bar{bottom:100px}
  .sm-bar .btn{flex:1 1 100%;white-space:normal}
  .close-row{margin-left:0;flex-basis:100%;padding-top:var(--s2);border-top:1px dashed var(--border-control)}
  .proj{padding:var(--s4)}
  .proj-cells{--pc:6}
  .pj-ic{width:56px;height:56px;font-size:32px}
}

/* =====================================================================
   T-11 หน้าเช็คชื่อ (ux-attendance.md) — same tokens; status colours derive from --att-* / --text-* / --bg-*
   --sc = icon/border/word (≥3:1 icon · ≥4.5:1 word on --sb) · --sb = cell tint · --sf = ring/legend fill
   ===================================================================== */
.a-present{--sc:var(--text-success);--sb:var(--bg-success);--sf:var(--att-present)}
.a-late{--sc:var(--text-warning);--sb:var(--bg-warning);--sf:var(--att-late)}
.a-leave{--sc:color-mix(in srgb,var(--att-leave) 62%,var(--text-primary));--sb:color-mix(in srgb,var(--att-leave) 15%,var(--surface-2));--sf:var(--att-leave)}
.a-sick{--sc:color-mix(in srgb,var(--att-sick) 62%,var(--text-primary));--sb:color-mix(in srgb,var(--att-sick) 15%,var(--surface-2));--sf:var(--att-sick)}
.a-absent{--sc:var(--text-danger);--sb:var(--bg-danger);--sf:var(--att-absent)}
.a-none{--sc:var(--text-secondary);--sb:var(--surface-2);--sf:transparent}
[class*="a-"].nb2{--cb:var(--sc);--cbg:var(--sb)}
/* hero */
.at-hero{position:relative;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:var(--s4) var(--s5);display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"t n r" "p p r";gap:var(--s3) var(--s5);align-items:center;overflow:hidden}
[data-theme="playful"] .at-hero{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.at-hero .t{grid-area:t;min-width:0}
.at-hero .kicker{font-size:var(--t-sm);color:var(--hero-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600}
.at-hero h1{font-size:var(--t-xl);line-height:1.3}
.at-hero .pills{grid-area:p;display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;min-width:0}
.at-hero .count{grid-area:n;text-align:right;line-height:1.15}
.at-hero .count .num{display:block;font-size:var(--t-4xl);font-weight:700;line-height:1}
[data-theme="pro"] .at-hero .count .num{color:var(--accent-2)}
.at-hero .count small{display:block;font-size:var(--t-sm);font-weight:600}
.at-hero .count .row{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;white-space:nowrap}
.at-hero .count .row small,.at-hero .count .row b{display:inline;font-size:var(--t-md);font-weight:700}
.at-hero .count .row .num{display:inline}
.at-done{grid-area:n;display:flex;align-items:center;gap:var(--s3)}
.at-done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--hero-fg);color:var(--hero-bg);font-size:40px;flex:none;animation:atPop .45s ease-out 1}
[data-theme="pro"] .at-done-ic{background:var(--accent-2);color:var(--on-accent-2)}
.at-big{font-size:var(--t-2xl);line-height:1.2}
.at-det{font-weight:700;font-size:var(--t-md)}
@keyframes atPop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:none}}
.at-ringwrap{grid-area:r;display:flex;align-items:center;gap:var(--s3)}
.at-plate{position:relative;border-radius:50%;background:var(--surface-2);color:var(--text-primary);padding:6px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--hero-fg) 28%,transparent)}
.at-plate svg{display:block}
.at-ring .aseg{transition:stroke-dasharray .3s ease,stroke-dashoffset .3s ease}
.at-rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.at-rc b{font-size:var(--t-xl);font-family:var(--font-num)}
.at-rc small{font-size:var(--t-xs);font-weight:600;color:var(--text-secondary)}
.at-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,auto);gap:0 var(--s3);font-size:var(--t-xs);font-weight:600;line-height:1.55}
.at-leg li{display:flex;align-items:center;gap:6px;white-space:nowrap}

}

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (e.key === "Escape" && S.sheet) { closeSheet(); return; }
  if (e.key === "Escape" && S.page === "scan" && SS.project) { SS.project = false; render(true); return; }
  if (e.key === "Escape" && S.page === "attendance" && AT.project) { AT.project = false; render(true); return; }
  if (S.page === "attendance" && atKey_(e)) return;
  if (e.key === "Enter" && (t.id === "scanIn" || t.id === "projIn")) { e.preventDefault(); const v = t.value.trim(); if (!v) return; doScan(v, /^\d+$/.test(v) ? "key" : "hid"); render(true); focusEl("#" + t.id, true); return; }
  if (e.key === "Enter" && t.id === "padIn") { e.preventDefault(); padSave(); render(true); focusEl(SS.pad ? "#padIn" : "#scanIn", !!SS.pad); return; }
  if (t.classList && t.classList.contains("cell") && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
    e.preventDefault(); const cs = [...t.parentElement.querySelectorAll(".cell")], i = cs.indexOf(t), cols = getComputedStyle(t.parentElement).gridTemplateColumns.split(" ").length;
    const j = Math.max(0, Math.min(cs.length - 1, { ArrowLeft: i - 1, ArrowRight: i + 1, ArrowUp: i - cols, ArrowDown: i + cols, Home: 0, End: cs.length - 1 }[e.key]));
    cs.forEach((c, k) => (c.tabIndex = k === j ? 0 : -1)); cs[j].focus(); SS.gridFocus = +cs[j].dataset.no; }
});
document.addEventListener("input", (e) => { if (e.target.id === "padIn" && SS.pad) SS.pad.val = e.target.value; });
addEventListener("resize", fit);
render();
setTimeout(() => { const ok = [...document.fonts].some((f) => /Phosphor/i.test(f.family) && f.status === "loaded"); if (!ok) document.documentElement.classList.add("no-icon-font"); }, 4000);
</script>
