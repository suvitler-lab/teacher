.device.short .at-leg.at-legbar{display:flex}

@container app (max-width:1300px){ .acells{--cols:5} }
@container app (max-width:1100px){ .acells{--cols:4} .at-week{margin-left:0} .at-hero .kicker{display:none} .at-hero{grid-template-areas:"t n r" "p p r";padding:var(--s3) var(--s4);gap:var(--s2) var(--s4)} .at-hero .count>small{display:none} .at-hero .count .num{font-size:var(--t-3xl)} .at-hero .hp .lng{display:none} .at-hero .hp .sht{display:inline} .at-hero .at-leg{display:none} .at-leg.at-legbar{display:flex} }

/* =====================================================================
   T-14 หน้าสุ่มชื่อ (ux-random.md) — same tokens; stage = --hero-bg/--hero-fg (no new colours)
   motion: reel = 13 steps, each ≤ 240ms (total ≈ 1.9 s, transform only) · pop 240ms · glow ring 600ms once · reduced-motion = none (inset border 1.2 s)
   ===================================================================== */
.rd-hero .rd-mode{display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--hero-chip)}
.rd-hero .rd-mode .hp:not([aria-checked="true"]){border-color:transparent;background:transparent}
.rd-hero .hp[aria-pressed="true"],.rd-hero .hp[aria-checked="true"]{background:var(--hero-fg);color:var(--hero-bg);border-color:var(--hero-fg)}
.rd-mode-s{display:flex;gap:4px;padding:4px;border-radius:var(--radius);background:var(--surface-1);border:1px solid var(--border);width:100%}
.rd-mode-s .btn{flex:1;border-color:transparent;background:transparent;color:var(--text-secondary)}
.rd-mode-s .btn[aria-checked="true"]{background:var(--surface-2);color:var(--text-accent);box-shadow:inset 0 0 0 2px var(--text-accent)}
.rd-count{grid-area:n;display:flex;gap:var(--s5);align-items:flex-end}
.rd-stat{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.rd-stat small{font-size:var(--t-sm);font-weight:600;display:flex;gap:4px;align-items:center}
.rd-stat .num{font-size:var(--t-3xl);font-weight:700;line-height:1}
.rd-stat.big .num{font-size:var(--t-4xl)}
.rd-stat .num i{font-style:normal;font-size:var(--t-md);font-weight:700;margin-left:6px}
.rd-stat .num.rd-rep{font-size:var(--t-xl)}
.rd-stat.dim .num{opacity:.75}
[data-theme="pro"] .rd-stat.big .num{color:var(--accent-2)}
.rd-plate .rd-rcok{font-size:34px;color:var(--text-success)}
.device.short .rd-stat .num,.device.short .rd-stat.big .num{font-size:var(--t-3xl)}
.rd-tt{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3)}
/* iPad นอน + คอม: hero one row (≤ 130 / ≤ 110) */
.rd-hero.rd-one{grid-template-columns:minmax(0,auto) minmax(0,1fr) auto auto;grid-template-areas:"t p n r";padding:var(--s3) var(--s4);gap:var(--s2) var(--s4)}
.rd-hero.rd-one .kicker{display:none}
.rd-hero.rd-one h1{font-size:var(--t-lg)}
.rd-hero.rd-one .rd-stat .num{font-size:var(--t-3xl)}
.rd-hero.rd-sht .hp .lng{display:none}
.rd-hero.rd-sht .hp .sht{display:inline}
.rd-nav{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;margin:var(--s3) 0}
.rd-rooms{display:flex;gap:var(--s2);flex-wrap:wrap;min-width:0}
.rd-note{font-size:var(--t-sm);color:var(--text-secondary);display:flex;gap:6px;align-items:center;margin-left:auto}
.rd-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.device.short .rd-grid{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
.rd-main,.rd-side{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
/* stage */
.rd-stage{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:var(--s3);min-height:380px;padding:var(--s5);border-radius:var(--radius-hero);background:var(--hero-bg);color:var(--hero-fg)}
.rd-stage::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 0 21%,color-mix(in srgb,var(--hero-fg) 7%,transparent) 21% 22%,transparent 22% 37%,color-mix(in srgb,var(--hero-fg) 7%,transparent) 37% 38%,transparent 38% 55%,color-mix(in srgb,var(--hero-fg) 7%,transparent) 55% 56%,transparent 56%)}
[data-theme="playful"] .rd-stage{border:2px solid var(--ink);box-shadow:var(--shadow-card)}

.rd-body{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;container-type:inline-size}
/* names break only between first and last name (never inside a Thai name) when the stage is wide enough; narrow stage = number above name */

@container (max-width:900px){ .rd-proj .rd-name{font-size:64px} }

.rd-idle{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s5) var(--s6);border:3px dashed color-mix(in srgb,var(--hero-fg) 55%,transparent);border-radius:var(--radius-lg)}

.rd-idle span,.rd-msg span{font-size:var(--t-md);font-weight:600}

.rd-msg>.ic{font-size:56px}

.rd-slot{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--s2)}

.rd-win{--rh:96px;position:relative;width:100%;height:var(--rh);overflow:hidden;border-block:3px solid color-mix(in srgb,var(--hero-fg) 55%,transparent)}
.rd-reel{will-change:transform}
.rd-row{height:var(--rh);display:flex;align-items:center;justify-content:center;gap:var(--s4);white-space:nowrap;overflow:hidden;padding:0 var(--s3)}

.rd-rnm{font-family:var(--font-display);font-weight:var(--display-weight);font-size:56px;overflow:hidden;text-overflow:ellipsis}
.rd-res{display:flex;align-items:center;gap:var(--s5);text-align:left;max-width:100%}
.rd-no{position:relative;flex:none;width:136px;height:136px;border-radius:50%;display:grid;place-items:center;background:var(--hero-fg);color:var(--hero-bg);font-size:64px;font-weight:700;line-height:1}

.rd-glow{position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--hero-fg);opacity:0;animation:rdGlow .6s ease-out 1;pointer-events:none}
.rd-who{min-width:0}

.rd-name.long{font-size:52px}
.rd-sub{font-size:var(--t-lg);font-weight:600;margin-top:var(--s1)}
.rd-multi{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:repeat(var(--mc,2),minmax(0,1fr));gap:var(--s3)}
.rd-multi li,.rd-pc{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--radius-lg);border:3px solid var(--hero-fg);text-align:left;min-width:0}

.rd-pair{display:flex;align-items:center;gap:var(--s4);width:100%}
.rd-pair .rd-pc{flex:1}
.rd-and{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:var(--t-md);flex:none}

@keyframes rdPop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:none}}

.rd-pop .rd-res,.rd-pop>li,.rd-pop .rd-pc{animation:rdPop .24s ease-out 1}
.rd-stage.rd-rm{box-shadow:inset 0 0 0 6px var(--hero-fg)}
.rd-snd{position:absolute;top:var(--s3);left:var(--s3);display:inline-flex;gap:6px;align-items:center;padding:2px 12px;border-radius:999px;border:2px solid var(--hero-fg);font-size:var(--t-sm);font-weight:700;line-height:1.5}
.rd-snd .ic{font-size:18px}
/* answer timer (in stage) */
.rd-tm{align-self:flex-end;display:flex;align-items:center;gap:var(--s2)}
.rd-tring{position:relative;display:inline-grid;place-items:center}
.rd-tring svg{display:block}
.rd-tarc{transition:stroke-dashoffset .24s linear}
.rd-tnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.rd-tnum b{font-size:var(--t-lg);font-weight:700}
.rd-tnum small{font-size:13px;font-weight:600}
.rd-tm.up{gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--radius);border:3px solid var(--hero-fg)}
.rd-tm.up>.ic{font-size:32px}
.rd-tup{font-size:var(--t-xl)}
/* roll button + skip/undo */
.rd-ctl{display:flex;gap:var(--s3);align-items:stretch}
.rd-dock{flex:1 1 auto;display:flex;min-width:0}
.app .rd-go{flex:1;min-height:80px;gap:var(--s3);font-size:var(--t-xl);border-radius:var(--radius-lg);background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.app .rd-go:hover{background:var(--accent-hover)}
.rd-go .ic{font-size:28px}
.rd-go kbd{font:inherit;font-size:var(--t-xs);font-weight:700;padding:0 8px;border-radius:6px;border:2px solid currentColor;line-height:1.5}
.app .rd-go:disabled{background:var(--surface-1);border:2px dashed var(--border-control);color:var(--text-secondary);cursor:not-allowed;box-shadow:none}
.rd-go[aria-disabled="true"]{cursor:progress}
.device.short .app .rd-go,.device.short .rd-go{min-height:72px}
.rd-acts{display:flex;gap:var(--s2)}
.rd-acts .btn{min-height:48px;justify-content:flex-start;text-align:left}
.rd-acts .btn>span{display:flex;flex-direction:column;line-height:1.25}
.rd-acts small{font-size:var(--t-xs);font-weight:500;color:var(--text-secondary)}
.rd-foot{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);align-items:center}
.rd-why{font-size:var(--t-sm);color:var(--text-primary);font-weight:600;display:flex;gap:6px;align-items:center}
.rd-sum{display:inline-flex;gap:6px;align-items:center;min-height:var(--tap);padding:0;border:0;background:none;color:var(--text-secondary);font-size:var(--t-sm);font-weight:600;text-decoration:underline dotted;text-underline-offset:4px;text-align:left}
/* side cards */
.rd-card>summary{display:flex;align-items:center;gap:var(--s2);min-height:48px;cursor:pointer;list-style:none}
.rd-card>summary::-webkit-details-marker{display:none}
.rd-card>summary h2{font-size:var(--t-lg)}
.rd-card[open]>summary{margin-bottom:var(--s3)}
.rd-card[open]>summary .cv{transform:rotate(180deg)}
.rd-card .grow{flex:1}
.rd-sw{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:48px;padding:0 var(--s1);border:0;border-radius:var(--radius);background:transparent;color:var(--text-primary);font-weight:600;font-size:var(--t-sm);line-height:1.3;text-align:left}
.rd-sw:hover{background:var(--surface-1)}
.rd-sw .tr{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface-1);border:2px solid var(--border-control);flex:none}
.rd-sw .tr i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--border-control);transition:transform .15s}
.rd-sw[aria-checked="true"] .tr{background:var(--accent);border-color:var(--accent)}
.rd-sw[aria-checked="true"] .tr i{transform:translateX(18px);background:var(--on-accent)}
.rd-sw .l{display:flex;flex-direction:column;min-width:0}
.rd-sw .l small{font-size:var(--t-xs);font-weight:500;color:var(--text-secondary)}
.rd-sw .st{margin-left:auto;font-size:var(--t-xs);font-weight:700;color:var(--text-secondary)}
.rd-row2{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;min-height:48px;padding:0 var(--s1)}
.rd-lab{font-size:var(--t-sm);font-weight:600}
.rd-step{display:flex;align-items:center;gap:var(--s2);margin-left:auto}
.rd-step .icon-btn{width:48px;height:48px}
.rd-step output{min-width:2ch;text-align:center;font-size:var(--t-xl);font-weight:700}
.rd-range{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;padding:0 var(--s1) var(--s2)}
.rd-range label{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:600}
.rd-range input{width:4.6em;min-height:48px;border:2px solid var(--border-control);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font:inherit;font-size:var(--t-md);text-align:center}
.rd-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;margin:var(--s1) 0 var(--s2);border-radius:var(--radius);background:var(--surface-1);border:1px solid var(--border)}
.rd-seg button{min-height:var(--tap);border:0;border-radius:var(--radius-sm);background:transparent;font-weight:600;font-size:var(--t-sm);color:var(--text-secondary)}
.rd-seg button[aria-checked="true"]{background:var(--surface-2);color:var(--text-accent);box-shadow:inset 0 0 0 2px var(--text-accent)}
.rd-tbtns{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0}
.rd-chips{list-style:none;margin:0;padding:2px;display:flex;flex-wrap:wrap;gap:6px;max-height:196px;overflow:auto}
.rd-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;max-width:100%;padding:0 10px;border-radius:999px;font-size:var(--t-sm);font-weight:600;line-height:1.3}
.rd-chip b{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.rd-chip span:not(.sr){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:8.5em}
.rd-chip.left{border:2px dashed var(--border-control);background:var(--surface-2);color:var(--text-primary)}
.rd-chip.done{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.rd-chip.last{border:3px solid var(--text-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--text-primary) 22%,transparent)}
.rd-away{display:flex;gap:6px;align-items:center;margin-top:var(--s2)}
.rd-card .btn{margin-top:var(--s2)}
/* groups (B) */
.rd-gstage{min-height:0;padding:var(--s4) var(--s5)}
.device.short .rd-gstage{min-height:0}
.rd-gsum{display:flex;align-items:center;gap:var(--s3);text-align:left;width:100%}
.rd-gsum>.ic{font-size:40px}
.rd-gsum b{display:block;font-size:var(--t-xl);line-height:1.3}
.rd-gsum small{display:block;font-size:var(--t-sm);font-weight:600}
.rd-gwrap{--gcol:4;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--gcol),minmax(0,1fr));gap:var(--s3)}
.rd-g{min-width:0;background:var(--surface-2);color:var(--text-primary);border:var(--card-bw) solid var(--card-border);border-top:6px solid var(--gc);border-radius:var(--radius-lg);padding:var(--s3);box-shadow:var(--shadow-card)}
.rd-gh{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.rd-gdot{width:22px;height:22px;border-radius:50%;background:var(--gc);border:2px solid var(--text-primary);flex:none}
.rd-gh h3{font-size:var(--t-xl);line-height:1.2}
.rd-g ol{list-style:none;margin:0;padding:0;display:grid;gap:2px 8px;font-size:var(--t-sm)}
.rd-g.two ol{grid-template-columns:1fr 1fr}
.rd-g li{display:flex;gap:6px;align-items:center;min-height:28px;min-width:0}
.rd-g li b{flex:none}
.rd-g .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-g li.lead{font-weight:700}
.rd-g li.lead>.ic{color:var(--text-warning);font-size:18px}
.rd-lw{font-size:var(--t-xs);color:var(--text-secondary)}
.rd-gnote{display:flex;gap:6px;align-items:center}
/* projector (C) */
.rd-proj .rd-pjstage{flex:1 1 auto;min-height:280px;border:3px solid var(--hero-fg)}
.rd-proj .rd-win{--rh:140px}
.rd-proj .rd-rnm{font-size:88px}
.rd-proj .rd-rno{font-size:72px}
.rd-proj .rd-no{width:200px;height:200px;font-size:110px}
.rd-proj .rd-name{font-size:96px}
.rd-proj .rd-mnm{font-size:56px}
.rd-proj .rd-tnum b{font-size:var(--t-3xl)}
.rd-proj .rd-g{border-width:3px}
.rd-pjfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3)}
.rd-pjbtns{display:flex;gap:var(--s3);flex-wrap:wrap}
.rd-pjbtns .btn{min-height:80px;font-size:var(--t-xl);padding:0 var(--s6)}
.rd-proj .rd-pjgo{background:var(--hero-fg);color:var(--hero-bg);border-color:var(--hero-fg)}
.rd-proj .rd-pjgo:disabled{background:transparent;color:var(--hero-fg);border-style:dashed}
@container app (max-width:1100px){ .rd-stat .num,.rd-stat.big .num{font-size:var(--t-2xl)} .rd-count{gap:var(--s4)} .rd-gwrap{--gcol:3} }
@container app (max-width:900px){
  .rd-grid{grid-template-columns:1fr}
  .rd-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .rd-stage{min-height:440px}
  .rd-gstage{min-height:0}
  .rd-ctl{flex-direction:column}
  .rd-acts .btn{flex:1;min-height:56px}
  .rd-gwrap{--gcol:2}
}
@container app (max-width:599px){
  .rd-nav{margin:var(--s3) 0}
  .rd-rooms{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;overscroll-behavior-x:contain}
  .rd-rooms .at-room{flex:none}
  .rd-note{margin-left:0}
  .rd-side{display:flex}
  .rd-stage{min-height:300px;padding:var(--s4)}
  .rd-res{flex-direction:column;text-align:center;gap:var(--s3)}
  .rd-no{width:104px;height:104px;font-size:48px}
  .rd-name{font-size:44px}
  .rd-name.long{font-size:40px}
  .rd-win{--rh:64px}
  .rd-rnm{font-size:34px}
  .rd-rno{font-size:30px}
  .rd-multi{grid-template-columns:1fr}
  .rd-pair{flex-direction:column}
  .rd-dock{position:absolute;left:0;right:0;bottom:100px;z-index:4;padding:var(--s2) var(--s3);background:var(--surface-2);border-top:var(--card-bw) solid var(--card-border);box-shadow:0 -8px 18px rgba(0,0,0,.12)}
  .app .rd-go{min-height:64px}
  .main[data-rnd]{padding-bottom:200px}
  .rd-count{gap:var(--s3)}
  .rd-stat small{font-size:var(--t-xs)}
  .rd-gwrap{--gcol:1}
  .rd-proj .rd-name{font-size:48px}
  .rd-proj .rd-no{width:120px;height:120px;font-size:60px}
  .rd-proj .rd-win{--rh:80px}
  .rd-proj .rd-rnm{font-size:44px}
  .device[data-page="random"] .toast{bottom:190px}
}
@media (prefers-reduced-motion:reduce){
  .device .rd-reel,.device .rd-tarc{transition:none !important}
  .device .rd-pop *,.device .rd-glow{animation:none !important}
  .device .rd-glow{display:none}
}

/* =====================================================================
   T-17 หน้าคะแนน (ux-gradebook.md) — same tokens · cell states reuse --bg-*/--text-* pairs (same as .st chips)
   work-type tint --tc (from --cls-* / --fill-danger / --accent) mixed ≤ 24% into --surface-2 · .tsh shape tells the type without colour
   space budget: desk name 256 · work 121.6 · cum 83.2 / row 36 · iPad นอน 160·96·64 / 44 · iPad ตั้ง 136·80·64 / 44 (= 16rem·7.6rem·5.2rem …)
   ===================================================================== */
.t-sheet{--tc:var(--cls-1)}.t-drill{--tc:var(--cls-2)}.t-proj{--tc:var(--cls-3)}.t-exam{--tc:var(--fill-danger)}.t-home{--tc:var(--accent)}
.tsh{display:inline-block;width:11px;height:11px;flex:none;background:var(--tc);border-radius:2px}
.t-drill .tsh,.tsh.t-drill{border-radius:50%}
.t-proj .tsh{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:13px;height:13px}
.t-exam .tsh{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:13px;height:12px}
.t-home .tsh{border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);width:13px}
.main[data-gb]{display:flex;flex-direction:column;overflow:hidden;padding:12px 16px;position:relative}
.main[data-gb]>.inner{max-width:none;width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
.gbp{--cw-n:256px;--cw-a:121.6px;--cw-c:83.2px;--rh:36px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.gbp.d-ipadL{--cw-n:160px;--cw-a:96px;--cw-c:64px;--rh:44px}
.gbp.d-ipadP{--cw-n:136px;--cw-a:80px;--cw-c:64px;--rh:44px;gap:6px}
.gbp.d-phone{gap:12px;flex:none}
.gbp .banner{margin-bottom:0;padding:6px 12px;flex:none}
.gb-qbad{background:var(--bg-danger);border-color:color-mix(in srgb,var(--text-danger) 50%,transparent)}
.gb-qbad>.ic{color:var(--text-danger)}
/* hero — one band ≤ 96px (desk / iPad นอน) */
.gb-hero{flex:none;background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--radius-hero);padding:8px 10px 8px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"t n a" "p p p";gap:6px 16px;align-items:center}
[data-theme="playful"] .gb-hero{border:2px solid var(--ink);box-shadow:var(--shadow-card)}
.gh-t{grid-area:t;min-width:0;display:flex;align-items:baseline;gap:2px 12px;flex-wrap:wrap}
.gh-t h1{font-size:var(--t-xl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gh-t .k{font-size:var(--t-xs);font-weight:600;color:var(--hero-muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.gh-n{grid-area:n;display:flex;align-items:center;gap:8px}
.gh-big{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px 0 10px;border-radius:var(--radius);border:1.5px solid color-mix(in srgb,var(--hero-fg) 40%,transparent);background:var(--hero-chip);color:var(--hero-fg);line-height:1}
.gh-big .num{font-size:calc(var(--fs)*2.1);font-weight:700}
.gh-big small{font-size:var(--t-xs);font-weight:700;line-height:1.25;text-align:left}
.gh-big .ic{font-size:20px}
.gh-big[aria-pressed="true"]{background:var(--hero-fg);color:var(--hero-bg);border-color:var(--hero-fg)}
.gh-big:disabled{cursor:default}
.gh-sm{display:inline-flex;flex-direction:column;line-height:1.2;padding:0 8px;border-left:1.5px solid color-mix(in srgb,var(--hero-fg) 30%,transparent)}
.gh-sm b{font-size:var(--t-xl);font-weight:700}
.gh-sm small{font-size:var(--t-xs);font-weight:600;color:var(--hero-muted);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.gh-a{grid-area:a;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.gh-a .pg-switch{padding:0;border:0}
.gh-pill .sht{display:none}
.gh-p{grid-area:p;display:flex;align-items:center;gap:4px 14px;min-width:0;background:var(--surface-2);color:var(--text-primary);border-radius:var(--radius-sm);padding:3px 10px;min-height:28px}
.segbar{display:flex;gap:2px;height:10px;flex:1 1 100px;min-width:90px;max-width:360px;border-radius:5px;overflow:hidden;background:var(--surface-1)}
.segbar i{display:block;min-width:3px;background:var(--gf)}
.gl-scored{--gf:var(--fill-success)}.gl-late{--gf:var(--fill-warning)}.gl-awaiting{--gf:var(--accent)}.gl-missing{--gf:var(--fill-danger)}.gl-excused{--gf:var(--text-muted)}
.gl-pending{--gf:repeating-linear-gradient(135deg,var(--text-muted) 0 2px,transparent 2px 5px)}
.gh-leg{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 10px;font-size:var(--t-xs);font-weight:600;line-height:1.4}
.gh-leg li{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.gh-leg .sw{width:12px;height:12px;border-radius:3px;background:var(--gf);box-shadow:inset 0 0 0 1px var(--text-secondary);flex:none}
.gh-leg .tot{color:var(--text-secondary)}
.gh-save{font-size:var(--t-xs);font-weight:700;display:inline-flex;gap:4px;align-items:center;white-space:nowrap;color:var(--text-success)}
.gh-save.in-p{margin-left:auto}.gh-save.in-t{display:none}
.gh-save.warn{color:var(--text-warning)}.gh-save.bad{color:var(--text-danger)}.gh-save.mute{color:var(--text-secondary)}
/* tools row ≤ 44px · scrolls inside itself, never the page */
.gb-tools{flex:none;display:flex;flex-wrap:nowrap;margin:0;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-height:var(--tap)}
.gb-tools>*{flex:none}
.gt-rooms{display:flex;gap:6px}
.gb-tools .chip-btn small{color:var(--text-secondary);font-size:var(--t-xs)}
.gb-tools .chip-btn[aria-pressed="true"]{border-color:var(--text-accent);color:var(--text-accent);box-shadow:inset 0 0 0 1px var(--text-accent);font-weight:700}
.gb-tools .chip-btn[aria-pressed="true"] small{color:var(--text-accent)}
.gt-seg{display:inline-flex;border-radius:var(--radius-btn);background:var(--surface-1)}
.gt-seg button{min-height:var(--tap);padding:0 12px;border:0;border-radius:var(--radius-btn);background:transparent;color:var(--text-secondary);font-size:var(--t-sm);font-weight:600;white-space:nowrap}
.gt-seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-accent);box-shadow:inset 0 0 0 2px var(--text-accent)}
.gt-seg button:disabled{cursor:default}
.gt-scope{font-size:var(--t-xs);color:var(--text-secondary);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.gt-scope.warn{color:var(--text-warning);font-weight:700}
.gb-tools .grow{flex:1 0 4px}
/* selected-work bar — one line ≤ 48px (desk/iPad นอน) · two lines ≤ 88px (iPad ตั้ง) */
.gb-sel{flex:none;display:flex;align-items:center;gap:6px 12px;min-height:48px;padding:0 2px 0 12px;border-radius:var(--radius);background:color-mix(in srgb,var(--tc) 12%,var(--surface-2));border:var(--card-bw) solid color-mix(in srgb,var(--tc) 50%,var(--card-border));border-left:6px solid var(--tc)}
.gs-i{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font-size:var(--t-sm);white-space:nowrap;overflow:hidden}
.gs-ty{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--text-secondary)}
.gs-tt{font-size:var(--t-md);overflow:hidden;text-overflow:ellipsis;min-width:4em}
.gs-f{font-weight:600}
.gs-st{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;font-weight:600}
.gs-a{display:flex;gap:6px;flex:none;align-items:center}
.gs-a .btn{padding:0 12px}
.d-ipadP .gb-sel{flex-wrap:wrap;padding:0 2px 0 12px;row-gap:2px}
.d-ipadP .gs-i{flex-basis:100%;min-height:32px}
.d-ipadP .gs-a{flex:1;justify-content:flex-start}
/* table */
.gb-body{flex:1;min-height:0;display:flex;gap:8px}
.gb-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.gb-scroll{flex:1;min-height:0;overflow:auto;border-radius:var(--radius);border:var(--card-bw) solid var(--card-border);background:var(--surface-2);overscroll-behavior:contain}
.gbt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}
.gbt th,.gbt td{box-sizing:border-box;height:var(--rh);padding:0 6px;border:0;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:center;white-space:nowrap;line-height:1.25;font-size:var(--t-sm);scroll-margin:0}
.gbt thead th{position:sticky;top:0;z-index:2;height:auto;padding:0;vertical-align:bottom;background:var(--surface-2);border-bottom:2px solid var(--border-strong)}
.gbt .c-name{position:sticky;left:0;z-index:1;width:var(--cw-n);max-width:var(--cw-n);background:var(--surface-2);text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;border-right:2px solid var(--border-strong);padding:0 8px 0 6px}
.gbt .c-cum{position:sticky;right:0;z-index:1;width:var(--cw-c);background:var(--surface-2);border-left:2px solid var(--border-strong);border-right:0;line-height:1.2;padding:0 4px}
.gbt thead .c-name,.gbt thead .c-cum{z-index:3;padding:4px 8px;font-size:var(--t-xs);color:var(--text-secondary);text-align:left;line-height:1.3}
.gbt thead .c-cum{text-align:center;padding:4px}

      title: `ครบกำหนดวันนี้ ${dueToday.length} งาน`, why: `ยังไม่ส่งรวม ${n} คน · แตะไอคอนสแกนของงานที่จะรับ`, act: "เปิดสมุดคะแนน", actIcon: "notebook" });
  } else for (const a of dueToday) { const pend = pendOf(a), n = pend.reduce((s, x) => s + x[1], 0);
    t.push({ key: "due:" + a.id, icon: "calendar-check", tone: "warn", when: "วันนี้", whenSub: "ครบกำหนด", asg: a,
      title: `${a.title} ครบกำหนดวันนี้`, why: `ยังไม่ส่ง ${n} คน · ${pend.map(([c, v]) => `${CL[c].name} ${v} คน`).join(" · ")}`, act: "สแกนรับงาน", actIcon: "scan", alt: "คัดลอกรายชื่อไป LINE", altIcon: "copy" }); }
  const tot = overdue.reduce((s, a) => s + Object.values(a.per).reduce((t2, p) => t2 + p.missing.length, 0), 0);
  if (tot) { const old = overdue.find((a) => -DUE_DAYS(a.due) >= 7);
    t.push({ key: "chase", icon: "flag", tone: "bad", when: "ค้างอยู่", whenSub: "ตามงาน",
      title: `ตามงานค้าง ${tot} ชิ้น`, why: `${overdue.length} งานเลยกำหนด` + (old ? ` · ${old.title} เลยมา ${-DUE_DAYS(old.due)} วัน ควรปิดรับ` : ""), act: "ดูรายชื่อคนค้าง", actIcon: "list-checks", alt: old ? "ปิดรับงานนี้" : null, altIcon: "lock-simple" }); }
  if (awaitingCount) { const parts = ASG.map((a) => [a, Object.values(a.per).reduce((s, p) => s + p.awaiting, 0)]).filter((x) => x[1]).sort((x, y) => y[1] - x[1]);
    t.push({ key: "grade", icon: "exam", tone: "mute", when: "ว่างแล้วทำ", whenSub: "ตรวจงาน",
      title: `ตรวจงาน ${awaitingCount} ชิ้นที่ส่งแล้ว`, why: parts.slice(0, 3).map(([a, n]) => `${a.title} ${n}`).join(" · ") + (parts.length > 3 ? ` · และอีก ${parts.length - 3} งาน` : ""), act: "เปิดสมุดคะแนน", actIcon: "notebook" }); }
  if (BACKUP_DAYS > 7) t.push({ key: "backup", icon: "cloud-arrow-up", tone: "mute", when: "ว่างแล้วทำ", whenSub: "สำรอง",
    title: "สำรองข้อมูล", why: `สำรองล่าสุด ${BACKUP_DAYS} วันที่แล้ว · ควรสำรองสัปดาห์ละครั้ง`, act: "สำรองตอนนี้", actIcon: "download-simple" });
  return t;
}
