<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>เซลล์คะแนน — ปัจจุบัน vs ใหม่</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap");
:root{--surface-0:#f4f6fa;--surface-1:#eef1f6;--surface-2:#fff;--text-primary:#1a1f29;--text-secondary:#59616e;--text-muted:#8b929d;
--border:rgba(20,28,46,.10);--border-strong:rgba(20,28,46,.18);--accent:#2f6fde;--text-accent:#1a56b0;--bg-accent:#e6f0fc;
--bg-warning:#fbefd6;--text-warning:#8a5a08;--fill-warning:#e79a1c;--bg-danger:#fbe6e6;--text-danger:#a32626;--fill-danger:#dc4a4a;
--fs-xs:max(13px,.85rem);--fs-sm:max(13px,.9rem);--row-h:2.4rem}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--surface-0);color:var(--text-primary);line-height:1.6}
.ctl{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.ctl .g{display:flex;gap:4px;align-items:center}
.ctl button{font:inherit;padding:2px 12px;border:1px solid var(--border-strong);background:#fff;border-radius:999px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px;display:grid;gap:18px}
h2{font-size:16px;margin:0 0 6px}
.vp{border:1px solid var(--border-strong);border-radius:10px;background:#fff;overflow:hidden;margin:0 auto;width:var(--w,100%);max-width:100%}
.scroll{overflow:auto;max-height:430px}
table.gb{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max(100%,calc(var(--n)*7.6rem + 12rem + 5.2rem));font-size:var(--fs-sm)}
table.gb td,table.gb th{padding:0;border-bottom:.5px solid var(--border);background:#fff;text-align:center;font-weight:400;white-space:nowrap;height:var(--row-h);font-size:var(--fs-xs)}
table.gb thead th{position:sticky;top:0;background:var(--surface-1);z-index:2;font-weight:500;border-top:5px solid var(--band,#2f6fde);line-height:1.3}
.nm{position:sticky;left:0;z-index:3;width:12rem;text-align:left!important;padding:0 .6rem!important;border-right:.5px solid var(--border-strong);overflow:hidden;text-overflow:ellipsis}
thead .nm{z-index:6}
.tt{position:sticky;right:0;width:5.2rem;border-left:.5px solid var(--border-strong);z-index:3}
td.cell{cursor:pointer}td.cell:hover{background:var(--surface-1)}
.muted{color:var(--text-muted)}
/* CURRENT (ui.css) */
.cur .wcell{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:1.6rem;border-radius:6px;padding:0 6px;font-size:var(--fs-xs);font-variant-numeric:tabular-nums;position:relative}
.cur .wcell.late{background:var(--bg-warning);color:var(--text-warning)}
.cur .wcell.awaiting{background:var(--bg-accent);color:var(--text-accent)}
.cur .wcell.missing{background:var(--bg-danger);color:var(--text-danger)}
.cur .wcell.pending{color:var(--text-muted)}
.cur .wcell.excused{background:var(--surface-1);color:var(--text-secondary)}
.cur .wcell.pend::after,.cur .wcell.fail::after{content:"";position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff}
.cur .wcell.pend::after{background:var(--fill-warning)}.cur .wcell.fail::after{background:var(--fill-danger)}
.cur .wcell.unsaved{outline:1.5px solid var(--fill-danger);outline-offset:1px}
/* NEW */
.new .wcell{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:2rem;height:1.6rem;padding:0 6px;font-size:var(--fs-xs);font-variant-numeric:tabular-nums;position:relative;color:var(--text-primary)}
.new .wcell.late::after{content:"ช้า";font-weight:500;color:var(--text-warning);border-left:2px solid var(--fill-warning);padding-left:4px;line-height:1.1}
.new .wcell.awaiting{color:var(--text-accent);font-weight:500}
.new .wcell.awaiting::before{content:"✓ รอตรวจ"}
.new .wcell.missing{color:var(--text-danger);font-weight:600}
.new .wcell.pending{color:var(--text-muted)}
.new .wcell.excused{color:var(--text-secondary)}
.new .wcell.hid{color:var(--text-secondary);letter-spacing:1px}
.new .wcell.pend::before,.new .wcell.fail::before{content:"";position:absolute;top:1px;right:-1px;width:8px;height:8px;border-radius:50%}
.new .wcell.pend::before{border:2px solid var(--text-warning);background:#fff}
.new .wcell.fail::before{background:var(--text-danger)}
.new .wcell.unsaved{text-decoration:underline dotted var(--text-danger) 2px;text-underline-offset:4px}
/* legend */
.cur .gb-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--text-secondary);align-items:center;margin-top:8px;padding:0 8px 8px}
.cur .gb-legend span{display:inline-flex;gap:6px;align-items:center}
.new .gb-legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:var(--fs-xs);color:var(--text-secondary);align-items:center;margin-top:8px;padding:6px 8px 8px;border-top:.5px solid var(--border)}
.new .gb-legend .lg{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.new .gb-legend .lg .wcell{min-width:0;padding:0 2px}
.new .gb-legend .sep{width:1px;height:16px;background:var(--border-strong)}
.new .gb-legend .ttl{font-weight:600;color:var(--text-primary)}
.note{font-size:13px;color:var(--text-secondary);margin:4px 0}
</style></head><body>
<div class="ctl">
<div class="g">กว้าง: <button data-w="1536" aria-pressed="true">1536</button><button data-w="1180" aria-pressed="false">1180</button><button data-w="820" aria-pressed="false">820</button><button data-w="390" aria-pressed="false">390</button></div>
<div class="g">จำนวนงาน: <button data-n="6" aria-pressed="true">6</button><button data-n="14" aria-pressed="false">14</button></div>
</div>
<main>
<div><h2>ปัจจุบัน</h2><div class="vp cur" id="cur"></div></div>
<div><h2>ใหม่ — ตัวเลขเรียบ พื้นขาว สถานะเป็นข้อความ/สัญลักษณ์เล็ก</h2><div class="vp new" id="new"></div>
<p class="note">ความสูงแถวคงเดิม 2.4rem · เซลล์สูง 1.6rem เท่าเดิม (ข้อมูลสมมติ)</p></div>
</main>
<script>
const names=["เด็กชายกิตติ ใจดี","เด็กหญิงมานี รักเรียน","เด็กชายปิติ ชูใจ","เด็กหญิงสุดา แสนสุข","เด็กชายวีระ กล้าหาญ","เด็กหญิงอรุณ แจ่มใส","เด็กชายธนา มั่นคง","เด็กหญิงพิมพ์ ศรีสุข"];
const bands=["#2f6fde","#0d6e6a","#5636b8","#a5560f","#4b7314","#9c2b63"];
const pat=["9","7L","A","M","P","E","8p","8f","8u","10","6L","M","H","9","A"];
function cell(kind,spec){let st="scored",sc="",mark="";
 const m=spec.match(/^(\d+)(L)?([pfu])?$/);
 if(m){sc=m[1];if(m[2])st="late";if(m[3])mark=" "+{p:"pend",f:"fail",u:"unsaved"}[m[3]];}
 else st={A:"awaiting",M:"missing",P:"pending",E:"excused",H:"scored hid"}[spec];
 let body=st==="scored hid"?"•••":({awaiting:"",missing:"–",pending:"·",excused:"ยกเว้น"}[st]??sc);
 const tip={awaiting:"รอตรวจ",missing:"ค้างส่ง",pending:"ยังไม่ถึงกำหนด",excused:"ยกเว้น/ไม่นับ"}[st]||"";
 if(kind==="cur"&&st==="awaiting")body="✓";
 return `<td class="cell"><span class="wcell ${st}${mark}" title="${tip}">${body}</span></td>`}
function table(kind,n){
 let h=`<table class="gb" style="--n:${n}"><thead><tr><th class="nm">ชื่อ</th>`;
 for(let c=0;c<n;c++)h+=`<th style="--band:${bands[c%6]}">งาน ${c+1}<br><span class="muted">/10</span></th>`;
 h+=`<th class="tt">รวม</th></tr></thead><tbody>`;
 names.forEach((nm,r)=>{h+=`<tr><td class="nm">${nm}</td>`;for(let c=0;c<n;c++)h+=cell(kind,pat[(r*3+c*2+r*c)%pat.length]);h+=`<td class="tt">${40+r}<span class="muted">/60</span></td></tr>`});
 return h+"</tbody></table>"}
function legendCur(){const w=(c,b,t)=>`<span><span class="wcell ${c}">${b}</span> ${t}</span>`;
 return `<div class="gb-legend">${w("scored","9","มีคะแนน")}${w("late","7","ส่งช้า")}${w("awaiting","✓","รอตรวจ")}${w("missing","–","ค้างส่ง")}${w("pending","·","ยังไม่ถึงกำหนด")}${w("excused","ยกเว้น","ไม่นับ")}${w("scored pend","8","รอส่งขึ้นระบบ")}${w("scored fail","8","ส่งไม่สำเร็จ")}${w("scored unsaved","8","ยังไม่ได้บันทึก")}</div>`}
function legendNew(){const w=(c,b,t)=>`<span class="lg"><span class="wcell ${c}">${b}</span>${t}</span>`;
 return `<div class="gb-legend"><span class="ttl">สถานะงาน</span>${w("scored","9","มีคะแนน")}${w("late","7","ส่งช้า")}${w("awaiting","","ส่งแล้ว ยังไม่ให้คะแนน")}${w("missing","–","ค้างส่ง")}${w("pending","·","ยังไม่ถึงกำหนด")}${w("excused","ยกเว้น","ไม่นับ")}${w("scored hid","•••","ซ่อนคะแนน")}<span class="sep"></span><span class="ttl">การบันทึก</span>${w("scored pend","8","รอส่งขึ้นระบบ")}${w("scored fail","8","ส่งไม่สำเร็จ")}${w("scored unsaved","8","ยังไม่ได้บันทึก")}</div>`}
let W=1536,N=6;
function render(){
 for(const k of ["cur","new"]){const el=document.getElementById(k);el.style.setProperty("--w",W+"px");
  el.innerHTML=`<div class="scroll">${table(k,N)}</div>`+(k==="cur"?legendCur():legendNew());}}
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{W=+b.dataset.w;document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{N=+b.dataset.n;document.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
render();
</script></body></html>
