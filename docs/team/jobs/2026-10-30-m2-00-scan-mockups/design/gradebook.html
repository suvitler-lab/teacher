<style>

*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:#d9dde4;color:var(--text-primary)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:0 .8em;min-height:44px}
button:focus-visible{outline:none;box-shadow:var(--ring)}svg{flex:none}
.ctl{position:sticky;top:0;z-index:100;background:#1a1f29;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}.ctl .g{display:flex;gap:4px;align-items:center}.ctl b{opacity:.7;font-weight:400}
.ctl button{min-height:30px;padding:0 10px;border-radius:6px;background:#39414f;color:#fff;border-color:#4b5566;font-size:13px}.ctl button.on{background:#2f6fde;border-color:#9cc2f2}
.note{font-size:13px;padding:6px 12px;background:#fff7d6;color:#5a4200}
.stage{padding:12px;display:flex;justify-content:center}.fit{position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--surface-0);overflow:hidden;display:flex;box-shadow:0 6px 30px rgba(0,0,0,.3)}
.rail{width:64px;flex:none;background:#fff;border-right:1px solid var(--border);height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rail a{width:60px;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary);gap:2px}.rail a.on{background:var(--bg-accent);color:var(--text-accent)}

.main{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:calc(var(--fs)*1px);line-height:1.6;height:100%;overflow:hidden}
.row{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}.sp{flex:1}
h1{margin:0;font-size:1.5em;line-height:1.35}
.sec{color:var(--text-secondary);font-size:.9em}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius);background:var(--surface-1);border:.5px solid var(--border)}
.seg button{border:1.5px solid transparent;background:transparent;border-radius:9px;color:var(--text-secondary)}.seg button.on{background:#fff;color:var(--text-primary);font-weight:600;border-color:var(--border-strong)}
.sel{min-width:8em;justify-content:space-between}
.bar{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;background:var(--bg-accent);color:var(--text-accent);border-radius:var(--radius);padding:6px 10px}
.stats{display:flex;gap:1.2em;flex-wrap:wrap;font-size:.95em;color:var(--text-secondary)}.stats b{color:var(--text-primary)}
/* ตัวนำทาง (minimap) */
.nav{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.mini{flex:1;min-width:140px;height:28px;border-radius:8px;background:var(--surface-1);border:.5px solid var(--border);position:relative;overflow:hidden;display:flex}
.mini i{height:100%;border-right:1px solid #fff;opacity:.55}.mini .win{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:7px;background:rgba(47,111,222,.14);pointer-events:none}
.jump{min-height:44px;border-radius:999px;font-size:.9em}
/* ตาราง */
.gb{background:#fff;border:.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);flex:1;min-height:0;position:relative;overflow:hidden}
.scroller{position:absolute;inset:0;overflow:auto;scroll-snap-type:x proximity;scroll-padding-left:calc(var(--w1)*1px);scroll-padding-right:6em}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{background:#fff;border-bottom:.5px solid var(--border);text-align:center;padding:0;white-space:nowrap}
.gh th{position:sticky;top:0;z-index:5;background:var(--surface-1);height:calc(var(--fs)*2.2px);min-height:36px;font-size:.85em;font-weight:600;border-bottom:1px solid var(--border-strong);cursor:pointer;scroll-snap-align:start}
.gh th .grp{display:flex;align-items:center;justify-content:center;gap:.3em;height:100%}
.hd th{position:sticky;top:calc(var(--fs)*2.2px);z-index:5;background:var(--surface-1);vertical-align:top;border-top:0;scroll-snap-align:start}
.hd .cw,.col{width:calc(var(--fs)*4.9px);min-width:calc(var(--fs)*4.9px);max-width:calc(var(--fs)*4.9px)}

.hd .t{font-size:.85em;font-weight:600;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.25em;min-height:2.6em}
.hd .m{font-size:.8em;color:var(--text-secondary);line-height:1.3}
.pbar{height:6px;border-radius:3px;background:var(--border);margin:.3em .2em 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--fill-success)}
.hd th.sum{border-top:4px solid var(--text-muted);background:#e9edf4}
td.n,th.n{position:sticky;left:0;z-index:3;text-align:left;background:#fff;width:calc(var(--w1)*1px);min-width:calc(var(--w1)*1px);max-width:calc(var(--w1)*1px);padding:0 .6em;overflow:hidden;text-overflow:ellipsis;border-right:.5px solid var(--border-strong);box-shadow:6px 0 6px -6px rgba(20,28,46,.25)}
th.n{z-index:7;background:var(--surface-1)}
td.tot,th.tot{position:sticky;right:0;z-index:3;background:#fff;width:calc(var(--fs)*5.2px);min-width:calc(var(--fs)*5.2px);border-left:.5px solid var(--border-strong);box-shadow:-6px 0 6px -6px rgba(20,28,46,.25);font-variant-numeric:tabular-nums}
th.tot{z-index:7;background:var(--surface-1)}
tbody td{height:var(--rh);scroll-snap-align:start}
td.n .no{display:inline-block;min-width:1.6em;color:var(--text-secondary);text-align:right;margin-right:.4em}
td.n .dot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#d6564f;margin-right:.35em}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:2.5em;height:2.2em;border-radius:.6em;font-size:.95em;font-variant-numeric:tabular-nums}
.p-s{background:#fcefc8;color:#7a5200}.p-ok{background:#e0edfc;color:var(--text-accent)}.p-no{background:#fbe6e6;color:var(--text-danger)}.p-late{background:var(--bg-warning);color:var(--text-warning)}.p-ex{background:repeating-linear-gradient(135deg,#e4e8ee 0 5px,#f1f3f7 5px 10px);color:var(--text-secondary)}
td.sumc{background:#f3f5f9;font-variant-numeric:tabular-nums;font-size:.95em}
.menu{position:absolute;z-index:60;background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:0 8px 28px rgba(20,28,46,.22);padding:6px;width:22em;max-width:90%;font-size:calc(var(--fs)*1px)}

.fade{position:absolute;top:0;bottom:0;width:18px;pointer-events:none;z-index:9}

const TYPES={w:['ใบงาน','violet'],e:['แบบฝึกหัด','aqua'],p:['โครงงาน','orange'],x:['สอบย่อย','magenta']};
const ASG=[['w','ใบงาน 1 เลขยกกำลัง','ก.ย.',10,100],['w','ใบงาน 2 เศษส่วน','ก.ย.',10,100],['e','แบบฝึกหัด 1.1','ก.ย.',10,95],['w','ใบงาน 3 ทศนิยม','ก.ย.',10,90],['e','แบบฝึกหัด 1.2','ก.ย.',20,88],['x','สอบย่อยครั้งที่ 1','ต.ค.',20,100],['w','ใบงาน 4 สัดส่วน','ต.ค.',10,80],['e','แบบฝึกหัด 2.1','ต.ค.',10,75],['p','โครงงานคณิตรอบตัว','ต.ค.',30,40],['w','ใบงาน 5 เรขาคณิต','ต.ค.',10,62],['e','แบบฝึกหัด 2.2','พ.ย.',10,30],['x','สอบย่อยครั้งที่ 2','พ.ย.',20,12],['w','ใบงาน 6 สถิติ','พ.ย.',10,5],['e','แบบฝึกหัด 3.1','พ.ย.',10,0]];
const rnd=i=>{const x=Math.sin(i*9301+49297)*233280;return x-Math.floor(x)};
function cell(i,j){ // i=1..44, j=assignment index
  if(i===7)return{k:'ex'};const a=ASG[j];const r=rnd(i*13+j*7);
  if(r*100>a[4])return{k:'no'};if(r<.12)return{k:'ok'};
  const v=Math.round((a[3]*(.5+rnd(i*3+j)*.5))*2)/2;return{k:'s',v,late:r>.9};}
const DATA=[];for(let i=1;i<=44;i++)DATA.push(ASG.map((a,j)=>cell(i,j)));
const SIZES={ipadP:{w:820,h:1180,label:'iPad แนวตั้ง 820×1180',w1:150},ipadL:{w:1180,h:820,label:'iPad แนวนอน 1180×820',w1:190},desk:{w:1440,h:900,label:'คอม 1440×900',w1:220}};
const S={size:'ipadP',fs:'16',den:'normal',grp:'none',collapsed:'',menu:'none'};
const DEN={compact:2.6,normal:3.2,airy:3.9};
const FSOPT={14:'14',16:'16',18:'18',20:'20',24:'24'};
function groups(){ // returns [{key,label,color,idx:[..]}]
  if(S.grp==='none')return [{key:'all',label:'ทุกงาน',color:'violet',idx:ASG.map((_,i)=>i),flat:true}];
  const m={};ASG.forEach((a,i)=>{const k=S.grp==='type'?a[0]:a[2];(m[k]=m[k]||{key:k,label:S.grp==='type'?TYPES[a[0]][0]:a[2],color:S.grp==='type'?TYPES[a[0]][1]:'aqua',idx:[]}).idx.push(i)});return Object.values(m);}
function build(){
  const G=groups();const col=new Set(S.collapsed.split(',').filter(Boolean));const sz=SIZES[S.size];
  let gh='<tr class="gh"><th class="n" rowspan="1" style="z-index:7">&nbsp;</th>';let hd='<tr class="hd"><th class="n" style="vertical-align:middle;font-size:.9em">ชื่อ - สกุล</th>';
  const colsDef=[];
  G.forEach(g=>{const closed=!g.flat&&col.has(g.key);
    if(closed){gh+=`<th data-g="${g.key}" colspan="1" style="color:${'var(--c-'+g.color+')'}"><div class="grp">${ic('chevron-right',16)}${g.label} (${g.idx.length})</div></th>`;
      hd+=`<th class="c sum col" style="--tc:var(--c-${g.color})"><div class="t">รวม ${g.label}</div><div class="m">${g.idx.length} งาน</div><div class="pbar"><i style="width:70%"></i></div></th>`;colsDef.push({sum:g});}
    else{if(g.flat)gh+=`<th colspan="${g.idx.length}"><div class="grp" style="justify-content:flex-start;padding-left:.6em">ทุกงาน ${g.idx.length} ชิ้น</div></th>`;
      else gh+=`<th data-g="${g.key}" colspan="${g.idx.length}" style="color:var(--c-${g.color});background:var(--cb-${g.color})"><div class="grp" style="justify-content:flex-start;padding-left:.6em;position:sticky;left:calc(var(--w1)*1px + 8px)">${ic('chevron-down',16)}${g.label} · ${g.idx.length} งาน</div></th>`;
      g.idx.forEach(j=>{const a=ASG[j];hd+=`<th class="c col" style="--tc:var(--c-${TYPES[a[0]][1]})"><div class="t">${a[1]}</div><div class="m">เต็ม ${a[3]} · ${a[2]}</div><div class="pbar"><i style="width:${a[4]}%"></i></div></th>`;colsDef.push({j});});}});
  gh+='<th class="tot" style="top:0">&nbsp;</th></tr>';hd+='<th class="tot" style="vertical-align:middle;font-size:.9em;top:calc(var(--fs)*2.2px)">สะสม</th></tr>';
  let body='';for(let i=1;i<=44;i++){let got=0,max=0;ASG.forEach((a,j)=>{const c=DATA[i-1][j];if(c.k==='s'){got+=c.v;max+=a[3]}});
    let r=`<tr><td class="n">${DATA[i-1].some(c=>c.k==='no')?'<span class="dot"></span>':''}<span class="no">${i}</span>${NICK[i-1]} สมมติ</td>`;
    colsDef.forEach(d=>{if(d.sum){const ix=d.sum.idx;let s=0,m=0;ix.forEach(j=>{const c=DATA[i-1][j];if(c.k==='s'){s+=c.v;m+=ASG[j][3]}});r+=`<td class="sumc">${m?s+'/'+m:'–'}</td>`;}
      else{const c=DATA[i-1][d.j];const inner={s:`<span class="pill ${c.late?'p-late':'p-s'}">${c.v}</span>`,ok:`<span class="pill p-ok">${ic('check',18)}</span>`,no:`<span class="pill p-no">–</span>`,ex:`<span class="pill p-ex">ยก</span>`}[c.k];r+=`<td>${inner}</td>`}});
    r+=`<td class="tot">${max?got+'/'+max:'0/0'}</td></tr>`;body+=r}
  return `<table><thead>${gh}${hd}</thead><tbody>${body}</tbody></table>`;
}
function menus(){
  if(S.menu==='bulk')return `<div class="menu" style="left:16px;top:26%"><button>${ic('checks',20)}ทั้งห้อง "ส่งแล้ว" (23 คนที่ยังไม่ส่ง)</button><button>${ic('check',20)}ให้เต็มคนที่ส่ง…</button><hr><button class="danger">${ic('x',20)}ล้างคะแนนทั้งงาน…</button></div>`;
  if(S.menu==='cols')return `<div class="menu" style="right:16px;top:24%"><b style="padding:0 .5em">แสดงคอลัมน์ (14 จาก 14)</b>${[...Object.values(TYPES)].map(t=>`<label><input type="checkbox" checked> ${t[0]}</label>`).join('')}<hr><label><input type="checkbox" checked> คอลัมน์สะสม</label><label><input type="checkbox"> แถบความคืบหน้าที่หัวคอลัมน์</label><button style="justify-content:center">ตกลง</button></div>`;
  return '';}
function render(){
  const sz=SIZES[S.size];const f=document.getElementById('frame');
  const fs=+S.fs;const rh=Math.max(44,Math.round(DEN[S.den]*fs));
  f.style.cssText=`width:${sz.w}px;height:${sz.h}px;--fs:${fs};--rh:${rh}px;--w1:${Math.round(sz.w1*fs/16)}`;
  const nav=['w','e','p','x'];
  f.innerHTML=`<nav class="rail"><div class="logo">${ic('checks',24)}</div>${[['home','หน้าหลัก'],['scan','สแกน'],['notebook','คะแนน'],['user-check','เช็คชื่อ']].map(([a,b])=>`<a class="${a==='notebook'?'on':''}">${ic(a,24)}${b}</a>`).join('')}</nav>
  <div class="main" style="position:relative"><div class="row"><h1>สมุดคะแนน</h1><span class="sec">ป.6/1 · คณิตศาสตร์</span><span class="sp"></span><button class="sel">${ic('calendar',20)}1/2569 · ปัจจุบัน</button><button style="background:var(--accent);color:#fff;border-color:var(--accent)">${ic('plus',20)}สร้างงาน</button></div>
  <div class="row"><div class="seg"><button class="on">ทั้งเทอม</button><button>รายเดือน</button></div><div class="seg"><button class="on">ทุกคน</button><button>ค้างส่ง 64</button><button>รอตรวจ 16</button></div><span class="sp"></span><span class="stats"><span>งาน <b>14</b></span><span>อัตราส่ง <b>62%</b></span><span style="color:var(--text-danger)">ค้างส่ง <b style="color:var(--text-danger)">64 ชิ้น</b></span></span></div>
  <div class="bar"><button data-menu="bulk">${ic('chevron-down',20)}ทำทั้งห้อง</button><button>${ic('eye-off',20)}ซ่อนคะแนน</button><span class="sp"></span><button data-menu="cols">${ic('columns-3',20)}คอลัมน์ (14/14)</button><div class="seg" id="grpseg" style="background:#fff"><button data-grp="none" class="${S.grp==='none'?'on':''}">ไม่จัดกลุ่ม</button><button data-grp="type" class="${S.grp==='type'?'on':''}">ตามประเภท</button><button data-grp="month" class="${S.grp==='month'?'on':''}">ตามเดือน</button></div></div>
  <div class="nav"><span class="sec">เลื่อนดู</span><div class="mini" id="mini">${ASG.map(a=>`<i style="flex:1;background:var(--cb-${TYPES[a[0]][1]})"></i>`).join('')}<div class="win" id="win"></div></div>${S.grp!=='none'?groups().map(g=>`<button class="jump" data-j="${g.key}" style="color:var(--c-${g.color})">${g.label}</button>`).join(''):''}${S.grp!=='none'?`<button class="jump" data-fold="1">${S.collapsed?'กางทั้งหมด':'พับทุกกลุ่ม'}</button>`:''}</div>
  <div class="gb"><div class="scroller" id="sc">${build()}</div></div>${menus()}</div>`;
  const s=Math.min(1,(innerWidth-24)/sz.w);f.style.transform=`scale(${s})`;const fit=document.getElementById('fit');fit.style.width=sz.w*s+'px';fit.style.height=sz.h*s+'px';
  const sc=document.getElementById('sc');const upd=()=>{const w=document.getElementById('win'),m=document.getElementById('mini');const tw=sc.scrollWidth,vw=sc.clientWidth;w.style.left=(sc.scrollLeft/tw*100)+'%';w.style.width=Math.min(100,vw/tw*100)+'%'};sc.addEventListener('scroll',upd);upd();
  measure(sc);
  document.getElementById('note').textContent=sz.label+` · ตัวอักษร ${fs}px · ความหนาแน่น ${S.den} (แถว ${rh}px) · ข้อมูลสมมติ 44 คน × 14 งาน · แสดง ${Math.round(s*100)}%`;
}
function measure(sc){const f=document.getElementById('frame');const ths=[...f.querySelectorAll('.hd th.c')];const vis=ths.filter(t=>{const r=t.getBoundingClientRect(),c=sc.getBoundingClientRect();return r.right>c.left+ (+getComputedStyle(f).getPropertyValue('--w1'))*1 && r.left<c.right}).length;
 const small=[...f.querySelectorAll('.main button')].filter(b=>b.offsetHeight<44);
 window.AUDIT={size:S.size,fs:S.fs,den:S.den,grp:S.grp,tableW:sc.scrollWidth,viewW:sc.clientWidth,hscrollTable:sc.scrollWidth>sc.clientWidth,pageH:f.scrollHeight>f.clientHeight+1,pageW:f.scrollWidth>f.clientWidth+1,rowH:f.querySelector('tbody td')?.offsetHeight,colW:f.querySelector('.hd th.c')?.offsetWidth,nameW:f.querySelector('td.n')?.offsetWidth,visibleCols:vis,btnUnder44:small.length,small:small.map(b=>b.textContent.trim().slice(0,10)+b.offsetHeight),headH:f.querySelector('.gh th')?.offsetHeight+f.querySelector('.hd th')?.offsetHeight};}
function ctl(){const c=document.getElementById('ctl');const g=(t,o,k)=>`<div class="g"><b>${t}</b>${Object.entries(o).map(([v,l])=>`<button class="${S[k]===v?'on':''}" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
 c.innerHTML=g('ขนาดจอ',{ipadP:'iPad ตั้ง',ipadL:'iPad นอน',desk:'คอม'},'size')+g('ตัวอักษร px',FSOPT,'fs')+g('ความหนาแน่น',{compact:'กระชับ',normal:'ปกติ',airy:'โปร่ง'},'den')+g('จัดกลุ่ม',{none:'ไม่จัด',type:'ประเภท',month:'เดือน'},'grp')+g('เมนู',{none:'ปิด',bulk:'ทำทั้งห้อง',cols:'คอลัมน์'},'menu');}
document.getElementById('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[b.dataset.k]=b.dataset.v;if(b.dataset.k==='grp')S.collapsed='';ctl();render()});
document.getElementById('frame').addEventListener('click',e=>{const t=e.target;const g=t.closest('[data-g]');const m=t.closest('[data-menu]');const gp=t.closest('[data-grp]');const j=t.closest('[data-j]');const fo=t.closest('[data-fold]');
 if(gp){S.grp=gp.dataset.grp;S.collapsed='';ctl();render();return}
 if(m){S.menu=S.menu===m.dataset.menu?'none':m.dataset.menu;ctl();render();return}
 if(g){const set=new Set(S.collapsed.split(',').filter(Boolean));const k=g.dataset.g;set.has(k)?set.delete(k):set.add(k);S.collapsed=[...set].join(',');render();return}
 if(fo){S.collapsed=S.collapsed?'':groups().map(x=>x.key).join(',');render();return}
 if(j){const th=[...document.querySelectorAll('.gh th[data-g]')].find(x=>x.dataset.g===j.dataset.j);if(th){const sc=document.getElementById('sc');sc.scrollLeft=th.offsetLeft-(+getComputedStyle(document.getElementById('frame')).getPropertyValue('--w1'))}}});
addEventListener('resize',render);ctl();render();
</script></body></html>
