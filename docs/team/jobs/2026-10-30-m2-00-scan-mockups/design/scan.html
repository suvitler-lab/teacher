<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2-00 mockup หน้าสแกนใหม่ (ชื่อนักเรียนสมมติ)</title>
<style>
/* tokens: ค่าเดิมจาก src/styles/tokens.css + ค่าที่ VP-1 เสนอ (ทำเครื่องหมาย VP-1) */
:root{
  --surface-0:#f4f6fa;--surface-1:#eef1f6;--surface-2:#fff;
  --text-primary:#1a1f29;--text-secondary:#59616e;
  --text-muted:#646c79; /* VP-1 */
  --border:rgba(20,28,46,.10);--border-strong:rgba(20,28,46,.18);
  --accent:#2f6fde;--on-accent:#fff;--bg-accent:#e6f0fc;--text-accent:#1a56b0;
  --border-accent:#6f9fe0; /* VP-1 */
  --bg-success:#e3f6ec;--text-success:#12703f;--fill-success:#148352;--border-success:#a6e0c2; /* fill VP-1 */
  --bg-warning:#fbefd6;--text-warning:#8a5a08;--fill-warning:#e79a1c;--border-warning:#f0cf8c;
  --bg-danger:#fbe6e6;--text-danger:#a32626;--fill-danger:#c93a3a;--border-danger:#f0b2b2; /* fill VP-1 */
  --bg-purple:#efeafc;--text-purple:#5a3fb0;
  --tint-violet-bg:#ece7fb;--tint-violet-fg:#5636b8;--tint-aqua-bg:#d9f2f0;--tint-aqua-fg:#0d6e6a;
  --radius-xs:6px;--radius-sm:8px;--radius:12px;--radius-lg:16px; /* xs = VP-1 */
  --shadow-card:0 1px 2px rgba(20,28,46,.06),0 2px 8px rgba(20,28,46,.05); /* VP-1 */
  --ring:0 0 0 3px rgba(47,111,222,.22),0 0 0 1.5px var(--accent); /* VP-1 */
  --font-sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* ใหม่ในงานนี้ (เสนอเพิ่ม): ช่องยกเว้น */
  --excused-bg:repeating-linear-gradient(135deg,#e4e8ee 0 5px,#f1f3f7 5px 10px);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:#d9dde4;color:var(--text-primary);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--ring)}
svg{flex:none}
/* ---------- แผงควบคุม mockup (ไม่ใช่ส่วนของแอป) ---------- */
.ctl{position:sticky;top:0;z-index:100;background:#1a1f29;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl b{opacity:.7;font-weight:400;margin-right:2px}
.ctl button{min-height:30px;padding:0 10px;border-radius:6px;background:#39414f;color:#fff;border-color:#4b5566;font-size:13px}
.ctl button.on{background:#2f6fde;border-color:#9cc2f2}
.ctl button:disabled{opacity:.35;cursor:not-allowed}
.stage{padding:12px;display:flex;justify-content:center}
.fit{position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--surface-0);overflow:auto;display:flex;box-shadow:0 6px 30px rgba(0,0,0,.3);font-size:16px}
.note{font-size:13px;padding:6px 12px;background:#fff7d6;color:#5a4200}
/* ---------- เปลือกแอป ---------- */
.rail{width:64px;flex:none;background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;position:sticky;top:0;height:100%;align-self:flex-start}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rail a{width:60px;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--text-secondary);text-decoration:none}
.rail a.on{background:var(--bg-accent);color:var(--text-accent)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--surface-2);border-top:1px solid var(--border);display:flex;z-index:30}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary);gap:2px}
.tabbar a.on{color:var(--text-accent)}
.main{flex:1;min-width:0;padding:var(--pad,16px);display:flex;flex-direction:column;gap:6px;position:relative}
.phone .main{padding-bottom:84px}
.phone.frame{display:block}
.phone .cell{padding:3px 3px 3px 5px}
.card{background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--pad,16px)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.h1{font-size:24px;font-weight:600;line-height:1.35}
.muted{color:var(--text-muted)}.sec{color:var(--text-secondary)}
/* ---------- ป้าย / chip ---------- */
.chip,.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:16px;min-height:32px;padding:0 12px;white-space:nowrap}
.badge.ok{background:var(--bg-success);color:var(--text-success);border:.5px solid var(--border-success)}
.badge.warn{background:var(--bg-warning);color:var(--text-warning);border:.5px solid var(--border-warning)}
.badge.acc{background:var(--bg-accent);color:var(--text-accent);border:.5px solid var(--border-accent)}
.chip.subj{background:var(--tint-aqua-bg);color:var(--tint-aqua-fg)}
.chip.type{background:var(--tint-violet-bg);color:var(--tint-violet-fg)}
.pill{min-height:44px;border-radius:999px;background:var(--surface-2);color:var(--text-accent);font-weight:500;font-size:17px;padding:0 16px}
/* ---------- แถบหัวรอบ (ไม่ sticky) ---------- */
.ctx{background:var(--bg-accent);color:var(--text-accent);border-radius:var(--radius);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.ctx .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx button{min-height:44px}
.ctx .btnq{background:var(--surface-2);color:var(--text-accent);font-weight:500}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius);background:var(--surface-2);border:.5px solid var(--border-strong)}
.seg button{min-height:48px;border:1.5px solid transparent;background:transparent;color:var(--text-secondary);font-size:16px;padding:0 16px;border-radius:var(--radius-sm)}
.seg button.on{background:var(--bg-accent);color:var(--text-accent);font-weight:600;border-color:var(--border-accent)}
.phone .seg{width:100%}.phone .seg button{flex:1;padding:0 4px;min-height:44px;font-size:15px}
.fullpill{font-weight:600;font-size:16px}
/* ---------- ช่องสแกน ---------- */
.scanrow{display:flex;gap:8px}
.scanin{flex:1;display:flex;align-items:center;gap:10px;min-width:0;height:var(--input-h,64px);border:2px solid var(--border-accent);border-radius:var(--radius);padding:0 14px;background:var(--surface-2);box-shadow:var(--ring)}
.scanin span{font-size:17px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scanrow .cam{width:var(--input-h,64px);height:var(--input-h,64px);padding:0}
.stick .scanrow{position:sticky;top:0;z-index:20;background:var(--surface-0);padding:6px 0;margin:-6px 0 0;box-shadow:0 6px 8px -6px rgba(20,28,46,.25)}
/* ---------- feedback ---------- */
.fb{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:var(--radius);border:.5px solid var(--border);min-height:72px}
.fb .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.fb .nm{font-size:20px;font-weight:600;line-height:1.3}.fb .sb{font-size:16px}.fb .sc{font-size:26px;font-weight:600;white-space:nowrap;margin-left:auto}
.fb.success{background:var(--bg-success);border-color:var(--border-success);color:var(--text-success)}.fb.success .ic{background:var(--fill-success)}
.fb.acc{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}.fb.acc .ic{background:var(--accent)}
.fb.idle{background:var(--surface-2);color:var(--text-secondary)}.fb.idle .ic{background:var(--text-muted)}
/* ---------- ScorePad ---------- */
.pad .head{display:flex;align-items:center;gap:8px;min-height:44px}
.pad .head .t{font-size:20px;font-weight:600}
.entryrow{display:flex;gap:12px;align-items:stretch;margin-top:8px;flex-wrap:wrap}
.entry{display:flex;align-items:center;gap:8px;font-size:24px;color:var(--text-secondary)}
.entry .box{width:150px;height:var(--key-h,64px);border:2px solid var(--accent);border-radius:var(--radius);box-shadow:var(--ring);font-size:34px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;justify-content:center}
.quick{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.quick button{flex:1 1 60px;max-width:112px;min-height:var(--key-h,64px);flex-direction:column;gap:0;background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);border-radius:var(--radius);line-height:1.2;padding:0 6px}
.quick button small{font-size:14px}.quick button b{font-size:22px}
.queue{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding:4px 8px;border-radius:var(--radius);background:var(--bg-warning);border:.5px solid var(--border-warning);color:var(--text-warning)}
.queue .lb{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px}
.queue button{min-height:48px;background:var(--surface-2);border-color:var(--border-warning);color:var(--text-primary);font-size:16px}
.keys{display:grid;grid-template-columns:repeat(6,1fr) 1.7fr;grid-template-rows:var(--key-h,64px) var(--key-h,64px);gap:8px;margin-top:8px}
.keys button{font-size:26px;border-radius:var(--radius);padding:0}
.keys .save{grid-row:1/3;grid-column:7;background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:20px;font-weight:600;flex-direction:column;gap:4px}
.narrow .keys{grid-template-columns:repeat(6,1fr);grid-template-rows:var(--key-h,64px) var(--key-h,64px) var(--key-h,64px)}
.narrow .keys .save{grid-row:3;grid-column:1/7;flex-direction:row}
.keys button:disabled{opacity:.5}
/* ---------- ผังเลขที่ ---------- */
.seat{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:6px}
.cell{height:var(--cell-h,58px);border-radius:var(--radius-sm);border:1.5px solid var(--border-strong);background:var(--surface-1);padding:4px 4px 3px 6px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:var(--num-fs,22px);min-height:44px;gap:0;align-items:stretch;position:relative}
.cell .t{display:flex;justify-content:space-between;align-items:center;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.cell .t svg{width:16px;height:16px}
.cell .nm{font-size:var(--nm-fs,16px);font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.scored{background:var(--bg-success);border-color:var(--border-success);color:var(--text-success)}
.cell.late{background:var(--bg-warning);border-color:var(--border-warning);color:var(--text-warning)}
.cell.await{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.cell.miss{background:var(--surface-2);border:1.5px dashed var(--border-danger);color:var(--text-danger)}
.cell.exc{background:var(--excused-bg);border:1.5px solid var(--border-strong);color:var(--text-secondary)}
.cell.cur{outline:3px solid var(--accent);outline-offset:1px;box-shadow:var(--ring)}
.cell.q::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--fill-warning);border-radius:0 0 6px 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:16px;margin-top:10px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:22px;border-radius:5px;border:1.5px solid;display:inline-flex;align-items:center;justify-content:center}
.sw svg{width:16px;height:16px}
.sw.scored{background:var(--bg-success);border-color:var(--border-success);color:var(--text-success)}.sw.late{background:var(--bg-warning);border-color:var(--border-warning);color:var(--text-warning)}
.sw.await{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}.sw.miss{background:#fff;border:1.5px dashed var(--border-danger);color:var(--text-danger)}
.sw.exc{background:var(--excused-bg);border-color:var(--border-strong);color:var(--text-secondary)}
.gh{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:8px}
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none}
/* ---------- สแกนล่าสุด (แถบ) ---------- */
.recent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:60px}
.recent .lb{font-weight:600;font-size:16px;color:var(--text-secondary);white-space:nowrap}
.rchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;border-radius:999px;border:.5px solid var(--border-strong);background:var(--surface-1);padding:0 14px 0 6px;font-size:16px}
.rchip .av{width:32px;height:32px;border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.rlist{border-top:.5px solid var(--border);margin-top:8px;max-height:176px;overflow:auto}
.rlist div{display:flex;gap:10px;align-items:center;min-height:44px;border-bottom:.5px solid var(--border);font-size:16px}
/* ---------- ซ้อนทับ ---------- */
.scrim{position:sticky;inset:0;}
.ovl{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(20,28,46,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.phone .ovl{align-items:flex-end;padding:0}
.sheet{background:var(--surface-2);border-radius:var(--radius-lg);box-shadow:0 8px 28px rgba(20,28,46,.25);width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:8px}
.phone .sheet{max-width:none;border-radius:16px 16px 0 0;padding-bottom:28px}
.sheet h3{margin:0;font-size:20px;line-height:1.35}
.sheet button{min-height:64px;justify-content:flex-start;font-size:18px;padding:0 16px}
.sheet button.danger{color:var(--text-danger);border-color:var(--border-danger);background:var(--bg-danger)}
.sheet button.pri{background:var(--accent);color:#fff;border-color:var(--accent);justify-content:center}
.sheet .two{display:flex;gap:8px}.sheet .two button{flex:1;justify-content:center}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--toast-b,24px);z-index:70;background:#1a1f29;color:#fff;border-radius:var(--radius);padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;min-height:56px;font-size:16px;max-width:calc(100% - 24px);box-shadow:0 8px 28px rgba(20,28,46,.3)}
.toast button{min-height:44px;background:#fff;color:#1a56b0;border-color:#fff;font-weight:600}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;width:60%;background:#9cc2f2;border-radius:0 0 12px 12px}
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--radius);padding:8px 12px;min-height:48px;font-size:16px}
/* ---------- ตั้งค่ารอบ / หน้าหลัก ---------- */
.opt{width:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:12px;min-height:72px;border-radius:var(--radius);padding:10px 14px;background:var(--surface-2);border:1px solid var(--border-strong)}
.opt.on{border:2px solid var(--border-accent);background:var(--bg-accent)}
.opt .tt{font-weight:600;font-size:17px}.opt .ss{font-size:16px;color:var(--text-secondary)}
.opts{display:grid;gap:8px}.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:repeat(2,1fr)}
.phone .opts.c3,.phone .opts.c2{grid-template-columns:1fr}
.step{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;margin:10px 0 6px}
.step i{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.tag{font-size:16px;background:var(--bg-success);color:var(--text-success);border-radius:999px;padding:0 10px;min-height:28px;display:inline-flex;align-items:center;gap:4px}
.bigbtn{min-height:72px;background:var(--accent);color:#fff;border-color:var(--accent);font-size:20px;font-weight:600;border-radius:var(--radius);padding:0 28px}
.startbar{position:sticky;bottom:0;background:var(--surface-0);padding:8px 0 0;display:flex;gap:12px;align-items:center;margin-top:auto}
.phone .startbar{bottom:64px}
.resume{background:var(--bg-accent);border:2px solid var(--border-accent)}
.wrow{display:flex;align-items:center;gap:10px;min-height:64px;border-bottom:.5px solid var(--border)}
.wrow:last-child{border:0}
.sumlist{display:flex;flex-wrap:wrap;gap:6px}
.sumlist .rchip{padding:0 12px;min-height:44px}
/* ---------- แบบ "ก่อน (ปัจจุบัน)" จาก src/styles/scan.css ---------- */
.before .card{padding:14px;border-radius:12px;box-shadow:none}
.before .ctxb{background:var(--bg-accent);color:var(--text-accent);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.before .ctxb .p{background:#fff;border-radius:8px;padding:6px 12px;font-size:15px}
.before .ctxb .c{border-radius:999px;padding:2px 10px;font-size:13px}
.before .ctxb button{min-height:36px;font-size:14px;border-radius:8px;padding:0 10px}
.before .smallrow{font-size:13px;display:flex;gap:8px;justify-content:space-between;align-items:center;color:var(--text-secondary)}
.before .bd{font-size:13px;min-height:26px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;background:var(--bg-success);color:var(--text-success)}
.before .scanin{height:56px}.before .scanin span{font-size:16px}
.before .fb{min-height:0;padding:12px 16px}.before .fb .nm{font-size:17px;font-weight:500}.before .fb .sb{font-size:13px}.before .fb .ic{width:44px;height:44px}
.before .qk{display:flex;gap:4px;justify-content:center;margin:8px 0}.before .qk button{min-height:26px;height:26px;font-size:12px;border-radius:999px;padding:0 10px;background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.before .spad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px}.before .spad button{height:52px;font-size:20px;min-height:0;border-radius:8px}
.before .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.before .sg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.before .sc-cell{height:38px;border-radius:8px;border:.5px solid var(--border);background:var(--surface-1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.1;padding:0 2px;min-height:0}
.before .sc-cell .nm{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.before .sc-cell.scored{background:var(--bg-success);border-color:var(--border-success);color:var(--text-success)}
.before .sc-cell.late{background:var(--bg-warning);border-color:var(--border-warning);color:var(--text-warning)}
.before .sc-cell.await{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.before .sc-cell.miss{border-style:dashed;border-color:var(--border-danger);color:var(--text-danger)}
.before .sc-cell.exc{background:var(--surface-1)}
.before .sc-cell.cur{outline:2px solid var(--accent);outline-offset:-1px}
.before .rrow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:.5px solid var(--border);font-size:15px}
.measure{position:absolute;right:8px;top:8px;z-index:90;background:#fff7d6;border:1px solid #d8b84a;border-radius:6px;padding:4px 8px;font-size:13px;color:#5a4200}
.orig .main{gap:10px}.orig .modebtn{font-size:14px;background:#fff}.orig .ctxb button{min-height:44px}
.orig .smallrow .tst{min-height:44px;font-size:14px;padding:0 12px}.orig .smallrow{min-height:44px}
.orig .bd{font-size:14px;min-height:32px}
.orig .sg{grid-template-columns:repeat(8,minmax(0,1fr))}.phone.orig .sg{grid-template-columns:repeat(6,minmax(0,1fr))}
.orig .sc-cell{height:44px;font-size:14px;cursor:pointer;background:var(--surface-1);font-family:inherit;color:inherit;padding:0 2px}.orig .sc-cell .nm{font-size:11px}

  if(S.ovl==='bulk')return `<div class="ovl" role="alertdialog" aria-modal="true" aria-label="ยืนยันให้เต็มทั้งห้อง"><div class="sheet"><h3>ให้คะแนนเต็มทั้งห้อง?</h3><div style="font-size:17px">จะให้ <b>10/10</b> กับ <b>23 คน</b> ที่ยังไม่ส่ง · ไม่รวมคนที่ส่งแล้ว 19 คน และยกเว้น 2 คน<br><span class="sec" style="font-size:16px">เลิกทำได้ 5 วินาทีหลังกด</span></div><div class="two"><button autofocus>ยกเลิก</button><button class="pri">ให้เต็ม 23 คน</button></div></div></div>`;
  if(S.ovl==='toastUndo')return `<div class="toast" role="status" aria-live="polite">${ic('check',20)}<span>ยกเลิกการส่งของเลขที่ 12 แล้ว</span><button>${ic('arrow-back-up',20)}เลิกทำ (5)</button><span class="bar"></span></div>`;
  if(S.ovl==='toastMode')return `<div class="toast" role="status" aria-live="polite">${ic('checks',20)}<span>เปลี่ยนเป็น “ให้เต็ม” · มีผลกับการสแกนครั้งถัดไป</span><button>เข้าใจแล้ว</button></div>`;
  return '';
}
/* ---------- แบบเดิม (ก่อน) ---------- */
function before(){
  const {st}=states('type');
  const cells=Array.from({length:44},(_,i)=>{const n=i+1;const s=st[n];return `<div class="sc-cell ${s}${n===21?' cur':''}">${n}<span class="nm">${NICK[i]}</span></div>`}).join('');
  return `<div class="ctxb"><span class="p">ป.6/1</span><span class="c" style="background:var(--tint-aqua-bg);color:var(--tint-aqua-fg)">คณิตศาสตร์</span><span class="c" style="background:var(--tint-violet-bg);color:var(--tint-violet-fg)">ใบงาน</span><span class="sp"></span><span>เต็ม 10 · กรอกทีละคน</span><button>จบรอบ</button></div>
  <div class="smallrow"><span>เศษส่วน</span><span><span class="bd">เครื่องยิงพร้อม</span> <span class="bd">ออนไลน์</span></span></div>
  <div class="scanrow"><label class="scanin">${ic('qrcode',24)}<span>ยิง QR หรือพิมพ์เลขที่ แล้วกด Enter</span></label><button class="cam" style="width:56px;height:56px;padding:0">${ic('camera',24)}</button></div>
  <div class="fb acc" style="background:var(--bg-accent);color:var(--text-accent)"><span class="ic" style="background:var(--accent)">${ic('pencil',22)}</span><div><div class="nm">มะม่วง ตัวอย่าง</div><div class="sb">เลขที่ 21 · รับงานแล้ว ใส่คะแนนแล้วกด Enter</div></div></div>
  <div class="card"><div class="smallrow" style="font-size:16px;color:var(--text-primary);margin-bottom:6px"><b style="font-weight:500">มะม่วง ตัวอย่าง <span class="sec" style="font-weight:400">เลขที่ 21</span></b><span>ให้คะแนนทีหลัง</span></div>
  <div class="qk"><button>10/10</button><button>9/10</button><button>8/10</button><button>5/10</button></div>
  <div style="display:flex;gap:12px;align-items:flex-start"><div style="width:150px;height:52px;border:1px solid var(--accent);border-radius:8px;flex:none"></div><span style="font-size:24px;line-height:52px">/ 10</span><div class="spad">${[1,2,3,4,5,6,7,8,9,'.5',0,'⌫'].map(k=>`<button>${k}</button>`).join('')}<button style="grid-column:1/4;background:#9bb7ec;color:#fff;border-color:#9bb7ec">บันทึก</button></div></div></div>
  <div class="cols"><div class="card" style="padding:0"><div class="smallrow" style="padding:12px 16px;background:var(--surface-1);border-radius:12px 12px 0 0"><span>สแกนล่าสุด</span><span>รอบนี้ 1 คน</span></div><div class="rrow"><span class="av" style="width:30px;height:30px;border-radius:50%;background:var(--bg-accent);display:inline-flex;align-items:center;justify-content:center">ม</span><span style="flex:1">มะม่วง ตัวอย่าง<br><span class="sec" style="font-size:14px">เลขที่ 21</span></span><span class="bd" style="background:var(--bg-accent);color:var(--text-accent)">รอคะแนน</span></div><div style="height:320px"></div></div>
  <div class="card"><div style="font-size:13px;margin-bottom:8px"><b style="font-weight:500">ผังเลขที่ ป.6/1</b></div><div class="sg">${cells}</div><div style="font-size:12px;margin-top:8px;color:var(--text-secondary)">ส่งแล้ว 18 · ยังไม่ส่ง 26</div></div></div>`;
}
/* ---------- ประกอบหน้า ---------- */
function shell(inner,on){
  const sz=SIZES[S.size];
  const nav=[['home','home','หน้าหลัก'],['scan','scan','สแกน'],['notebook','notebook','คะแนน'],['user-check','user-check','เช็คชื่อ'],['dice-3','dice-3','สุ่มชื่อ'],['chart-bar','chart-bar','รายงาน'],['users','users','นักเรียน'],['settings','settings','ตั้งค่า']];
  const act=on==='home'?'home':'scan';
  if(sz.shell==='tab'){const t=nav.filter(n=>['home','scan','notebook','user-check'].includes(n[0])).concat([['dots','settings','เพิ่มเติม']]);
    return `<div class="main stick" style="--pad:${sz.pad}px">${inner}</div><nav class="tabbar" aria-label="เมนูหลัก">${t.map(n=>`<a class="${n[0]===act?'on':''}">${ic(n[1],24)}${n[2]}</a>`).join('')}</nav>`;}
  return `<nav class="rail" aria-label="เมนูหลัก"><div class="logo">${ic('checks',24)}</div>${nav.map(n=>`<a class="${n[0]===act?'on':''}">${ic(n[1],24)}${n[2]}</a>`).join('')}</nav><div class="main ${sz.two?'':'stick'}" style="--pad:${sz.pad}px">${inner}</div>`;
}
function render(){
  const sz=SIZES[S.size];const f=document.getElementById('frame');
  const showBefore=S.ba==='before'&&S.size==='ipadP'&&S.screen==='type';const isOrig=!showBefore&&['full','type','recv','sheet','cam'].includes(S.screen);
  f.className='frame '+S.size+(showBefore?' before':'')+(isOrig?' before orig':'');
  f.style.cssText=`width:${sz.w}px;height:${sz.h}px;--cols:${sz.cols};--cell-h:${sz.cell}px;--num-fs:${sz.num}px;--nm-fs:${sz.nm}px;--key-h:${sz.key}px;--input-h:${sz.input}px;--pad:${sz.pad}px;--toast-b:${sz.shell==='tab'?'80px':'24px'}`;
  let inner;
  if(showBefore)inner=before();
  else if(S.screen==='home')inner=home();
  else if(S.screen==='setup')inner=setup();
  else if(S.screen==='end')inner=endScreen();
  else inner=inRound(S.screen);
  const mainInner=showBefore?`<div class="main" style="--pad:20px;gap:12px">${inner}</div>`:null;
  f.innerHTML=(showBefore?`<nav class="rail" style="width:64px"><div class="logo">${ic('checks',24)}</div></nav>`+mainInner:shell(inner,S.screen))+(showBefore?'':overlay());
  const s=Math.min(1,(window.innerWidth-24)/sz.w);f.style.transform=`scale(${s})`;
  const fit=document.getElementById('fit');fit.style.width=sz.w*s+'px';fit.style.height=sz.h*s+'px';
  document.getElementById('note').textContent=(showBefore?'แบบก่อน (ปัจจุบัน) จำลองจาก scan.css จริง · ':'')+SIZES[S.size].label+` · แสดงที่ ${Math.round(s*100)}% ของขนาดจริง · พื้นที่ภายในเลื่อนได้เหมือนหน้าจอจริง`;
  measure();
}
function measure(){
  const f=document.getElementById('frame');
  const m=f.querySelector('.measure');if(m)m.remove();
  const small=[...f.querySelectorAll('button,a,label.scanin')].filter(b=>b.offsetParent&&b.offsetHeight<44&&(!f.classList.contains('before')||f.classList.contains('orig'))&&!b.closest('.cell'));
  const nm=[...f.querySelectorAll('.nm')].filter(e=>e.scrollWidth>e.clientWidth+1).length;
  const hs=f.scrollWidth>f.clientWidth;
  window.AUDIT={size:S.size,screen:S.screen,ovl:S.ovl,ba:S.ba,hscroll:hs,frameW:f.clientWidth,contentH:f.scrollHeight,frameH:f.clientHeight,vscroll:f.scrollHeight>f.clientHeight+1,nickCut:nm,btnUnder44:small.length,cellW:(f.querySelector('.cell,.sc-cell')||{}).offsetWidth,cellH:(f.querySelector('.cell,.sc-cell')||{}).offsetHeight,keyH:(f.querySelector('.keys button,.spad button')||{}).offsetHeight,keyW:(f.querySelector('.keys button,.spad button')||{}).offsetWidth,smallList:small.map(b=>b.textContent.trim().slice(0,12)+':'+b.offsetWidth+'x'+b.offsetHeight)};
}
function ctl(){
  const c=document.getElementById('ctl');
  const grp=(t,o,k)=>`<div class="g"><b>${t}</b>${Object.entries(o).map(([v,l])=>`<button class="${S[k]===v?'on':''}" data-k="${k}" data-v="${v}" ${(k==='ovl'&&['home','setup','end','sheet'].includes(S.screen)&&v!=='none')?'disabled':''}>${l}</button>`).join('')}</div>`;
  c.innerHTML=grp('ขนาดจอ',{ipadP:'iPad ตั้ง',ipadL:'iPad นอน',phone:'มือถือ',desk:'คอม'},'size')+grp('หน้าจอ',SCREENS,'screen')+grp('ซ้อนทับ',OVLS,'ovl')+grp('เทียบ',{after:'หลัง (ใหม่)',before:'ก่อน (ปัจจุบัน)'},'ba');
  const dis=!(S.size==='ipadP'&&S.screen==='type');c.querySelectorAll('[data-k=ba][data-v=before]').forEach(b=>b.disabled=dis);
}
document.getElementById('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;S[b.dataset.k]=b.dataset.v;
  if(['home','setup','end','sheet'].includes(S.screen))S.ovl='none';
  if(!(S.size==='ipadP'&&S.screen==='type'))S.ba='after';
  const q=new URLSearchParams(S);history.replaceState(null,'','#'+q.toString());ctl();render();});
(function(){const h=new URLSearchParams(location.hash.slice(1));for(const k of['size','screen','ovl','ba'])if(h.get(k))S[k]=h.get(k);})();
addEventListener('resize',render);ctl();render();
</script>
</body>
</html>
