<style>

*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:#d9dde4;color:var(--text-primary)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--border-strong);background:#fff;border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:0 .8em;min-height:44px}
svg{flex:none}
.ctl{position:sticky;top:0;z-index:100;background:#1a1f29;color:#fff;padding:8px 12px;display:flex;gap:16px;font-size:14px}.ctl .g{display:flex;gap:4px;align-items:center}.ctl b{opacity:.7;font-weight:400}
.ctl button{min-height:30px;padding:0 10px;border-radius:6px;background:#39414f;color:#fff;border-color:#4b5566;font-size:13px}.ctl button.on{background:#2f6fde;border-color:#9cc2f2}
.note{font-size:13px;padding:6px 12px;background:#fff7d6;color:#5a4200}
.stage{padding:12px;display:flex;justify-content:center}.fit{position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--surface-0);overflow:auto;display:flex;box-shadow:0 6px 30px rgba(0,0,0,.3)}
.rail{width:64px;flex:none;background:#fff;border-right:1px solid var(--border);height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;position:sticky;top:0;align-self:flex-start}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.rail a{width:60px;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary);gap:2px}.rail a.on{background:var(--bg-accent);color:var(--text-accent)}
.main{flex:1;min-width:0;padding:20px;font-size:calc(var(--fs)*1px);line-height:1.6;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.6em;line-height:1.35}.sec{color:var(--text-secondary);font-size:.9em}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);align-items:start}.cols.one{grid-template-columns:1fr}
.card{background:#fff;border:.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:12px 14px}
.menu a{display:flex;align-items:center;gap:.7em;min-height:calc(var(--rh)*1px);padding:0 .6em;border-radius:var(--radius);color:var(--text-secondary)}
.menu a.on{background:var(--bg-accent);color:var(--text-accent);font-weight:600}
.set{display:flex;align-items:center;gap:1em;min-height:calc(var(--rh)*1px + 1.2em);padding:.6em 0;border-top:1px solid var(--border);flex-wrap:wrap}.set:first-of-type{border:0}
.set .l{flex:1;min-width:10em}.set .l b{display:block}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius);background:var(--surface-1);border:.5px solid var(--border)}
.seg button{min-height:48px;border:1.5px solid transparent;background:transparent;border-radius:9px;color:var(--text-secondary);padding:0 1em}.seg button.on{background:#fff;color:var(--text-primary);font-weight:600;border-color:var(--border-strong)}
.step{display:flex;align-items:center;gap:.5em}.step button{width:56px;padding:0;min-height:56px}.step .v{min-width:7em;text-align:center;background:var(--surface-1);border-radius:var(--radius);min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1.1em}
.prev{background:var(--surface-0);border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:.8em 1em;display:grid;gap:.5em}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:2.5em;height:2.2em;border-radius:.6em;font-size:.95em}
.badge{display:inline-flex;align-items:center;gap:.4em;border-radius:999px;padding:0 .8em;min-height:2em;background:var(--bg-success);color:var(--text-success)}
.trow{display:flex;align-items:center;gap:.8em;background:#fff;border-radius:var(--radius);padding:0 .8em;min-height:calc(var(--rh)*1px)}
</style></head><body>
