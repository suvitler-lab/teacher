<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตารางสอน · mockup Gate 2 · งานครบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&family=Mali:wght@500;600;700&family=Anuphan:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   Hub chrome (not part of the app): direction / screen / skin / time / size
   ===================================================================== */
:root{--hub-bg:#1f1a16;--hub-fg:#f6ecdf;--hub-mut:#cdbca8;--hub-on:#f3cd9c;--hub-on-fg:#2a1f16;--hub-line:rgba(255,235,210,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#d8d2c9;font-family:"Sarabun","Leelawadee UI",system-ui,sans-serif;color:#2a1f16;overflow-x:hidden}
.hub{background:var(--hub-bg);color:var(--hub-fg);padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:5}
.hub-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hub-title{font:500 16px/1.3 "Mitr","Leelawadee UI",sans-serif;margin:0}
.hub-sub{font-size:13px;color:var(--hub-mut)}
.hub-grow{flex:1}
.hub-tog{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--hub-line);background:transparent;color:var(--hub-fg);font:inherit;font-size:14px;cursor:pointer}
.hub-tog:hover{background:rgba(255,255,255,.08)}
.hub-groups{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.hg{display:flex;align-items:center;gap:6px;min-width:0}
.hg-l{font-size:13px;color:var(--hub-mut);white-space:nowrap}
.hg-seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:rgba(255,255,255,.07);border-radius:10px}
.hg-seg button{min-height:36px;padding:0 11px;border:0;border-radius:8px;background:transparent;color:var(--hub-fg);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.hg-seg button:hover{background:rgba(255,255,255,.08)}
.hg-seg button[aria-pressed="true"]{background:var(--hub-on);color:var(--hub-on-fg);font-weight:600}
.hg select{display:none;width:100%;min-height:42px;border-radius:10px;border:1px solid var(--hub-line);background:#2c251f;color:var(--hub-fg);font:inherit;font-size:15px;padding:0 8px}
.hub-info{font-size:14px;line-height:1.55;color:var(--hub-mut);margin:0}
.hub-info b{color:var(--hub-fg);font-weight:600}
.hub-info .good{color:#c9e3a6}.hub-info .weak{color:#f5c99a}
.hub :focus-visible{outline:3px solid var(--hub-on);outline-offset:2px}
.hub.min .hub-groups,.hub.min .hub-info{display:none}
@media (max-width:760px){
  .hub{padding:6px 10px 8px;gap:6px}
  .hub-sub{display:none}
  .hub-groups{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
  .hg{flex-direction:column;align-items:stretch;gap:0}
  .hg-l{font-size:12px}
  .hg-seg{display:none}
  .hg select{display:block}
  .hub-info{font-size:13px}
}
.stage{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.stage.framed{padding:16px 0 8px}
.scaler{position:relative;flex:none}
.device{position:relative;overflow:hidden;transform-origin:0 0}
.stage.framed .device{border-radius:20px;box-shadow:0 0 0 8px #2b2520,0 24px 60px rgba(0,0,0,.28)}
.size-note{font-size:13px;color:#4a3c2f;margin:14px 8px 0;text-align:center}

/* =====================================================================
   App — tokens copied from src/styles/tokens.css (light) · 3 skins
   ===================================================================== */
.app{--tap:44px;--rail-w:96px;
  --t-xs:13px;--t-sm:14px;--t-md:16px;--t-lg:18px;--t-xl:22px;--t-2xl:28px;--t-3xl:38px;--t-4xl:52px;
  --tint-blue-bg:#e0edfc;--tint-blue-fg:#1a56b0;--tint-green-bg:#e7f3d7;--tint-green-fg:#4b7314;
  --tint-orange-bg:#fce8d8;--tint-orange-fg:#9a4f0c;--tint-magenta-bg:#f8e2ee;--tint-magenta-fg:#9c2b63;
  position:absolute;inset:0;container:app/inline-size;background:var(--surface-0);color:var(--text-primary);
  font-family:var(--font-sans);font-size:16px;line-height:1.6;overflow:hidden}
.app[data-skin="warm"],.sk-warm{--font-sans:"Sarabun","Leelawadee UI",system-ui,sans-serif;--font-display:"Mitr","Leelawadee UI",system-ui,sans-serif;--display-weight:500;--display-track:0;--font-num:"Mitr","Leelawadee UI",system-ui,sans-serif;
  --radius-xs:8px;--radius-sm:12px;--radius:16px;--radius-lg:22px;--radius-btn:999px;--radius-hero:28px;--card-bw:1px;--btn-bw:1px;
  --s1:4px;--s2:8px;--s3:13px;--s4:17px;--s5:25px;--s6:34px;
  --surface-0:#f6efe4;--surface-1:#ede2d1;--surface-2:#fffaf2;--text-primary:#2a1f16;--text-secondary:#574535;--text-muted:#6b5846;
  --border:rgba(90,60,30,.14);--border-strong:rgba(90,60,30,.24);--border-control:#9b8670;--card-border:rgba(90,60,30,.12);
  --accent:#b4462a;--accent-hover:#983a22;--on-accent:#fff;--bg-accent:#f8e0d4;--text-accent:#9a3a22;--accent-2:#e9a23b;--on-accent-2:#2a1f16;
  --hero-bg:#f3cd9c;--hero-fg:#2a1f16;--hero-muted:#5a3f26;--hero-chip:rgba(255,250,242,.55);
  --bg-success:#e6f0d6;--text-success:#46661c;--fill-success:#6f9a33;--bg-warning:#fbecd0;--text-warning:#85520a;--fill-warning:#e9a23b;--bg-danger:#f9e0da;--text-danger:#a52a1c;--fill-danger:#cc4730;
  --illo-1:#e9a23b;--illo-2:#b4462a;--illo-3:#6f9a33;--illo-4:#fffaf2;
  --rail-bg:#2f241b;--rail-fg:#e8d8c4;--rail-active-bg:#f3cd9c;--rail-active-fg:#2a1f16;--rail-label:#b9a48c;--ink:#2a1f16;
  --shadow-card:0 2px 0 rgba(90,60,30,.06),0 10px 24px rgba(90,60,30,.08);--shadow-pop:0 14px 34px rgba(90,60,30,.22);--now:#b4462a}
.app[data-skin="pro"],.sk-pro{--font-sans:"IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;--font-display:"IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;--display-weight:700;--display-track:-.01em;--font-num:"IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --radius-xs:4px;--radius-sm:6px;--radius:10px;--radius-lg:14px;--radius-btn:8px;--radius-hero:16px;--card-bw:1px;--btn-bw:1px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --surface-0:#edf1f7;--surface-1:#e3e9f2;--surface-2:#fff;--text-primary:#0f1b2d;--text-secondary:#3f4c63;--text-muted:#56627a;
  --border:rgba(15,35,71,.12);--border-strong:rgba(15,35,71,.22);--border-control:#8794ab;--card-border:rgba(15,35,71,.10);
  --accent:#1f56d6;--accent-hover:#1946b3;--on-accent:#fff;--bg-accent:#e3ecfd;--text-accent:#1a4bbf;--accent-2:#22b8cf;--on-accent-2:#0f2347;
  --hero-bg:#0f2347;--hero-fg:#fff;--hero-muted:#b9c7e0;--hero-chip:rgba(255,255,255,.12);
  --bg-success:#dff5e9;--text-success:#11683b;--fill-success:#16a05d;--bg-warning:#fdf0d5;--text-warning:#865507;--fill-warning:#f0a422;--bg-danger:#fde4e4;--text-danger:#b01f1f;--fill-danger:#d83535;
  --illo-1:#22b8cf;--illo-2:#fff;--illo-3:#5b8cff;--illo-4:#f0a422;
  --rail-bg:#0f2347;--rail-fg:#c6d2e8;--rail-active-bg:#22b8cf;--rail-active-fg:#0f2347;--rail-label:#8ea0c2;--ink:#0f2347;
  --shadow-card:0 1px 2px rgba(15,35,71,.06),0 6px 18px rgba(15,35,71,.07);--shadow-pop:0 12px 32px rgba(15,35,71,.22);--now:#d83535}
.app[data-skin="playful"],.sk-playful{--font-sans:"Anuphan","Leelawadee UI",system-ui,sans-serif;--font-display:"Mali","Leelawadee UI",system-ui,sans-serif;--display-weight:700;--display-track:0;--font-num:"Mali","Leelawadee UI",system-ui,sans-serif;
  --radius-xs:8px;--radius-sm:12px;--radius:16px;--radius-lg:20px;--radius-btn:14px;--radius-hero:24px;--card-bw:2px;--btn-bw:2px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --surface-0:#eaf3ff;--surface-1:#dceafc;--surface-2:#fff;--text-primary:#15142b;--text-secondary:#3b3a5c;--text-muted:#514f73;
  --border:rgba(21,20,43,.14);--border-strong:rgba(21,20,43,.3);--border-control:#15142b;--card-border:#15142b;
  --accent:#3b5bfd;--accent-hover:#2c48e0;--on-accent:#fff;--bg-accent:#e1e7ff;--text-accent:#2c48e0;--accent-2:#ffd43b;--on-accent-2:#15142b;
  --hero-bg:#ffd43b;--hero-fg:#15142b;--hero-muted:#4d3f00;--hero-chip:rgba(255,255,255,.6);
  --bg-success:#d4f7e6;--text-success:#0b6b45;--fill-success:#22c58b;--bg-warning:#fff1c2;--text-warning:#7a5400;--fill-warning:#ffb020;--bg-danger:#ffe0e6;--text-danger:#b3123c;--fill-danger:#ff4d6d;
  --illo-1:#ff6fa8;--illo-2:#3b5bfd;--illo-3:#22c58b;--illo-4:#15142b;
  --rail-bg:#15142b;--rail-fg:#dcdbf5;--rail-active-bg:#ffd43b;--rail-active-fg:#15142b;--rail-label:#9b99c9;--ink:#15142b;
  --shadow-card:4px 4px 0 #15142b;--shadow-pop:6px 6px 0 #15142b;--now:#e0244f}


/* ===== hub (mockup chrome) overrides ===== */
@media (max-width:760px){ .hub .hg-l{font-size:13px} }
.hub.min{position:fixed;right:12px;bottom:12px;padding:0;background:transparent;z-index:200}
.hub.min .hub-top>:not(.hub-tog){display:none}
.hub.min .hub-tog{background:var(--hub-bg);color:var(--hub-fg);min-height:44px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
@media (max-width:760px){ .hub.min{bottom:96px} }
#print-root{display:none}

/* ===== app base ===== */
.app{--t-2xs:13px}
.app.big{--t-2xs:18px;--t-xs:18px;--t-sm:20px;--t-md:24px;--t-lg:26px;--t-xl:30px;--t-2xl:34px;--tap:52px;font-size:24px}
.app[data-skin="playful"],.sk-playful{--now:#c41a43}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);line-height:1.35;margin:0}
.app p{margin:0}
:where(.app) :is(button,input,select){font:inherit;color:inherit}
.app button{cursor:pointer}
.app :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.grow{flex:1 1 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text-secondary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);min-width:var(--tap);padding:6px 16px;border-radius:var(--radius-btn);
  border:var(--btn-bw) solid var(--border-control);background:var(--surface-2);color:var(--text-primary);font-size:var(--t-sm);font-weight:500;line-height:1.3;text-align:center;white-space:nowrap}
.btn:hover{background:var(--surface-1)}
.btn:active{background:var(--border-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover)}
.app[data-skin="playful"] .btn.pri{border-color:var(--ink)}
.btn.pri.dz{background:var(--text-danger);border-color:var(--text-danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-1)}
.btn.danger{color:var(--text-danger)}
.btn.icon{padding:0;width:var(--tap)}
.btn.sm-l{padding:6px 12px}
.btn[aria-disabled="true"],.btn:disabled{background:var(--surface-1);color:var(--text-muted);border-style:dashed;border-color:var(--border-control);cursor:not-allowed}
.card{background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:calc(var(--radius-btn) + 3px);background:var(--surface-1);border:1px solid var(--border)}
.seg button{min-height:44px;min-width:56px;padding:0 16px;border-radius:var(--radius-btn);border:0;background:transparent;color:var(--text-secondary);font-size:var(--t-sm);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-primary);font-weight:700;box-shadow:0 0 0 1px var(--border-control)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font-size:var(--t-2xs);font-weight:700;line-height:1.6;white-space:nowrap;vertical-align:middle}
.tag.now{background:var(--now);color:#fff}
.tag.next{background:var(--surface-2);color:var(--text-accent);box-shadow:inset 0 0 0 1.5px var(--text-accent)}
.tag.today{background:var(--ink);color:var(--surface-2)}
.tag.act{background:var(--surface-1);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-control)}
.tag.arch{background:var(--surface-2);color:var(--text-secondary);border:1.5px dashed var(--border-control)}
.tag.new{background:var(--bg-warning);color:var(--text-warning);box-shadow:inset 0 0 0 1.5px var(--text-warning)}
.tag.done{background:var(--surface-2);color:var(--text-secondary);box-shadow:inset 0 0 0 1px var(--border-strong)}
.tag.off{background:var(--bg-warning);color:var(--text-warning)}
.tag.ro{background:var(--surface-1);color:var(--text-primary)}
.note{display:flex;gap:6px;align-items:center;font-size:var(--t-sm);color:var(--text-secondary);margin:0 0 12px}
.hint{font-size:var(--t-xs);color:var(--text-secondary)}
.sec-t{font-size:var(--t-lg);display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.sum{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:var(--t-sm);color:var(--text-secondary)}
.sel{min-height:44px;padding:0 10px;border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--surface-2);font-size:var(--t-sm);max-width:100%}

/* ===== shell ===== */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100%;position:relative}
.rail{background:var(--rail-bg);color:var(--rail-fg);display:flex;flex-direction:column;gap:2px;padding:8px 6px;height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.rail-logo{flex:none;width:42px;height:42px;border-radius:11px;margin:0 auto 4px;background:var(--rail-active-bg);color:var(--rail-active-fg);display:grid;place-items:center}
.rail-gl{font-size:13px;color:var(--rail-label);text-align:center;white-space:nowrap;line-height:1.3;padding:4px 0 1px;margin-top:2px;border-top:1px solid color-mix(in srgb,var(--rail-label) 35%,transparent)}
.rail-group:first-of-type .rail-gl{border-top:0;margin-top:0}
.rail-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:var(--tap);padding:3px 2px;
  font-size:13px;line-height:1.25;white-space:nowrap;color:var(--rail-fg);border-radius:var(--radius-sm);border:0;background:transparent}
.app.big .rail-item{min-height:44px}
.rail-item:hover{background:color-mix(in srgb,var(--rail-fg) 14%,transparent)}
.rail-item[aria-current="page"]{background:var(--rail-active-bg);color:var(--rail-active-fg);font-weight:600}
.rail-spacer{flex:1}
.rail-sync{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--rail-fg);padding:2px 0}
.rail-sync i{width:8px;height:8px;border-radius:50%;background:var(--fill-success)}
.rail-sync.off i{background:var(--fill-warning)}
.main{height:100%;overflow-y:auto;overflow-x:hidden;padding:20px 24px 40px;position:relative}
.tabbar{display:none}
@container app (min-width:721px) and (max-width:999px){ .main{padding:16px 20px 32px} }
@container app (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding:14px 14px 104px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface-2);border-top:1px solid var(--border);padding:6px 4px 10px}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--text-secondary);line-height:1.25;white-space:nowrap;background:transparent;border:0;padding:4px 0;min-height:var(--tap)}
  .tab[aria-current="page"]{color:var(--text-accent);font-weight:700}
  .tab-scan .bub{width:56px;height:56px;border-radius:50%;margin-top:-20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:3px solid var(--surface-2);box-shadow:var(--shadow-pop)}
}

/* ===== page header ===== */
.uh{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.uh-l{display:flex;align-items:center;gap:10px;min-width:0}
.uh-ic{width:44px;height:44px;border-radius:12px;flex:none;background:var(--bg-accent);color:var(--text-accent);display:grid;place-items:center}
.uh-title{font-size:var(--t-xl)}
.uh-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:var(--t-sm);color:var(--text-secondary)}
.uh-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ban{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 8px 8px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:var(--t-sm);font-weight:600}
.ban.warn{background:var(--bg-warning);color:var(--text-warning);border:1px solid var(--text-warning)}
.emp{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.emp-t{font-size:var(--t-lg)}
.skel .sk-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.skel .sk-b{height:64px;border-radius:var(--radius-sm);background:var(--surface-1)}

/* ===== shared period cell (PeriodChip) ===== */
.cell{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;min-width:0;min-height:56px;padding:6px 8px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border-strong);font-size:var(--t-sm);line-height:1.4;overflow:hidden}
.cell[data-a]{cursor:pointer}
.cell[data-a]:hover{border-color:var(--text-primary)}
.cell .ck,.row .ck{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;font-weight:700;color:var(--text-primary)}
.cell .ck b,.row .ck b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell .sj,.row .sj{max-width:100%;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-xs)}
.t-blue{--tb:var(--tint-blue-bg);--tf:var(--tint-blue-fg)}
.t-green{--tb:var(--tint-green-bg);--tf:var(--tint-green-fg)}
.t-orange{--tb:var(--tint-orange-bg);--tf:var(--tint-orange-fg)}
.t-magenta{--tb:var(--tint-magenta-bg);--tf:var(--tint-magenta-fg)}
.cell.cls{background:var(--tb);border-color:var(--tf);border-left-width:5px}
.cell.cls .ck{color:var(--tf)}
.cell.act{background:var(--surface-2);border:2px solid var(--border-control)}
.cell.arch{background:var(--surface-2);border:2px dashed var(--border-control)}
.cell.arch .ck{color:var(--text-secondary)}
.cell.empty{align-items:center;justify-content:center;border:2px dashed var(--border-control);background:transparent;color:var(--text-secondary)}
.cell.empty:hover{background:var(--bg-accent);color:var(--text-accent);border-color:var(--text-accent)}
.cell.none{border:1px solid var(--border);background:transparent}
.cell.now{box-shadow:0 0 0 3px var(--now)}
.cell.new{box-shadow:0 0 0 3px var(--text-warning)}
.app.big .cell .ck b,.app.big .row .ck b{white-space:normal}

/* ===== ก paper grid ===== */
.a-wrap{overflow-x:auto;padding:3px}
.a-grid{display:grid;gap:4px;min-width:min-content}
.a-grid [role="row"]{display:contents}
.a-ch{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;border-radius:var(--radius-sm);background:var(--surface-1);font-size:var(--t-xs);line-height:1.35;color:var(--text-secondary);text-align:center}
.a-ch b{font-size:var(--t-sm);color:var(--text-primary)}
.a-ch.now{background:var(--now);color:#fff}
.a-ch.now b{color:#fff}
.a-dn{position:sticky;left:0;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:4px;border-radius:var(--radius-sm);background:var(--surface-1);font-size:var(--t-sm);font-weight:700}
.a-dn.today{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--ink)}
.a-brk{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:repeating-linear-gradient(135deg,var(--surface-1) 0 6px,var(--surface-0) 6px 12px)}
.a-brk span{writing-mode:vertical-rl;font-size:var(--t-xs);color:var(--text-secondary);font-weight:600;background:var(--surface-0);padding:6px 1px;border-radius:6px;white-space:nowrap}
.m-grid .cell{min-height:48px;padding:4px 6px}
.m-grid .cell.cls{border-left-width:4px}
.m-grid .a-ch{padding:4px 2px}

/* ===== day list (phone ก, ค, big text) ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border-control);background:var(--surface-2);font-size:var(--t-sm)}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--surface-2);border-color:var(--ink);font-weight:700}
.day-h{margin:14px 0 10px}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dl .row{display:grid;grid-template-columns:minmax(0,6.5em) minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 12px;border-radius:var(--radius);
  border:1px solid var(--border-strong);background:var(--surface-2);text-align:left;font-size:var(--t-sm);line-height:1.4}
.dl button.row:hover{border-color:var(--text-primary)}
.dl .row.cls{background:var(--tb);border-color:var(--tf);border-left-width:5px}
.dl .row.cls .ck{color:var(--tf)}
.dl .row.act{border:2px solid var(--border-control)}
.dl .row.arch{background:var(--surface-2);border:2px dashed var(--border-control)}
.dl .row.empty{border:2px dashed var(--border-control);background:transparent;color:var(--text-secondary)}
.dl .row.past{background:var(--surface-1);border-left-width:1px}
.dl .row.past .ck{color:var(--text-secondary)}
.dl .row.now{box-shadow:0 0 0 3px var(--now)}
.dl .rt{display:flex;flex-direction:column;font-size:var(--t-xs);color:var(--text-secondary)}
.dl .rt b{font-size:var(--t-sm);color:var(--text-primary)}
.dl .rb{display:flex;flex-direction:column;min-width:0}
.dl .rx{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dl .add{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--text-accent)}
.dl .brk{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:var(--radius);font-size:var(--t-xs);font-weight:600;color:var(--text-secondary);
  background:repeating-linear-gradient(135deg,var(--surface-1) 0 6px,var(--surface-0) 6px 12px)}
.dl .brk span{background:var(--surface-0);padding:0 6px;border-radius:6px}

/* ===== ข calendar ===== */
.b-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.b-nav .sec-t{margin:0;justify-content:center}
.b-wrap{border:var(--card-bw) solid var(--card-border);border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-card);overflow:hidden}
.b-grid{display:grid;column-gap:6px;padding:0 8px 6px 0;position:relative}
.b-grid [role="row"]{display:contents}
.b-dh{display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-sm);font-weight:700;border-bottom:1px solid var(--border-strong)}
.b-dh.today{box-shadow:inset 0 -3px 0 var(--ink)}
.b-tl{display:flex;flex-direction:column;align-items:flex-end;padding:2px 8px 0 0;font-size:var(--t-xs);line-height:1.35;color:var(--text-secondary);border-top:1px solid var(--border)}
.b-tl b{color:var(--text-primary);font-size:var(--t-xs)}
.b-ln{border-top:1px solid var(--border);pointer-events:none}
.b-brk{display:flex;align-items:center;padding:0 10px;font-size:var(--t-xs);font-weight:600;color:var(--text-secondary);background:repeating-linear-gradient(135deg,var(--surface-1) 0 6px,var(--surface-2) 6px 12px)}
.b-brk span{background:var(--surface-2);padding:0 6px;border-radius:6px}
.b-grid .cell{min-height:0;margin:3px 0}
.b-nowl{align-self:start;height:0;position:relative;z-index:4;pointer-events:none}
.b-nowl span{position:absolute;right:2px;top:-12px;background:var(--now);color:#fff;font-size:var(--t-xs);font-weight:700;line-height:24px;padding:0 6px;border-radius:999px;white-space:nowrap}
.b-nowline{align-self:start;height:0;border-top:3px solid var(--now);position:relative;z-index:4;pointer-events:none}

/* ===== ค today-first ===== */
.c-wrap{display:grid;gap:16px;align-items:start}
.c-wrap.two{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.c-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.c-now{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));overflow:hidden}
.c-blk{padding:14px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.c-blk + .c-blk{border-left:1px solid var(--border)}
.c-blk.main{background:var(--hero-bg);color:var(--hero-fg)}
.c-k{font-size:var(--t-sm);color:var(--text-secondary)}
.c-blk.main .c-k{color:var(--hero-muted)}
.c-v{font-family:var(--font-display);font-weight:var(--display-weight);font-size:var(--t-xl);line-height:1.35}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.c-today,.c-week{padding:14px}
.c-week .chips{margin-bottom:10px}

/* ===== dialogs ===== */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(20,14,8,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(440px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);border:var(--card-bw) solid var(--card-border);overflow:hidden;margin:0}
.dlg.wide{width:min(560px,100%)}
.dlg.sm{width:min(420px,100%)}
.dlg-h{display:flex;align-items:flex-start;gap:8px;padding:14px 12px 6px 20px}
.dlg-h h2{font-size:var(--t-lg)}
.dlg-h p{font-size:var(--t-sm);color:var(--text-secondary)}
.dlg-b{padding:8px 20px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:12px 20px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
@container app (max-width:720px){
  .scrim{align-items:flex-end;padding:0}
  .dlg,.dlg.wide,.dlg.sm{width:100%;max-height:90%;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
  .dlg.full{max-height:100%;height:100%;border-radius:0}
}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.lg{font-size:var(--t-sm);font-weight:700}
.inp{min-height:44px;border:1px solid var(--border-control);border-radius:var(--radius-sm);background:var(--surface-2);padding:6px 10px;font-size:var(--t-md);width:100%;min-width:0}
.inp[aria-invalid="true"]{border:2px solid var(--text-danger)}
.ferr{display:flex;gap:6px;align-items:center;font-size:var(--t-sm);color:var(--text-danger);font-weight:700}
.warnt{display:flex;gap:6px;align-items:center;color:var(--text-warning);font-weight:600}
.app fieldset{border:0;margin:0;padding:0;min-width:0}
.app legend{font-size:var(--t-sm);font-weight:700;padding:0;margin-bottom:6px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rad{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px;border:1.5px solid var(--border-control);border-radius:var(--radius-sm);font-size:var(--t-sm);cursor:pointer}
.rad:has(input:checked){border-color:var(--accent);background:var(--bg-accent);color:var(--text-accent);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.rad:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.rad input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.err-sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:var(--radius-sm);background:var(--bg-danger);color:var(--text-danger);font-size:var(--t-sm);font-weight:700;border:1px solid var(--text-danger)}
.cnt{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.cnt output{font-size:var(--t-xl);min-width:2ch;text-align:center;font-weight:700}
.tp-list{display:flex;flex-direction:column;gap:6px}
.tp-row{display:grid;grid-template-columns:4.5em minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:var(--t-sm)}
.tp-row.hd{font-size:var(--t-xs);color:var(--text-secondary);font-weight:600}
.br-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;margin-bottom:6px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.dayb{min-width:52px;min-height:44px;border-radius:999px;border:1.5px solid var(--border-control);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:var(--t-sm);padding:0 12px}
.dayb[aria-pressed="true"]{background:var(--ink);color:var(--surface-2);border-color:var(--ink);font-weight:700}
@container app (max-width:720px){ .br-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px} .br-row .bn{grid-column:1/-1} }
.mlist{gap:8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface-2);font-size:var(--t-md);text-align:left}
.mi:hover{background:var(--surface-1)}
.mi.dz{color:var(--text-danger)}
.mi[aria-disabled="true"]{background:var(--surface-1);color:var(--text-muted);border-style:dashed;cursor:not-allowed}
.cl{margin:0;padding-left:20px;font-size:var(--t-md)}
.pk h3{font-size:var(--t-md);margin-bottom:6px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;width:max-content;max-width:calc(100% - 24px);padding:6px 6px 6px 16px;border-radius:var(--radius);background:var(--ink);color:var(--surface-2);font-size:var(--t-sm);box-shadow:var(--shadow-pop)}
.toast .btn{background:var(--surface-2);color:var(--ink);border-color:var(--surface-2)}
@container app (max-width:720px){ .toast{bottom:92px;width:calc(100% - 24px)} }

/* ===== home ===== */
.hero{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:14px 20px;border-radius:var(--radius-hero);background:var(--hero-bg);color:var(--hero-fg)}
.hero h1{font-size:var(--t-xl)}
.hero p{color:var(--hero-muted);font-size:var(--t-sm)}
.strip{display:flex;align-items:center;gap:12px;min-height:56px;padding:5px 6px 5px 14px;margin-top:10px;border-radius:var(--radius);background:var(--surface-2);border:var(--card-bw) solid var(--card-border);border-left:5px solid var(--now)}
.strip-t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;font-size:var(--t-sm);line-height:1.45}
.strip-t .lk{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.strip-a{display:flex;gap:8px;flex:none}
@container app (max-width:720px){ .strip{flex-direction:column;align-items:stretch;padding:8px 10px} .strip-a .btn{width:100%} .strip-a .sec{display:none} }
.h-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;margin-top:12px;align-items:start}
@container app (max-width:1000px){ .h-grid{grid-template-columns:minmax(0,1fr)} }
.h-card{padding:12px 16px}
.h-card h2{font-size:var(--t-lg);margin-bottom:4px}
.h-rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:12px}
.h-room{border-top:5px solid var(--tf,var(--border))}
.h-room h2{display:flex;align-items:center;gap:6px}
.h-focus .h-fv{font-size:var(--t-lg);font-weight:700;margin:4px 0}
.tl{list-style:none;margin:0;padding:0}
.tli{display:grid;grid-template-columns:3.6em 34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:50px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:var(--t-sm)}
.tli:last-child{border-bottom:0}
.tli .tm{font-family:var(--font-num);font-weight:600}
.tli .nd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-1);color:var(--text-primary)}
.tli.per .nd{background:var(--tb,var(--surface-1));color:var(--tf,var(--text-primary));box-shadow:inset 0 0 0 1.5px var(--tf,var(--border-control))}
.tli h3{font-family:var(--font-sans);font-size:var(--t-sm);font-weight:600;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.tli p{font-size:var(--t-xs);color:var(--text-secondary)}
.tli.now{background:var(--bg-accent);border-radius:var(--radius-sm)}
.tli.fold button,.tli.more button{justify-self:start}
.tli.fold,.tli.more{grid-template-columns:minmax(0,1fr)}
.stat{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:var(--t-sm)}
.stat:last-child{border-bottom:0}
.stat b{font-family:var(--font-num);font-size:var(--t-md)}

/* ===== settings ===== */
.set-sec{padding:16px 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.set-sec h2{font-size:var(--t-lg);display:flex;align-items:center;gap:8px}
.opt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid var(--border-control);border-radius:var(--radius);cursor:pointer;background:var(--surface-2);font-size:var(--t-sm)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .on{display:none}
.opt:has(input:checked) .on{display:inline-flex}
.opt-t{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.opt-t b{font-size:var(--t-md)}
.opt-d{color:var(--text-secondary)}
fieldset:disabled .opt{cursor:not-allowed;background:var(--surface-1)}
.thumb{display:block;height:84px;border-radius:var(--radius-sm);background:var(--surface-0);border:1px solid var(--border);padding:7px;position:relative;overflow:hidden}
.th-g{display:grid;gap:3px;height:100%}
.th-g i{border-radius:3px;background:var(--surface-2);border:1px solid var(--border-strong)}
.th-g i.f{background:var(--accent);border-color:var(--accent)}
.th-g i.k{border:1.5px dashed var(--border-control);background:transparent}
.th-l{position:absolute;left:7px;right:7px;top:46%;height:2px;background:var(--now)}
.th-big{height:42%;border-radius:6px;background:var(--hero-bg);margin-bottom:5px}
.th-row{height:12%;border-radius:4px;background:var(--surface-2);border:1px solid var(--border-strong);margin-bottom:4px}
.th-row.f{background:var(--accent);border-color:var(--accent)}
.sw3{display:flex;gap:4px;height:100%}
.sw3 i{flex:1;border-radius:6px;border:1px solid var(--border-strong)}
.switch{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);text-align:left;font-size:var(--t-sm)}
.switch:disabled{background:var(--surface-1);cursor:not-allowed}
.sw{width:52px;height:30px;border-radius:999px;background:var(--surface-1);border:2px solid var(--border-control);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-secondary)}
.switch[aria-checked="true"] .sw{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] .sw::after{left:25px;background:var(--on-accent)}
.sw-t{display:flex;flex-direction:column}
.saved{display:flex;align-items:center;gap:6px;min-height:1.6em;font-size:var(--t-sm);color:var(--text-success);font-weight:700}
.row-link{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--border);font-size:var(--t-sm)}
@container app (max-width:720px){ .opt-grid{grid-template-columns:minmax(0,1fr)} .opt{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:12px} .opt .thumb{grid-row:1/3;height:64px} }

/* ===== print (S8) ===== */
.paper-wrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--shadow-card);border:1px solid var(--border-strong);background:#fff}
.paper{width:1123px;height:794px;transform-origin:0 0;background:#fff;color:#000;padding:45px}
.pp{font-family:"Sarabun","Leelawadee UI",sans-serif;color:#000;line-height:1.35}
.pp h1{font:600 17pt/1.3 "Sarabun","Leelawadee UI",sans-serif;margin:0}
.pp .meta{font-size:11pt;margin:2pt 0 8pt}
.pp table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11pt}
.pp th,.pp td{border:1px solid #000;padding:4pt;vertical-align:middle;text-align:center;height:50pt}
.pp thead th{height:auto;font-weight:700}
.pp thead small{display:block;font-weight:400;font-size:11pt}
.pp th.day{width:62pt;text-align:left}
.pp .lun{width:24pt;padding:0;background:#e6e6e6}
.pp .lun span{writing-mode:vertical-rl;font-size:11pt;white-space:nowrap}
.pp td b{font-weight:700}
.pp td i{font-style:italic}
.pp .pp-f{display:flex;justify-content:space-between;margin-top:8pt;font-size:11pt}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{height:auto;background:#fff;overflow:visible}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .paper{width:auto;height:auto;padding:0;transform:none!important}
}

<script>
/* ===== data: the school's paper timetable (design/reference/1.webp) — 7 periods x 60 min, lunch 11:30–12:30 ===== */
const DAYS = [
  { s: "จ", m: "จันทร์", sh: "จันทร์", date: 9 }, { s: "อ", m: "อังคาร", sh: "อังคาร", date: 10 }, { s: "พ", m: "พุธ", sh: "พุธ", date: 11 },
  { s: "พฤ", m: "พฤหัสบดี", sh: "พฤหัส", date: 12 }, { s: "ศ", m: "ศุกร์", sh: "ศุกร์", date: 13 }, { s: "ส", m: "เสาร์", sh: "เสาร์", date: 14 }, { s: "อา", m: "อาทิตย์", sh: "อาทิตย์", date: 15 },
];
const ROOMS = { "ป.6/1": "blue", "ป.6/2": "green", "ป.6/3": "orange", "ป.6/4": "magenta" };
const ROOMLIST = Object.keys(ROOMS);
const SUBJECTS = ["คณิตศาสตร์", "ดนตรี"];
const C = (room, subj) => ({ kind: "class", room, subj });
const A = (name) => ({ kind: "act", name });
const BASE = {
  "0-2": C("ป.6/2", "คณิตศาสตร์"), "0-5": C("ป.6/4", "ดนตรี"), "0-7": A("PLC กลุ่มสาระ"),
  "1-2": C("ป.6/1", "คณิตศาสตร์"), "1-6": C("ป.6/2", "คณิตศาสตร์"),
  "2-2": C("ป.6/4", "คณิตศาสตร์"), "2-4": C("ป.6/3", "คณิตศาสตร์"),
  "3-2": C("ป.6/3", "คณิตศาสตร์"), "3-6": A("ลูกเสือ"),
  "4-3": C("ป.6/4", "คณิตศาสตร์"), "4-4": C("ป.6/1", "คณิตศาสตร์"), "4-5": A("ชุมนุม"), "4-6": A("สวดมนต์"), "4-7": A("PLC สายชั้น"),
};
const clone = (o) => JSON.parse(JSON.stringify(o));
let TT = { periods: [[510, 570], [570, 630], [630, 690], [750, 810], [810, 870], [870, 930], [930, 990]], breaks: [{ name: "พักกลางวัน", s: 690, e: 750 }], days: [1, 1, 1, 1, 1, 0, 0], slots: clone(BASE) };
const TERMS = [["2/2569", "ภาคเรียน 2/2569"], ["1/2569", "ภาคเรียน 1/2569"], ["2/2568", "ภาคเรียน 2/2568 (ปีที่ผ่านมา)"]];
const TIMES = [["2-490", "พ 08:10"], ["2-590", "พ 09:50"], ["2-645", "พ 10:45"], ["2-730", "พ 12:10"], ["2-770", "พ 12:50"], ["2-1005", "พ 16:45"], ["3-900", "พฤ 15:00"], ["5-600", "ส 10:00"]];
const STATES = [["ok", "ปกติ"], ["empty", "ยังไม่กรอก"], ["loading", "กำลังโหลด"], ["offline", "ออฟไลน์"], ["conflict", "ชนกันสองเครื่อง"], ["old", "ภาคเก่า ดูอย่างเดียว"], ["arch", "ห้องเก็บแล้ว"], ["fail", "บันทึกไม่ผ่าน"]];
const TASKS = [
  { t: -1, i: "alert", h: "งานค้าง: ใบงานที่ 4 สมการ", p: "ป.6/1 ยังไม่ส่ง 5 คน · เลยกำหนด 2 วัน" },
  { t: 480, i: "ucheck", h: "เช็คชื่อเช้า ป.6/4", p: "ครูประจำชั้น · มา 31 จาก 32 คน" },
  { t: 900, i: "scan", h: "สแกนรับงาน แบบฝึกหัดเศษส่วน ชุดที่ 3", p: "ครบกำหนด 15:00 · ป.6/3 ยังไม่ส่ง 6 คน" },
  { t: 960, i: "book", h: "กรอกคะแนนสอบย่อย บทที่ 5", p: "ป.6/2 · 34 คน" },
];

/* ===== state ===== */
const S = { dir: "A", page: "tt", skin: "warm", now: { d: 2, t: 590 }, st: "ok", big: false, size: "fit", hubMin: false, strips: { a: true, b: true, c: true }, hlay: "a", names: "ts", day: 2, bview: "week",
  ov: null, draft: null, errs: {}, saving: false, saveErr: false, tdraft: null, terrs: {}, toast: null, undo: null, last: { room: "", subj: "คณิตศาสตร์" },
  pastOpen: false, saved: "", focusCell: null, focusSel: null, dlgFocus: null, ret: null, retSel: null, gfocus: null, hubFocus: null, backup: null, _top: null };
let I = null;

/* ===== helpers ===== */
const $ = (q) => document.querySelector(q);
const pad = (n) => String(n).padStart(2, "0");
const hm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const toM = (v) => { const [h, m] = String(v || "0:0").split(":").map(Number); return h * 60 + m; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n, s = 20) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ro = () => S.st === "old";
const off = () => S.st === "offline";
const editable = () => !ro() && !off();
const isArch = (r) => S.st === "arch" && r === "ป.6/1";
const W = () => document.getElementById("app").clientWidth;
const phone = () => W() <= 720;
const wide = () => W() >= 1100;
const days = () => TT.days.map((v, i) => (v ? i : -1)).filter((i) => i >= 0);
const pAt = (p) => TT.periods[p - 1];
function seq() {
  const it = TT.periods.map((x, i) => ({ k: "p", p: i + 1, s: x[0], e: x[1] }));
  TT.breaks.forEach((b) => it.push({ k: "b", name: b.name, s: b.s, e: b.e }));
  return it.sort((a, b) => a.s - b.s || (a.k === "b" ? 1 : -1));
}
const slot = (d, p) => (p <= TT.periods.length && TT.days[d] ? TT.slots[`${d}-${p}`] || null : null);
const lblFull = (s) => (s.kind === "class" ? `${s.subj ? s.subj + " " : ""}${s.room}` : `กิจกรรม ${s.name}`);
function counts() {
  let c = 0, a = 0, h = 0;
  for (const k in TT.slots) { const [d, p] = k.split("-").map(Number); const s = slot(d, p); if (!s) continue; s.kind === "class" ? c++ : a++; h += pAt(p)[1] - pAt(p)[0]; }
  return { c, a, n: c + a, h: h / 60 };
}
const sumText = () => { const k = counts(); return `สอน ${k.c} · กิจกรรม ${k.a} · รวม ${k.n} คาบ (${Number.isInteger(k.h) ? k.h : k.h.toFixed(1)} ชม.)`; };
const nextSchool = (d) => { for (let k = 1; k <= 7; k++) if (TT.days[(d + k) % 7]) return (d + k) % 7; return 0; };
const dDate = (d) => DAYS[d].date + (d < S.now.d ? 7 : 0);
const dayName = (d, k) => (k === 1 ? `พรุ่งนี้ (${DAYS[d].sh})` : `วัน${DAYS[d].m}`);
function announce(m) { const l = $("#live"); l.textContent = ""; setTimeout(() => (l.textContent = m), 30); }

/* now / next (same function the home page uses) */
function info() {
  const { d, t } = S.now, sq = seq(), school = !!TT.days[d];
  let phase = "off", cur = null, brk = null;
  if (school && sq.length) {
    const f = sq.find((x) => x.s <= t && t < x.e);
    if (f) f.k === "b" ? ((phase = "break"), (brk = f)) : ((phase = "period"), (cur = f));
    else phase = t < sq[0].s ? "before" : t >= sq[sq.length - 1].e ? "after" : "gap";
  }
  const curSlot = cur ? slot(d, cur.p) : null;
  let next = null, room = null, why = null, roomDay = null;
  for (let k = 0; k < 8 && !next; k++) { const dd = (d + k) % 7; if (!TT.days[dd]) continue; for (const x of sq) { if (x.k !== "p" || (k === 0 && x.s <= t)) continue; const s = slot(dd, x.p); if (s) { next = { ...x, d: dd, k, slot: s }; break; } } }
  if (!ro()) {
    if (curSlot && curSlot.kind === "class" && !isArch(curSlot.room)) { room = curSlot.room; why = "now"; }
    else if (school) for (const x of sq) { if (x.k !== "p" || x.s <= t) continue; const s = slot(d, x.p); if (s && s.kind === "class" && !isArch(s.room)) { room = s.room; why = "next"; roomDay = d; break; } } // Gate 2 N3: today only, no button when no teaching period is left today
  }
  return { d, t, phase, cur, brk, curSlot, next, room, why, roomDay, hasAny: S.st !== "loading" && counts().n > 0 };
}
function nowParts() {
  let now = null, note = null, next = null;
  if (I.phase === "period") now = `คาบ ${I.cur.p} · ถึง ${hm(I.cur.e)} · ${I.curSlot ? lblFull(I.curSlot) : "ว่าง"}`;
  else if (I.phase === "break") now = `${I.brk.name} · ถึง ${hm(I.brk.e)}`;
  else if (I.phase === "off") note = "วันนี้ไม่มีเรียน";
  else if (I.phase === "after") note = "วันนี้สอนครบแล้ว";
  if (I.next) { const n = I.next; next = `${n.k ? dayName(n.d, n.k) + " · " : ""}คาบ ${n.p} · ${hm(n.s)} · ${lblFull(n.slot)}`; }
  return { now, note, next };
}
function checkBtn(cls = "btn pri") {
  if (!I.room) return "";
  const why = I.why === "next" ? " (คาบต่อไป)" : "";
  return `<button class="${cls}" data-a="go" data-v="att" data-room="${I.room}">${ic("ucheck", 18)}เช็คชื่อ ${I.room}${why}</button>`;
}

/* ===== shared period chip / cell ===== */
function chip(s, mini) {
  if (s.kind === "class") return `<span class="ck">${ic("board", mini ? 14 : 16)}<b>${s.room}</b>${isArch(s.room) ? '<span class="tag arch">เก็บแล้ว</span>' : ""}${s.isNew ? '<span class="tag new">ใหม่</span>' : ""}</span>${mini ? "" : `<span class="sj">${s.subj || "ไม่ระบุวิชา"}</span>`}`;
  return `<span class="ck">${ic("star", mini ? 14 : 16)}<b>${esc(s.name)}</b></span>${mini ? "" : '<span class="sj"><span class="tag act">กิจกรรม</span></span>'}`;
}
function aLabel(d, x, s, now) {
  let a = `วัน${DAYS[d].m} คาบ ${x.p} ${hm(x.s)} ถึง ${hm(x.e)} `;
  if (!s) a += editable() ? "ว่าง ปุ่มเพิ่มคาบ" : "ว่าง";
  else a += s.kind === "class" ? `${s.subj || ""} ${s.room}${isArch(s.room) ? " ห้องเก็บแล้ว" : ""}${s.isNew ? " เพิ่งเปลี่ยนจากเครื่องอื่น" : ""}` : `กิจกรรม ${s.name}`;
  return (a + (now ? " กำลังเรียนอยู่ตอนนี้" : "")).replace(/\s+/g, " ").trim();
}
const cellCls = (s) => (!s ? (editable() ? "empty" : "none") : s.kind === "act" ? "act" : `cls t-${ROOMS[s.room]}${isArch(s.room) ? " arch" : ""}`);
const isNow = (d, p) => I.phase === "period" && d === I.d && I.cur.p === p;
function cell(d, x, o = {}) {
  const s = slot(d, x.p), now = isNow(d, x.p), act = (s && !ro()) || (!s && editable());
  return `<div role="gridcell" class="cell ${cellCls(s)}${now ? " now" : ""}${s && s.isNew ? " new" : ""}" tabindex="-1" data-d="${d}" data-p="${x.p}"${act ? ' data-a="cell"' : ""} aria-label="${esc(aLabel(d, x, s, now))}"${!s && editable() ? ' title="เพิ่มคาบ"' : ""} style="${o.style || ""}">${now && !o.noNow ? '<span class="tag now">ตอนนี้</span>' : ""}${s ? chip(s, o.mini) : editable() ? ic("plus", 22) : ""}</div>`;
}

/* ===== shell ===== */
const NAV = [["วันนี้", [["home", "หน้าหลัก", "home"], ["tt", "ตารางสอน", "calb"]]], ["ในห้องเรียน", [["scan", "สแกน", "scan"], ["att", "เช็คชื่อ", "ucheck"], ["rand", "สุ่มชื่อ", "dice"]]],

function ttHeader() {
  const ph = phone(), dis = off() ? ' aria-disabled="true"' : "", empty = !counts().n;

});
document.addEventListener("submit", (e) => { e.preventDefault(); const f = e.target.dataset.form; if (f === "period") savePeriod(); else if (f === "times") saveTimes(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.ov) { e.preventDefault(); closeOv(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && S.undo && !/INPUT|SELECT/.test(e.target.tagName)) { e.preventDefault(); doUndo(); return; }
  if (e.key === "Tab" && S.ov) {
    const f = [...document.querySelectorAll(".scrim .dlg :is(button:not([disabled]),input,select)")].filter((x) => x.offsetParent && !(x.type === "radio" && !x.checked));
    if (!f.length) return; const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    return;
  }
  const c = e.target.closest && e.target.closest('[role="gridcell"][data-d]'); if (!c) return;
  const g = c.closest('[role="grid"]'), cells = [...g.querySelectorAll('[role="gridcell"][data-d]')];
  const d = +c.dataset.d, p = +c.dataset.p, rows = g.dataset.ax === "rows";
  const ds = [...new Set(cells.map((x) => +x.dataset.d))], ps = [...new Set(cells.map((x) => +x.dataset.p))].sort((a, b) => a - b);
  const di = ds.indexOf(d), pi = ps.indexOf(p), cl = (a, i) => a[Math.max(0, Math.min(a.length - 1, i))];
  let nd = d, np = p; const k = e.key;
  if (k === "ArrowRight") rows ? (np = cl(ps, pi + 1)) : (nd = cl(ds, di + 1));
  else if (k === "ArrowLeft") rows ? (np = cl(ps, pi - 1)) : (nd = cl(ds, di - 1));
  else if (k === "ArrowDown") rows ? (nd = cl(ds, di + 1)) : (np = cl(ps, pi + 1));
  else if (k === "ArrowUp") rows ? (nd = cl(ds, di - 1)) : (np = cl(ps, pi - 1));
  else if (k === "Home") { np = ps[0]; if (e.ctrlKey) nd = ds[0]; }
  else if (k === "End") { np = ps[ps.length - 1]; if (e.ctrlKey) nd = ds[ds.length - 1]; }
  else if (k === "Enter" || k === " ") { e.preventDefault(); if (c.dataset.a) activate(d, p); return; }
  else if ((k === "Delete" || k === "Backspace") && editable() && slot(d, p)) { e.preventDefault(); deleteSlot(d, p); return; }
  else return;
  e.preventDefault();
  const t = g.querySelector(`[role="gridcell"][data-d="${nd}"][data-p="${np}"]`);
  if (t) { cells.forEach((x) => (x.tabIndex = -1)); t.tabIndex = 0; t.focus(); S.gfocus = { d: nd, p: np }; }
});
window.addEventListener("resize", () => render());
render();
</script>
