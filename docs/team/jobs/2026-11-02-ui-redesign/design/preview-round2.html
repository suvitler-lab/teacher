<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ui-redesign รอบ 3 — คะแนน · สแกน · เช็คชื่อ · สุ่มชื่อ · หน้าหลัก (mockup กดได้จริง · ชื่อสมมติ)</title>
<!--
  ไฟล์เดียว เปิดจากดิสก์ได้ ไม่โหลดอะไรจากอินเทอร์เน็ต · ข้อมูลและชื่อนักเรียนสมมติทั้งหมด
  รวมหน้าหลัก (รอบ 1) + สแกน + เช็คชื่อ + สุ่มชื่อ + โหมดฉายจอ · สลับหน้าด้วยแถบควบคุมด้านบน เมนูในกรอบ หรือ hash (#scan-type #attendance-tap #random-pick #gradebook-table #gradebook-cell)
  ประกอบโดย design/round2-wip/build.cjs  (อย่าแก้ไฟล์นี้ตรง ๆ — แก้ชิ้นส่วนแล้วรันใหม่)
-->
<style>
/* ===== tokens (light) ===== */
.frame{
  --surface-0:#f4f6fa;--surface-1:#eef1f6;--surface-2:#ffffff;--surface-3:#ffffff;
  --text-primary:#1a1f29;--text-secondary:#59616e;--text-muted:#646c79; /* VP-1 */
  --border:rgba(20,28,46,.10);--border-strong:rgba(20,28,46,.18);
  --accent:#2f6fde;--accent-hover:#275fc0;--on-accent:#fff;--bg-accent:#e6f0fc;--bg-accent-muted:rgba(47,111,222,.10);--text-accent:#1a56b0;--border-accent:#6f9fe0; /* VP-1 */
  --bg-success:#e3f6ec;--text-success:#12703f;--fill-success:#148352;--border-success:#a6e0c2; /* fill VP-1 */
  --bg-warning:#fbefd6;--text-warning:#8a5a08;--fill-warning:#e79a1c;--border-warning:#f0cf8c;
  --bg-danger:#fbe6e6;--text-danger:#a32626;--fill-danger:#c93a3a;--border-danger:#f0b2b2; /* fill VP-1 */
  --bg-purple:#efeafc;--text-purple:#5a3fb0;--fill-purple:#7c5cd6;--fill-accent:#2f6fde;
  --tint-aqua-bg:#d9f2f0;--tint-aqua-fg:#0d6e6a;--tint-violet-bg:#ece7fb;--tint-violet-fg:#5636b8;
  --tint-orange-bg:#fce8d8;--tint-orange-fg:#9a4f0c;--tint-green-bg:#e7f3d7;--tint-green-fg:#4b7314;
  --tint-blue-bg:#e0edfc;--tint-blue-fg:#1a56b0;--tint-magenta-bg:#f8e2ee;--tint-magenta-fg:#9c2b63;
  --shadow-pop:0 8px 28px rgba(20,28,46,.14),0 2px 6px rgba(20,28,46,.08);
  --shadow-card:0 1px 2px rgba(20,28,46,.06),0 2px 8px rgba(20,28,46,.05); /* VP-1 */
  --ring:0 0 0 3px var(--bg-accent-muted),0 0 0 1.5px var(--accent); /* VP-1 */
  --scrim:rgba(10,14,22,.45);
}
.frame[data-theme=dark]{
  --surface-0:#14171d;--surface-1:#1b1f27;--surface-2:#232833;--surface-3:#2a303c;
  --text-primary:#eef1f6;--text-secondary:#a7afbd;--text-muted:#8d96a6; /* VP-1 */
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);
  --accent:#5a92ee;--accent-hover:#6ea1f2;--on-accent:#0b1220;--bg-accent:#1d2b44;--bg-accent-muted:rgba(90,146,238,.16);--text-accent:#9cc2f2;--border-accent:#4a7fc4;
  --bg-success:#10331f;--text-success:#7fdca6;--fill-success:#1f9d63;--border-success:#26623f;
  --bg-warning:#3a2a08;--text-warning:#f0c674;--fill-warning:#e79a1c;--border-warning:#6b4e18;
  --bg-danger:#3a1616;--text-danger:#f0999a;--fill-danger:#dc4a4a;--border-danger:#6b2a2a;
  --bg-purple:#241a44;--text-purple:#c4b2f0;--fill-purple:#7c5cd6;--fill-accent:#5a92ee;
  --tint-aqua-bg:#123634;--tint-aqua-fg:#7ad6d0;--tint-violet-bg:#241a44;--tint-violet-fg:#c4b2f0;
  --tint-orange-bg:#3a2410;--tint-orange-fg:#f0b276;--tint-green-bg:#1e3410;--tint-green-fg:#a6d472;
  --tint-blue-bg:#16294a;--tint-blue-fg:#9cc2f2;--tint-magenta-bg:#3a162a;--tint-magenta-fg:#f0a0c6;
  --shadow-pop:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.35);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6);
}
/* geometry: --u = ขนาดตัวอักษรที่ตั้ง (html font-size ของแอปจริง) */
.frame{
  --u:18px;--tap:44px;
  --fs-xs:max(13px,calc(var(--u)*.85));--fs-sm:max(13px,calc(var(--u)*.9));
  --radius-xs:6px;--radius-sm:8px;--radius:12px;--radius-lg:16px;
  --rail-w:max(96px,calc(var(--u)*5.75));
  --row-h:max(var(--tap),calc(var(--u)*3.2));
  --font-sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;background:#d9dde4;color:#1a1f29;line-height:1.6}
/* ===== แผงควบคุม (ไม่ใช่ส่วนของแอป) ===== */
.ctl{position:sticky;top:0;z-index:100;background:#1a1f29;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;align-items:center}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl b{opacity:.7;font-weight:400;margin-right:2px;font-size:12px}
.ctl button{font:inherit;min-height:32px;padding:0 10px;border-radius:6px;background:#39414f;color:#fff;border:1px solid #4b5566;font-size:13px;cursor:pointer}
.ctl button.on{background:#2f6fde;border-color:#9cc2f2}
.note{font-size:13px;padding:6px 12px;background:#fff7d6;color:#5a4200;line-height:1.5}
.stage{padding:12px;display:flex;justify-content:center}
.fit{position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--surface-0);color:var(--text-primary);overflow:hidden;display:flex;box-shadow:0 6px 30px rgba(0,0,0,.3);font-family:var(--font-sans);font-size:var(--u);line-height:1.6;border-radius:6px}
.frame.phone{display:block}
/* ===== element defaults ตาม base.css ===== */
:where(.frame) button{font:inherit;color:var(--text-primary);cursor:pointer;border:.5px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius-sm);height:calc(var(--u)*2.53);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3}
:where(.frame) button:hover{background:var(--surface-1)}
:where(.frame) button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
:where(.frame) button.primary:hover{background:var(--accent-hover)}
:where(.frame) button.ghost{border-color:transparent;background:transparent}
:where(.frame) button.ghost:hover{background:var(--surface-1)}
:where(.frame) button.icon{width:calc(var(--u)*2.53);height:calc(var(--u)*2.53);padding:0;flex:none}
:where(.frame) a{color:var(--text-accent);text-decoration:none}
.frame :focus-visible{outline:none;box-shadow:var(--ring)}
.frame h1,.frame h2,.frame h3{font-weight:500;margin:0;line-height:1.35}
.touch button:not(.lk){min-height:var(--tap);min-width:var(--tap)}
.touch select{min-height:var(--tap)}
svg{flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== rail (iPad / คอม) ===== */
.rail{width:var(--rail-w);flex:none;background:var(--surface-2);border-right:.5px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:10px 6px;height:100%;overflow-y:auto;overflow-x:hidden}
.rail-logo{width:calc(var(--u)*2.67);height:calc(var(--u)*2.67);border-radius:11px;margin:0 auto 8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.rail-gl{font-size:var(--fs-xs);color:var(--text-muted);text-align:center;padding:8px 0 2px;border-top:.5px solid var(--border);margin-top:4px;line-height:1.3;white-space:nowrap}
.rail-group:first-of-type .rail-gl{border-top:none;margin-top:0;padding-top:2px}
.rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:var(--tap);height:auto;font-size:var(--fs-xs);color:var(--text-secondary);border-radius:var(--radius-sm);border:none;background:transparent;text-decoration:none;width:100%;text-align:center;line-height:1.25;position:relative;white-space:nowrap}
.rail-item:hover{background:var(--surface-1)}
.rail-item.on{background:var(--bg-accent);color:var(--text-accent);font-weight:500}
.rail-item.on::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.rail-spacer{flex:1}
button.rail-item{height:auto;padding:6px 2px}
.frame:not(.touch) .rail-item{min-height:0;padding:5px 2px}
.frame:not(.touch) .todo-row button,.frame:not(.touch) .resume button,.frame:not(.touch) .banner button{min-height:40px}
.frame:not(.touch) .seg button{min-height:32px}
.frame:not(.touch) button.rail-item{padding:5px 2px}
.frame:not(.touch) .rail-gl{padding:6px 0 1px}
.rail-sync{display:flex;justify-content:center;padding:4px 0 6px}
.rail-sync .sync{flex-direction:column;gap:0;white-space:normal;text-align:center;max-width:100%}
.hide-gl .rail-gl{font-size:0;padding:4px 0 0;border-top:.5px solid var(--border)}
/* ===== bottom tabs (มือถือ) ===== */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-top:.5px solid var(--border);padding:6px 4px 10px;align-items:end}
.tab{position:relative;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-xs);color:var(--text-secondary);background:transparent;border:none;padding:4px 0;min-height:var(--tap);text-decoration:none;line-height:1.25;height:auto;border-radius:var(--radius-sm)}
.tab.on{color:var(--text-accent);font-weight:500}
.tab .ti{position:relative;z-index:1}
.tab .pip{position:absolute;left:50%;top:4px;width:44px;height:28px;margin-left:-22px;border-radius:14px;background:transparent}
.tab.on .pip{background:var(--bg-accent)}
.tab-scan{justify-content:flex-end;gap:3px}
.tab-scan-btn{width:clamp(56px,calc(var(--u)*3.5),64px);height:clamp(56px,calc(var(--u)*3.5),64px);border-radius:50%;margin-top:-18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:3px solid var(--surface-2);box-shadow:var(--shadow-pop)}
.tab-scan.on .tab-scan-btn{background:var(--accent-hover)}
/* ===== sheet เมนูมือถือ ===== */
.sheet-overlay{position:absolute;inset:0;z-index:160;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface-2);border-radius:16px 16px 0 0;padding:8px 12px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-pop)}
.sheet-grab{width:44px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 4px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 4px 10px;border-bottom:.5px solid var(--border)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-item{display:flex;align-items:center;gap:12px;min-height:56px;height:auto;padding:0 14px;font-size:1em;border:.5px solid var(--border);background:var(--surface-2);border-radius:var(--radius);color:var(--text-primary);text-decoration:none;justify-content:flex-start}
.sheet-item.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.sheet-item.danger{color:var(--text-danger);border-color:transparent}
.sheet-gl{font-size:var(--fs-xs);color:var(--text-muted);padding:6px 4px 0}
.sheet-item{font-weight:500}
/* ===== main ===== */
.main{flex:1;min-width:0;padding:20px 24px 40px;overflow-y:auto;height:100%;position:relative}
.phone .main{padding:14px 14px 96px}
.pad-sm .main{padding:16px 16px 40px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.uh-l{display:flex;align-items:center;gap:10px;min-width:0}
.uh-ic{width:calc(var(--u)*2.53);height:calc(var(--u)*2.53);border-radius:11px;flex:none;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center}
.uh-title{font-size:calc(var(--u)*1.27);font-weight:500;line-height:1.25}
.uh-sub{font-size:var(--fs-sm);color:var(--text-secondary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uh-sub .sep::before{content:"·";margin-right:8px}
.uh-act .on-hide{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.banner.hidebar{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.rail-item.optitem{outline:1px dashed var(--border-warning);outline-offset:-2px}
.uh-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:calc(var(--u)*2);padding:0 12px;border-radius:999px;border:.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.touch .pill{min-height:var(--tap)}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 10px;border-radius:999px;white-space:nowrap;min-height:28px}
.sync.online{background:var(--bg-success);color:var(--text-success)}
.sync.offline{background:var(--bg-warning);color:var(--text-warning)}
.sync.saving{background:var(--surface-1);color:var(--text-secondary)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5;min-height:24px}
.chip.danger{background:var(--bg-danger);color:var(--text-danger)}
.chip.warning{background:var(--bg-warning);color:var(--text-warning)}
.chip.muted{background:var(--surface-1);color:var(--text-secondary)}
.chip.accent{background:var(--bg-accent);color:var(--text-accent)}
.chip.success{background:var(--bg-success);color:var(--text-success)}
.chip.violet{background:var(--tint-violet-bg);color:var(--tint-violet-fg)}
.chip.aqua{background:var(--tint-aqua-bg);color:var(--tint-aqua-fg)}
.chip.orange{background:var(--tint-orange-bg);color:var(--tint-orange-fg)}
.chip.green{background:var(--tint-green-bg);color:var(--tint-green-fg)}
.chip.blue{background:var(--tint-blue-bg);color:var(--tint-blue-fg)}
.card{background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:16px}
.phone .card{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sec{color:var(--text-secondary)}
.sub{font-size:var(--fs-sm);color:var(--text-secondary)}
.xs{font-size:var(--fs-xs);color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== ต้องทำตอนนี้ ===== */
.todo{padding:0;overflow:hidden;border-left:4px solid var(--fill-warning);border-radius:var(--radius-lg)}
.todo-h .ic{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.todo-h{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;font-weight:500}
.todo-h .n{margin-left:auto}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:var(--tap);border-top:.5px solid var(--border);flex-wrap:wrap}
.todo-row .ic{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.todo-row .ic.warn{background:var(--bg-warning);color:var(--text-warning)}
.todo-row .ic.acc{background:var(--bg-accent);color:var(--text-accent)}
.todo-row .ic.dan{background:var(--bg-danger);color:var(--text-danger)}
.todo-row .t{flex:1 1 12em;min-width:0}
.todo-row button{height:auto;min-height:calc(var(--u)*2.2);font-size:var(--fs-sm);white-space:nowrap}
/* ===== ปุ่มลัด ===== */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
.phone .qa,.ipadP .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
.qa-btn{height:auto;min-height:calc(var(--u)*3.6);display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:10px 12px;border-radius:var(--radius);background:var(--surface-2);border:.5px solid var(--border);box-shadow:var(--shadow-card);text-align:left;color:inherit;text-decoration:none;min-width:0}
.qa-btn .ic{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:10px;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;flex:none}
.qa-btn .t{font-weight:500;font-size:1em;line-height:1.3}
.qa-btn .s{font-size:var(--fs-xs);color:var(--text-secondary);line-height:1.3}
.qa-btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.qa-btn.primary .ic{background:rgba(255,255,255,.18);color:var(--on-accent)}
.qa-btn.primary .s{color:inherit;opacity:.85}
.qa-btn:hover{background:var(--surface-1)}.qa-btn.primary:hover{background:var(--accent-hover)}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 12px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);border:.5px solid var(--border-accent)}
.resume button{min-height:calc(var(--u)*2.2);height:auto;font-size:var(--fs-sm)}
/* ===== stat ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.phone .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{min-width:0;overflow-wrap:anywhere;white-space:normal;background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:10px 12px;text-align:left;height:auto;display:block;width:100%;min-width:0;cursor:pointer}
.stat:hover{background:var(--surface-1)}
.stat .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat .lbl{font-size:var(--fs-xs);color:var(--text-secondary)}
.stat .val{font-size:calc(var(--u)*1.6);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0}
.stat .val small{font-size:var(--fs-xs);font-weight:400;color:var(--text-secondary)}
.stat .val.na{font-size:1em;font-weight:500;line-height:1.4;padding:calc(var(--u)*.2) 0}
.stat .hint{font-size:var(--fs-xs);color:var(--text-secondary);line-height:1.35}
.stat .ic{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic.accent{background:var(--bg-accent);color:var(--text-accent)}.ic.neutral{background:var(--surface-1);color:var(--text-secondary)}.ic.success{background:var(--bg-success);color:var(--text-success)}.ic.warning{background:var(--bg-warning);color:var(--text-warning)}.ic.danger{background:var(--bg-danger);color:var(--text-danger)}
.val.danger{color:var(--text-danger)}
/* ===== การ์ด grid ===== */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.one .cols{grid-template-columns:minmax(0,1fr)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ch h2{font-size:1em;font-weight:500;display:flex;align-items:center;gap:6px}
.ch h2 svg{color:var(--text-secondary)}
.lk{font-size:var(--fs-sm);color:var(--text-accent);background:none;border:none;padding:0 6px;height:auto;min-height:var(--tap)}
.ch .seg{margin-left:auto}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:var(--radius-sm);background:var(--surface-1);border:.5px solid var(--border)}

.toast2{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:300;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:var(--radius);border:.5px solid var(--border);box-shadow:var(--shadow-pop);background:var(--surface-3);width:min(460px,calc(100% - 24px))}
.phone .toast2{bottom:86px}
.sum{max-width:36rem;margin:0 auto}
.sum .big{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sum h2{font-size:calc(var(--u)*1.2)}
.sumsec{border-top:.5px solid var(--border);padding:10px 0}
.sumsec:first-of-type{border-top:none}
.namechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
/* ---------- เช็คชื่อ ---------- */
.toolbar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:calc(var(--u)*2.2);padding:0 12px;border-radius:999px;border:.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.touch .pill{min-height:var(--tap)}
.pill .n{opacity:.75;font-variant-numeric:tabular-nums}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .d{min-width:8em;text-align:center;font-weight:500}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px}
.wk button{height:auto;min-height:var(--tap);flex-direction:column;gap:0;padding:4px;line-height:1.3;text-align:center;border-radius:var(--radius-sm)}
.wk button.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.wk button:disabled{opacity:.5}
.wk small{font-size:var(--fs-xs);color:var(--text-secondary)}
.sumcard{padding:10px 14px}
.stack2{display:flex;gap:2px;height:10px;margin:6px 0}.stack2>i{display:block;border-radius:3px}
.brush{margin-bottom:8px}
.brush .lbl{font-size:var(--fs-sm);color:var(--text-secondary);margin-bottom:4px}
.stbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:6px}
.narrow .stbtns{grid-template-columns:repeat(5,minmax(0,1fr))}
.stbtn{height:auto;min-height:calc(var(--u)*3.6);flex-direction:column;gap:2px;font-weight:500;line-height:1.2;border-radius:var(--radius);border:1.5px solid var(--border-strong);padding:4px 2px}
.stbtn.p.on{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.stbtn.l.on{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.stbtn.v.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.stbtn.k.on{background:var(--bg-purple);color:var(--text-purple);border-color:var(--fill-purple)}
.stbtn.a.on{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.stbtn.on{box-shadow:var(--ring)}
.allp{min-height:calc(var(--u)*3);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(var(--tc,4),minmax(0,1fr));gap:8px}
.narrow .tiles{--tc:3}
.phone .tiles{--tc:2}
.tile{height:auto;min-height:calc(var(--u)*3.6);flex-direction:row;justify-content:flex-start;gap:8px;padding:6px 8px;border-radius:var(--radius);border:1.5px dashed var(--border-strong);background:var(--surface-2);text-align:left;min-width:0;position:relative}
.tile .no{font-size:calc(var(--u)*1.25);font-weight:600;min-width:1.6em;font-variant-numeric:tabular-nums}
.tile .tx{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.tile .nk{font-size:calc(var(--u)*.95);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .st{font-size:var(--fs-xs);display:flex;align-items:center;gap:3px}
.tile.p{background:var(--bg-success);border:1.5px solid var(--border-success);color:var(--text-success)}
.tile.l{background:var(--bg-warning);border:1.5px solid var(--border-warning);color:var(--text-warning)}
.tile.v{background:var(--bg-accent);border:1.5px solid var(--border-accent);color:var(--text-accent)}
.tile.k{background:var(--bg-purple);border:1.5px solid var(--fill-purple);color:var(--text-purple)}
.tile.a{background:var(--bg-danger);border:1.5px solid var(--border-danger);color:var(--text-danger)}
.tile.flash{outline:3px solid var(--accent);outline-offset:1px}
.tile.u{color:var(--text-secondary)}
.savebar{position:sticky;bottom:0;z-index:35;margin:10px calc(var(--padx,16px)*-1) calc(var(--pady,16px)*-1);padding:8px var(--padx,16px);background:var(--surface-2);border-top:.5px solid var(--border);box-shadow:0 -6px 12px -8px rgba(20,28,46,.25);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 10px;border-radius:999px;white-space:nowrap;min-height:28px}
.sync.online{background:var(--bg-success);color:var(--text-success)}.sync.offline{background:var(--bg-warning);color:var(--text-warning)}.sync.saving{background:var(--surface-1);color:var(--text-secondary)}
.scancard{display:flex;flex-direction:column;gap:8px}
.attgrid{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.wide .attgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,20rem);align-items:start}
.attside{display:flex;flex-direction:column;gap:8px;min-width:0}
.numchips{display:flex;gap:4px;flex-wrap:wrap}
.numchips button{min-width:var(--tap)}
/* ---------- สุ่มชื่อ ---------- */
.rstage{border:2px solid var(--border-accent);border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-card);text-align:center;padding:14px 10px;min-height:calc(var(--u)*11);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.rstage.idle{border-style:dashed;border-color:var(--border-strong)}
.rbadge{display:inline-flex;width:calc(var(--u)*4.3);height:calc(var(--u)*4.3);border-radius:50%;background:var(--bg-accent);color:var(--text-accent);font-size:calc(var(--u)*1.7);font-weight:600;align-items:center;justify-content:center}
.rname{font-size:calc(var(--u)*2.3);font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.wide .rname{font-size:calc(var(--u)*3)}
.rstage .poolchip{position:absolute;top:8px;left:8px}
.rctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.rctl .go{margin-left:auto;min-height:calc(var(--u)*3.2);padding:0 26px;font-size:calc(var(--u)*1.1);font-weight:600}
.step{display:inline-flex;align-items:center;gap:4px}
.step b{min-width:2em;text-align:center;font-variant-numeric:tabular-nums}
.step button{width:var(--tap);padding:0}
.rcols{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.wide .rcols{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.rcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 10px 0 4px;border-radius:999px;background:var(--surface-1);border:.5px solid var(--border)}
.hchip i{font-style:normal;width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:600}
.hchip.last{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.pbar2{height:10px;border-radius:5px;background:var(--border);overflow:hidden;margin:6px 0}.pbar2>div{height:100%;border-radius:5px;background:var(--fill-accent)}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tring{width:calc(var(--u)*6);height:calc(var(--u)*6);position:relative;flex:none}
.tring .cap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.8);font-weight:600;font-variant-numeric:tabular-nums}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:8px}
.grp{border:.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;background:var(--surface-2)}
.grp b{display:flex;align-items:center;gap:6px;margin-bottom:2px}.grp b i{width:.7em;height:.7em;border-radius:50%;display:inline-block}
.grp div{font-size:var(--fs-sm);line-height:1.5}
.rnotice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);background:var(--bg-warning);color:var(--text-warning);border:.5px solid var(--border-warning);margin-bottom:8px}
.rnotice .grow{flex:1 1 14em}
/* ---------- ปรับการ์ด (ใช้ของรอบ 1) ---------- */
.drawer .lock{font-size:var(--fs-xs);color:var(--text-muted);display:flex;align-items:center;gap:4px}
.badge-sa{font-size:var(--fs-xs);background:var(--bg-warning);color:var(--text-warning);border:.5px solid var(--border-warning);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400}
/* ---------- โหมดฉายจอ (D27) ---------- */
.pj{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;overflow:hidden;font-size:calc(var(--k)*30px);line-height:1.25;
  --pj-bg:#0b1220;--pj-card:#151e33;--pj-t1:#ffffff;--pj-t2:#cdd5e3;--pj-bd:#5b6a8a;--pj-ac:#9cc2f2;--pj-on-ac:#0b1220;--pj-ok:#6ee7a8;--pj-okbg:#0f3a26;--pj-bad:#ff9a9a;--pj-warn:#ffd166;
  background:var(--pj-bg);color:var(--pj-t1);padding:calc(var(--k)*24px)}
.pj[data-th=light]{--pj-bg:#ffffff;--pj-card:#eef2f8;--pj-t1:#0b1220;--pj-t2:#2c3648;--pj-bd:#55627a;--pj-ac:#164a9e;--pj-on-ac:#ffffff;--pj-ok:#0d6a3a;--pj-okbg:#dcf3e6;--pj-bad:#9b1c1c;--pj-warn:#7a4b00}
.pj[data-sz="1"]{--s2:32;--st:56;--nm:72;--bt:64}
.pj[data-sz="2"]{--s2:40;--st:72;--nm:96;--bt:72}
.pj[data-sz="3"]{--s2:48;--st:88;--nm:120;--bt:80}
.pj .pjbar{height:calc(var(--k)*84px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none}
.pj .pjbar h1{font-size:calc(var(--k)*40px);font-weight:600;display:flex;align-items:center;gap:calc(var(--k)*12px)}
.pj .live{display:inline-flex;align-items:center;gap:calc(var(--k)*10px);font-size:calc(var(--k)*26px);font-weight:600;border:calc(var(--k)*3px) solid var(--pj-ac);color:var(--pj-ac);border-radius:999px;padding:calc(var(--k)*6px) calc(var(--k)*18px)}
.pj .live i{width:calc(var(--k)*14px);height:calc(var(--k)*14px);border-radius:50%;background:var(--pj-ac)}
.pj .exit{width:calc(var(--k)*64px);height:calc(var(--k)*64px);border-radius:50%;border:calc(var(--k)*3px) solid var(--pj-bd);background:var(--pj-card);color:var(--pj-t2);display:inline-flex;align-items:center;justify-content:center;padding:0;position:relative;touch-action:none;user-select:none}
.pj .exit::after{content:"";position:absolute;inset:calc(var(--k)*-6px);border-radius:50%;background:conic-gradient(var(--pj-ac) calc(var(--p,0)*1%),transparent 0);-webkit-mask:radial-gradient(circle,transparent calc(var(--k)*34px),#000 calc(var(--k)*35px));mask:radial-gradient(circle,transparent calc(var(--k)*34px),#000 calc(var(--k)*35px));pointer-events:none}
.pj .hint{position:absolute;right:calc(var(--k)*24px);top:calc(var(--k)*100px);background:var(--pj-card);border:calc(var(--k)*3px) solid var(--pj-bd);border-radius:calc(var(--k)*14px);padding:calc(var(--k)*8px) calc(var(--k)*16px);font-size:calc(var(--k)*24px);z-index:3}
.pj .body{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--k)*14px)}
.pj .pjbtn{font:inherit;font-size:calc(var(--k)*var(--bt)*.5px);font-weight:600;height:calc(var(--k)*var(--bt)*1px);padding:0 calc(var(--k)*40px);border-radius:calc(var(--k)*20px);background:var(--pj-ac);color:var(--pj-on-ac);border:0;display:inline-flex;align-items:center;gap:calc(var(--k)*12px);cursor:pointer}
.pj .pjbtn.sec{background:var(--pj-card);color:var(--pj-t1);border:calc(var(--k)*3px) solid var(--pj-bd)}
.pj .other{position:absolute;right:calc(var(--k)*24px);bottom:calc(var(--k)*24px);display:flex;flex-direction:column;gap:calc(var(--k)*8px);align-items:flex-end}
.pj .other .menu4{display:flex;flex-direction:column;gap:calc(var(--k)*8px);background:var(--pj-card);border:calc(var(--k)*3px) solid var(--pj-bd);border-radius:calc(var(--k)*16px);padding:calc(var(--k)*10px)}
.pj .other .menu4 button{height:calc(var(--k)*64px);font-size:calc(var(--k)*28px);background:transparent;color:var(--pj-t1);border:0;justify-content:flex-start;gap:calc(var(--k)*12px);padding:0 calc(var(--k)*20px)}
.pj .big{font-size:calc(var(--k)*var(--nm)*1px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.pj .stat{font-size:calc(var(--k)*var(--st)*1px);font-weight:600;line-height:1.1}
.pj .s2{font-size:calc(var(--k)*var(--s2)*1px);color:var(--pj-t2)}
.pj .pbar{height:calc(var(--k)*28px);border-radius:calc(var(--k)*14px);background:var(--pj-card);border:calc(var(--k)*3px) solid var(--pj-bd);overflow:hidden;margin:0}
.pj .pbar>div{height:100%;background:var(--pj-ok)}
.pj .okmark{display:inline-flex;align-items:center;gap:calc(var(--k)*10px);color:var(--pj-ok);font-weight:600}
.pj .seatp{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:calc(var(--k)*8px)}
.pj .seatp div{height:calc(var(--k)*64px);border-radius:calc(var(--k)*12px);border:calc(var(--k)*3px) dashed var(--pj-bd);display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*6px);font-size:calc(var(--k)*28px);font-weight:600;color:var(--pj-t2);font-variant-numeric:tabular-nums;min-width:0}
.pj .seatp div.d{border:calc(var(--k)*3px) solid var(--pj-ok);background:var(--pj-okbg);color:var(--pj-ok)}
.pj .seatp div small{font-size:calc(var(--k)*20px);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .pcard{background:var(--pj-card);border:calc(var(--k)*3px) solid var(--pj-bd);border-radius:calc(var(--k)*20px);padding:calc(var(--k)*20px);text-align:center}
.pj .pgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--k)*14px)}
.pj .pgroups .pcard{text-align:left;padding:calc(var(--k)*12px) calc(var(--k)*16px)}
.pj .pgroups b{display:block;font-size:calc(var(--k)*30px);color:var(--pj-ac);margin-bottom:calc(var(--k)*4px)}
.pj .pgroups div{font-size:calc(var(--k)*28px);line-height:1.45}
.pj .rbadge{width:calc(var(--k)*var(--nm)*1px);height:calc(var(--k)*var(--nm)*1px);font-size:calc(var(--k)*var(--nm)*.5px);background:var(--pj-card);color:var(--pj-ac);border:calc(var(--k)*3px) solid var(--pj-bd)}
.pj .empty{font-size:calc(var(--k)*40px);color:var(--pj-t2);text-align:center;margin:auto}
.pjpre{padding:10px;display:flex;flex-direction:column;gap:6px;min-width:16em}

/* ---- แก้ตามผลตรวจงบความสูง ---- */
.wide .padbody{flex-wrap:nowrap}
.wide .padl{flex:1 1 11em}.wide .padr{flex:1 1 13em}
.pj .s2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wide .main{padding-bottom:24px}

.phone .startbar,.phone .savebar{bottom:64px}

/* ===================== รอบ 3 · สมุดคะแนน (gb-) ===================== */
.main:has(.gb-page){overflow-y:auto}
.gb-page{display:flex;flex-direction:column;gap:6px;min-width:0}
.gb-term{white-space:nowrap}
.gb-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.gb-chips{margin:0;flex:0 1 auto}
.gb-bar .gb-tb{margin-left:auto}
.gb-page .pghead{margin-bottom:0}
.gb-page .pghead .tip{display:none}
.touch .gb-page .pghead .tip{display:block}
.gb-tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gb-tb .seg button{min-height:var(--tap)}
/* ---- แถบการ์ด ---- */
.gb-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.gb-tile{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:4px 12px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface-2);font-size:var(--fs-sm);white-space:nowrap}
.gb-tile.sum{display:flex;gap:2px 12px;flex-wrap:nowrap;border:.5px solid var(--border);padding:2px 12px}
.gb-tile.sum b{font-variant-numeric:tabular-nums}
.gb-n{height:auto;min-height:var(--tap);padding:0 8px;border:none;background:transparent;border-radius:8px;font-size:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.gb-list{min-width:18em;max-height:22em;overflow:auto}
.gb-list button{display:flex;gap:8px;width:100%}
.gb-li{display:flex;align-items:center;gap:8px;padding:4px 10px}
.gb-li button{min-height:var(--tap)}
/* ---- แผงงานที่เลือก ---- */
.gb-work{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border:.5px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);background:var(--surface-2);box-shadow:var(--shadow-card)}
.gb-work.empty{border-left-color:var(--border-strong)}
.gb-wl{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 24em}
.gb-wt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gb-wn{display:flex;gap:14px;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;flex:0 1 auto}
.gb-wb{display:flex;gap:6px;align-items:center;margin-left:auto}
.gb-wb button{min-height:var(--tap)}
.gb-closedbar{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
/* ---- ตาราง ---- */
.gb-scroll{overflow:auto;border:.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);position:relative;overscroll-behavior:contain}
.gb-t{border-collapse:separate;border-spacing:0;table-layout:fixed;font-variant-numeric:tabular-nums;--nw:calc(var(--u)*12.5);--cw:calc(var(--u)*7.6);--tw:calc(var(--u)*5.2);--rh:calc(var(--u)*2.3)}
.ipadP .gb-t{--nw:calc(var(--u)*8);--cw:calc(var(--u)*5);--tw:calc(var(--u)*3.8)}
.ipadL .gb-t{--nw:calc(var(--u)*10);--cw:calc(var(--u)*6);--tw:calc(var(--u)*4.4)}
.touch .gb-t{--rh:max(44px,calc(var(--u)*2.4))}
.gb-t th,.gb-t td{padding:0;border-bottom:.5px solid var(--border);border-right:.5px solid var(--border);vertical-align:middle}
.gb-t thead th{position:sticky;top:0;z-index:5;background:var(--surface-1);vertical-align:top}
.gb-t .gb-name{position:sticky;left:0;z-index:4;width:var(--nw);min-width:var(--nw);max-width:var(--nw);background:var(--surface-2);text-align:left;font-weight:400;padding:0 6px;box-shadow:1px 0 0 var(--border)}
.gb-t thead .gb-name{z-index:7;background:var(--surface-1);font-size:var(--fs-xs);color:var(--text-secondary);vertical-align:bottom;padding-bottom:6px}
.gb-t .gb-colw,.gb-t td{width:var(--cw);min-width:var(--cw);max-width:var(--cw)}
.gb-t .gb-tot{position:sticky;right:0;z-index:4;width:var(--tw);min-width:var(--tw);max-width:var(--tw);background:var(--surface-1);text-align:center;box-shadow:-1px 0 0 var(--border);border-right:none}
.gb-t thead .gb-tot{z-index:7}
.gb-t td.gb-tot b{display:block;font-size:var(--fs-sm)}
.gb-t td.gb-tot small,.gb-t .gb-avg small{display:block;font-size:var(--fs-xs);color:var(--text-secondary);font-weight:400}
.gb-row td,.gb-row th{height:var(--rh);line-height:1}
.gb-nmw{display:flex;align-items:center;gap:6px;height:var(--rh);overflow:hidden;white-space:nowrap}
.gb-nmw .gb-no{font-weight:600;min-width:1.7em;text-align:right;flex:none}
.gb-nmw .gb-nm{overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-sm)}
.gb-red{width:8px;height:8px;border-radius:50%;background:var(--fill-danger);flex:none}
.gb-avg th,.gb-avg td{background:var(--surface-1);text-align:center;font-size:var(--fs-sm);padding:2px 0}
.gb-avg th{text-align:left;padding-left:6px;font-weight:500}
.gb-avg td b{font-weight:500}
.gb-t tfoot td,.gb-t tfoot th{position:sticky;bottom:0;z-index:3}
.gb-t tfoot .gb-name{z-index:6}
.gb-t tfoot .gb-tot{z-index:6}
/* หัวคอลัมน์ (แบบ A: สีตามประเภท) */
.gb-colw{position:relative}
.gb-colw.t-violet{background:var(--tint-violet-bg);color:var(--tint-violet-fg)}
.gb-colw.t-orange{background:var(--tint-orange-bg);color:var(--tint-orange-fg)}
.gb-colw.t-aqua{background:var(--tint-aqua-bg);color:var(--tint-aqua-fg)}
.gb-colw.t-green{background:var(--tint-green-bg);color:var(--tint-green-fg)}
.gb-colw.t-blue{background:var(--tint-blue-bg);color:var(--tint-blue-fg)}
.gb-colw.t-magenta{background:var(--tint-magenta-bg);color:var(--tint-magenta-fg)}
.gb-colw.sel{box-shadow:inset 0 -3px 0 var(--accent),inset 0 0 0 1.5px var(--accent)}
.gb-hbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;height:auto;min-height:var(--tap);padding:4px 6px 7px;border:none;background:transparent;color:inherit;text-align:left;font:inherit;line-height:1.25;border-radius:0}
.gb-ht{display:flex;gap:4px;align-items:flex-start;font-size:var(--fs-xs);font-weight:600;min-width:0}
.gb-ht b{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.desk .gb-ht b{-webkit-line-clamp:1;line-clamp:1}
.gb-shape{display:inline-flex;flex:none;opacity:.9}
.gb-hm{font-size:var(--fs-xs);font-weight:400;opacity:.95;white-space:nowrap}
.gb-hm u{text-decoration:none}
.gb-hm u.over{font-weight:700;text-decoration:underline}
.gb-h3{font-size:var(--fs-xs);font-weight:500;white-space:nowrap}
.gb-cn{position:absolute;top:3px;right:4px;opacity:.85}
.gb-eye{position:absolute;top:0;right:0;width:var(--tap);height:var(--tap);padding:0;border:none;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center}
.gb-hbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.12)}
.gb-hbar i{display:block;height:100%;background:currentColor;opacity:.75}
.gb-gcell{background:var(--surface-1);text-align:left}
.gb-gbtn{height:auto;min-height:var(--tap);width:100%;justify-content:flex-start;border:none;background:transparent;font-size:var(--fs-sm);font-weight:500}
.gb-fold{background:var(--surface-1)}
/* ช่องคะแนน */
.gb-t td{text-align:center;padding:0}
.gbc{display:flex;align-items:center;justify-content:center;width:100%;height:var(--rh);min-height:0;min-width:0;padding:0;border:none;border-radius:0;background:transparent;font-size:var(--fs-sm);font-weight:500;position:relative;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.gbc.ok{background:var(--bg-success);color:var(--text-success)}
.gbc.late{background:var(--bg-warning);color:var(--text-warning)}
.gbc.await{background:var(--bg-accent);color:var(--text-accent)}
.gbc.miss{color:var(--text-danger);font-weight:600}
.gbc.pend{color:var(--text-muted)}
.gbc.exc{background:var(--surface-1);color:var(--text-secondary);font-size:var(--fs-xs);font-weight:400}
.gbc:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.gbc.open{outline:2px solid var(--accent);outline-offset:-2px}
.gbc.mk-pend::after,.gbc.mk-fail::after,.gbc.mk-uns::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%}
.gbc.mk-pend::after{background:var(--fill-warning)}
.gbc.mk-fail::after{background:var(--fill-danger);box-shadow:0 0 0 1.5px var(--surface-2)}
.gbc.mk-uns{box-shadow:inset 0 0 0 2px var(--fill-danger)}
.gb-sumc .gbc{font-weight:600}
/* ---- ตัวแก้ไขช่อง ---- */
.gb-popwrap{position:absolute;z-index:140;width:min(22em,calc(100% - 16px));background:var(--surface-3);border:.5px solid var(--border-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);padding:12px;display:flex;flex-direction:column;gap:8px}
.gb-sheet{display:flex;flex-direction:column;gap:8px;max-height:88%;overflow:auto}
.gb-pophd b{font-weight:600}
.gb-pe{display:flex;align-items:center;gap:8px}
.gb-entry{width:5.5em;height:calc(var(--u)*3.4);min-height:var(--tap);font-size:calc(var(--u)*1.6);font-weight:600;text-align:center;border:2px solid var(--accent);border-radius:var(--radius);box-shadow:var(--ring);background:var(--surface-2);color:var(--text-primary)}
.gb-full{font-size:calc(var(--u)*1.2);color:var(--text-secondary)}
.gb-quick{display:flex;gap:6px;flex-wrap:wrap}
.touch .gb-quick button{min-width:var(--tap)}
.desk .gb-quick{display:none}
.gb-state{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gb-state button{min-height:var(--tap);gap:4px;border:1.5px solid var(--border-strong);background:var(--surface-2);font-size:var(--fs-sm)}
.gb-state button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--accent);font-weight:600}
.gb-note,.gb-err{font-size:var(--fs-sm);display:flex;gap:6px;align-items:center}
.gb-note{color:var(--text-warning);background:var(--bg-warning);border-radius:8px;padding:4px 8px}
.gb-err{color:var(--text-danger)}
.gb-date>button{min-height:var(--tap);justify-content:flex-start;width:100%;font-size:var(--fs-sm)}
.gb-ondue{margin-top:4px;min-height:var(--tap);width:100%;justify-content:flex-start;font-size:var(--fs-sm)}
.gb-mk{font-size:var(--fs-sm);display:flex;gap:8px;align-items:center}
.gb-mk.fail{color:var(--text-danger)}.gb-mk.pend{color:var(--text-warning)}.gb-mk.uns{color:var(--text-danger)}
.gb-popft{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.gb-popft button{min-height:var(--tap)}
/* ---- ตัวกรอง / ฟอร์ม ---- */
.gb-fr{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.gb-checks{display:flex;gap:6px;flex-wrap:wrap}
.gb-checks button{min-height:var(--tap);gap:6px;border:1.5px solid var(--border-strong);background:var(--surface-2);font-size:var(--fs-sm)}
.gb-checks button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--accent)}
.gb-modal{align-items:flex-start;overflow:auto}
.gb-asg{width:min(34em,100%);display:flex;flex-direction:column;gap:6px;margin:auto}
.gb-fl{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-sm);color:var(--text-secondary)}
.gb-fl input,.gb-fl select{min-height:var(--tap);font-size:1em;color:var(--text-primary)}
.gb-f3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.phone .gb-f3{grid-template-columns:1fr 1fr}
.phone .gb-f3 label:first-child{grid-column:1/-1}
.gb-asg .chip.gb-on{outline:2px solid var(--accent);font-weight:600}
.gb-asg .chip{min-height:var(--tap);cursor:pointer;border:none}
.gb-examline{display:flex;gap:6px;align-items:center}
.gb-dlg{width:min(28em,100%)}
.gb-dr{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlg .dan,.gb-dlg .dan{background:var(--fill-danger);color:#fff;border-color:var(--fill-danger)}
.pop button.dan{color:var(--text-danger)}
/* ---- การ์ดล่าง ---- */
.gb-bcard{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.gb-hist{display:flex;gap:10px;align-items:flex-end;height:calc(var(--u)*6)}
.gb-hist div{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;max-width:5em}
.gb-hist i{display:block;width:100%;background:var(--fill-accent);border-radius:4px 4px 0 0}
.gb-log{font-size:var(--fs-sm)}
.gb-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-xs);color:var(--text-secondary);align-items:center}
.gb-legend span{display:inline-flex;gap:5px;align-items:center}
.gb-legend .lg{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.2em;border-radius:4px;border:.5px solid var(--border);font-style:normal;font-size:.9em}
.lg.ok{background:var(--bg-success)}.lg.late{background:var(--bg-warning)}.lg.aw{background:var(--bg-accent);color:var(--text-accent)}.lg.miss{color:var(--text-danger)}.lg.exc{background:var(--surface-1)}
.lg.pd{background:var(--fill-warning);border-radius:50%;width:.8em;height:.8em}.lg.fl{background:var(--fill-danger);border-radius:50%;width:.8em;height:.8em}.lg.us{box-shadow:inset 0 0 0 2px var(--fill-danger)}
.gb-help{display:flex;gap:6px;align-items:center}
.gb-empty{text-align:center}
.gb-emptyrows{text-align:center}
/* ---- มือถือ / ทีละงาน ---- */
.gb-mlist{display:flex;flex-direction:column;gap:0;border:.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);overflow:hidden}
.gb-pills{display:flex;gap:6px;overflow-x:auto;padding:8px;border-bottom:.5px solid var(--border);position:sticky;top:0;background:var(--surface-2);z-index:3}
.gb-pills .pill{flex:none;min-height:var(--tap)}
.gb-mrow{display:flex;align-items:center;gap:8px;padding:0 8px;min-height:var(--tap);border-bottom:.5px solid var(--border)}
.gb-mrow .gb-no{font-weight:600;min-width:1.8em;text-align:right}
.gb-mrow .gb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm)}
.gb-mrow .gbc{width:5em;height:var(--tap);border-radius:8px}
.phone .gb-wl{flex-basis:100%}
.phone .gb-wb{margin-left:0;flex-wrap:wrap}
.phone .gb-strip{flex-wrap:nowrap;overflow-x:auto}
.phone .gb-strip .menu{flex:none}

.touch .gb-tile{padding:2px 8px;gap:6px}
.gb-wl{flex-basis:14em}

</style>

function progRow(a,p,sc){

    const partial=a.marked<c.total;const parts=[a.p&&`มา ${a.p}`,a.l&&`สาย ${a.l}`,a.v&&`ลา ${a.v}`,a.k&&`ป่วย ${a.k}`,a.a&&`ขาด ${a.a}`].filter(Boolean).join(' · ');

function cards(sc,d){
  const vis=S.prefs.order.filter(k=>!S.prefs.hidden.includes(k)&&!(sc.past&&k==='att'));
  if(!vis.length)return `<div class="card empty"><div class="ei">${ic('layout-grid',32)}</div>ยังไม่ได้เปิดการ์ดใดไว้<div style="margin-top:8px"><button data-a="prefs">${ic('layout-grid',20)}ปรับหน้าหลัก</button></div></div>`;
  const html=k=>CARD_FN[k](sc,d);
  if(d.one||S.dev==='phone')return `<div class="cols"><div>${vis.map(html).join('')}</div></div>`;
  const wide=vis.filter(k=>CARD_DEFS.find(c=>c.key===k).span==='wide'),side=vis.filter(k=>CARD_DEFS.find(c=>c.key===k).span==='side');
  if(!wide.length||!side.length)return `<div class="cols one"><div>${vis.map(html).join('')}</div></div>`;
  return `<div class="cols"><div>${wide.map(html).join('')}</div><div>${side.map(html).join('')}</div></div>`;
}

function render(){window.R2render()}
function toast(t){S.toast=t;render();clearTimeout(toast.h);toast.h=setTimeout(()=>{S.toast='';render()},2200)}
function act(e,t){const a=t.dataset.a,k=t.dataset.k;
  if(a==='nav'){window.R2nav(k);return}
  if(a==='logout'){toast('ออกจากระบบ (จำลอง)');return}
  if(a==='term'){toast('เปิดตัวเลือกภาคเรียน (ของเดิม)');return}
  if(a==='prefs'){S.page='prefs';S.confirmReset=false;render();return}
  if(a==='sheet'){S.page=S.page==='sheet'?'home':'sheet';render();return}
  if(a==='close'){if(e.target!==t&&!t.classList.contains('icon')&&!t.classList.contains('primary'))return;S.page='home';S.confirmReset=false;render();return}
  if(a==='list'){S.list=k;S.page='list';render();return}
  if(a==='filter'){S.filter=k;S.showAll=false;render();return}
  if(a==='showall'){S.showAll=true;render();return}
  if(a==='newasg'){toast('เปิดหน้าต่าง "สร้างงาน" (หน้าต่างเดิม)');return}
  if(a==='todo'){toast('ไปทำรายการนั้น (จำลอง)');return}
  if(a==='hide'){S.hideNames=!S.hideNames;render();return}
  if(a==='due-x'){S.expandDue[k]=!S.expandDue[k];render();return}
  if(a==='line'){toast('คัดลอกรายชื่อไป LINE แล้ว (ข้อความแบบเดียวกับหน้ารายงาน)');return}

function recvOpts(){const r=S.sc.recvDate;return r===TODAY?null:r}
function scanCommit(n,how){
  const sc=S.sc,a=AS(sc.asg);
  if(sc.closed){S.sc.fb={kind:'danger',icon:'lock',title:'งานนี้ปิดรับแล้ว',sub:'สแกนเพิ่มไม่ได้'};return}
  if(!sc.seats[n]){sc.fb={kind:'danger',icon:'x',title:`ไม่มีเลขที่ ${n} ใน ${CL(sc.cls).name}`,sub:'ตรวจเลขที่ หรือเลือกห้องให้ตรงกับบัตร'};return}
  if(sc.seats[n]==='exc'){sc.excAsk=n;return}
  if(['scored','late','await'].includes(sc.seats[n])){sc.fb={kind:'warning',icon:'alert-triangle',title:`เลขที่ ${n} ${nick(n)}`,sub:'ส่งไปแล้ว — ไม่บันทึกซ้ำ'};sc.cur=n;return}
  sc.cur=n;
  if(sc.mode==='type'){sc.pend={n};sc.entry='';sc.err='';return}
  const late=isLate(sc.recvDate,a.due);
  if(sc.mode==='full'){sc.seats[n]=late?'late':'scored';sc.recent.unshift({n,state:late?'late':'scored',score:a.full,full:a.full,recv:recvOpts()});
    sc.fb={kind:late?'warning':'success',icon:'check',title:`${nick(n)} · เลขที่ ${n}`,sub:`ส่งแล้ว · ${late?'ส่งช้า':'ทันกำหนด'}${recvBack()?' · รับ '+fmtS(sc.recvDate):''}`,score:`${a.full}/${a.full}`}}
  else{sc.seats[n]='await';sc.recent.unshift({n,state:'await',score:null,full:a.full,recv:recvOpts()});sc.fb={kind:'acc',icon:'inbox',title:`${nick(n)} · เลขที่ ${n}`,sub:`รับงานแล้ว · รอคะแนน${recvBack()?' · รับ '+fmtS(sc.recvDate):''}`}}
}
function scanSave(){
  const sc=S.sc,a=AS(sc.asg),p=sc.pend;if(!p)return;
  const v=parseFloat(sc.entry);
  if(sc.entry===''||isNaN(v)){sc.err='พิมพ์คะแนนก่อน';return}
  if(v>a.full){sc.err=`คะแนนต้องไม่เกิน ${a.full}`;return}
  if((v*2)%1!==0){sc.err='ใส่ได้ทีละ 0.5 เช่น 7 หรือ 7.5';return}
  const late=isLate(sc.recvDate,a.due);
  const prev=sc.seats[p.n];
  sc.seats[p.n]=late?'late':'scored';
  sc.recent=sc.recent.filter(r=>r.n!==p.n);sc.recent.unshift({n:p.n,state:late?'late':'scored',score:v,full:a.full,recv:recvOpts()});
  sc.lastScore=v;sc.fb={kind:late?'warning':'success',icon:'check',title:`${nick(p.n)} · เลขที่ ${p.n}`,sub:`${p.edit?'แก้คะแนนแล้ว':'ส่งแล้ว'} · ${late?'ส่งช้า':'ทันกำหนด'}${recvBack()?' · รับ '+fmtS(sc.recvDate):''}`,score:`${v}/${a.full}`};
  sc.pend=null;sc.entry='';sc.err='';
}
function scanUndo(n){
  const sc=S.sc,prev={state:sc.seats[n],rec:sc.recent.find(r=>r.n===n)};
  sc.seats[n]='miss';sc.recent=sc.recent.filter(r=>r.n!==n);sc.sheet=null;
  toast2(`ยกเลิกการส่งของเลขที่ ${n} ${nick(n)} แล้ว`,{label:'เลิกทำ',fn:()=>{sc.seats[n]=prev.state;if(prev.rec)sc.recent.unshift(prev.rec);S.toast=null;render()}});
}

    if(k==='todo')return `<section class="card" aria-labelledby="th"><h2 id="th" style="font-size:1rem">${ic('user-off',20)} ใครยังไม่เช็ค <span class="badge-sa">ข้อเสนอ SA</span></h2>${todoNums.length?`<div class="numchips">${todoNums.slice(0,30).map(n=>`<button class="hm-chip muted" data-a="jump" data-k="${n}" aria-label="ไปที่เลขที่ ${n}">${n}</button>`).join('')}${todoNums.length>30?`<span class="tip">+${todoNums.length-30}</span>`:''}</div>`:'<div class="tip" style="color:var(--text-success)">เช็คครบทุกคนแล้ว</div>'}</section>`;
    if(k==='away')return `<section class="card" aria-labelledby="ah"><h2 id="ah" style="font-size:1rem">${ic('user-x',20)} ขาดวันนี้ <span class="badge-sa">ข้อเสนอ SA</span></h2>${away.length?away.map(n=>`<div class="rrow"><span class="hm-chip accent">${n}</span><span class="nm">${fullName(n)}</span>${badge(m[n]==='a'?'danger':m[n]==='v'?'accent':'warning',ST[m[n]][0],ST[m[n]][1])}</div>`).join(''):'<div class="tip">ไม่มีใครขาด ลา หรือป่วย</div>'}</section>`;
    return '';}).join('');
  const warns=[];
  const tiles=`<div class="tiles" role="group" aria-label="รายชื่อ ${cls.name}">${Array.from({length:cls.total},(_,i)=>tileHtml(i+1,m)).join('')}</div>`;
  const top=cardOrder('att','top').map(k=>k==='sum'?sum:'').join('');
  const side=cardsSide.trim();
  const main=`${brush}${tiles}`;
  const body=isWide()&&side?`<div class="attgrid two"><div>${main}</div><div class="attside">${scanCard}${cardsSide}</div></div>`:`<div class="attgrid">${scanCard}${top?'':''}${main}${cardsSide?`<div class="attside" style="margin-top:8px">${cardsSide}</div>`:''}</div>`;
  const conflicts=S.scen==='offline'?`<section class="card" style="border-left:4px solid var(--fill-warning);padding:8px 14px;margin-bottom:8px" role="status"><b>มีเช็คชื่อที่ยังไม่ได้ส่งในที่อื่น</b><div class="rrow"><span class="nm">ป.6/3 · 3 พ.ย. · คาบ 2 — รอส่ง</span><button data-a="toast" data-k="เปิดรายการนั้น (ลิงก์ลึก ?class&date&subject&period)">เปิด</button></div></section>`:'';
  return `${pageHead('user-check','เช็คชื่อ',`${cls.name} · ${fmt(A.date)}`)}${tb}${row2}${conflicts}${isWide()&&side?'':''}${top}${body}
  <div class="savebar" role="status" aria-live="polite">${attSaveBadge()}<span class="tip">แตะแล้วบันทึกเอง ไม่ต้องกดบันทึก · ${c.marked}/${cls.total} คน</span></div>`;
}
function attTap(n){
  const A=S.at,m=curMap();
  const cur=m[n];
  if(A.cycle){const i=cur?ST_ORDER.indexOf(cur):-1;m[n]=ST_ORDER[(i+1)%5]}
  else if(cur===A.brush)delete m[n];else m[n]=A.brush;
  A.flash=n;A.saving=true;A.pendN++;
  setTimeout(()=>{S.at.saving=false;S.at.flash=null;render()},900);
}
function attScanNext(){
  const A=S.at,m=curMap(),cls=CL(A.cls);
  const n=ord(cls.total).find(x=>!m[x]);if(!n){A.scanMsg='';return toast2('เช็คครบทุกคนแล้ว')}
  const late=true;m[n]=late?'l':'p';A.scans.unshift({n,late,t:'10:4'+(A.scans.length%10)});A.scanMsg=`${nick(n)} · เลขที่ ${n} · ${late?'สาย':'มา'}`;A.flash=n;
  setTimeout(()=>{S.at.flash=null;render()},1200);
}

/* ===================== สุ่มชื่อ ===================== */
function rdPool(){
  const R=S.rd,total=CL(R.cls).total,m=S.at.map[R.cls]||{};
  const marked=Object.keys(m).length;
  let pool=Array.from({length:total},(_,i)=>i+1);
  if(R.presentOnly)pool=pool.filter(n=>m[n]==='p'||m[n]==='l');
  if(R.useRange)pool=pool.filter(n=>n>=R.range[0]&&n<=R.range[1]);
  return {pool,marked,total};
}
function rdBlock(){const R=S.rd,p=rdPool();if(R.presentOnly&&p.marked===0)return 'unchecked';if(!p.pool.length)return 'nobody';return null}
function rdPick(){
  const R=S.rd,{pool}=rdPool();if(rdBlock())return;
  const k=R.mode==='group'?0:(R.pair?2:R.count);
  if(R.mode==='group'){
    let ns=[...pool].sort(()=>Math.random()-.5);const g=R.byGroups?R.ngroups:Math.max(1,Math.round(ns.length/R.gsize));
    R.groups=Array.from({length:g},()=>[]);ns.forEach((n,i)=>R.groups[i%g].push(n));return;
  }
  let avail=R.norepeat?pool.filter(n=>!R.called.includes(n)):pool;
  if(avail.length<k&&R.norepeat){R.called=[];avail=pool;R.msg='ครบรอบแล้ว — เริ่มรอบใหม่'}else R.msg='';
  const picks=[...avail].sort(()=>Math.random()-.5).slice(0,Math.min(k,avail.length));
  R.called.push(...picks);R.cur=picks;R.left=R.timerSec;R.run=false;
}
function rdPass(){const R=S.rd;if(!R.cur)return;R.called=R.called.filter(n=>!R.cur.includes(n));rdPick()}
function rdUndo(){const R=S.rd;if(!R.cur)return;R.called=R.called.filter(n=>!R.cur.includes(n));R.cur=R.called.length?[R.called[R.called.length-1]]:null}
function randomHtml(){
  const R=S.rd,cls=CL(R.cls),{pool,marked}=rdPool(),block=rdBlock(),inRound=R.called.length,remain=Math.max(0,pool.length-R.called.filter(n=>pool.includes(n)).length);
  const chips=CLASSES.map(x=>`<button class="pill${x.id===R.cls?' on':''}" data-a="rdcls" data-k="${x.id}" aria-pressed="${x.id===R.cls}">${x.name} <span class="n">${x.total}</span></button>`).join('');
  const notice=block?`<div class="rnotice" role="status">${ic('alert-triangle',20)}<div class="grow">${block==='unchecked'?'<b>วันนี้ยังไม่ได้เช็คชื่อห้องนี้</b> — สุ่มเฉพาะคนที่มาไม่ได้':'<b>ไม่มีใครมาเรียนวันนี้</b> หรือไม่มีเลขที่ในช่วงที่เลือก'}</div>${block==='unchecked'?`<button data-a="toast" data-k="ไปหน้าเช็คชื่อ" ><span data-a="nav" data-k="attendance" style="display:contents">ไปเช็คชื่อ</span></button>`:''}<button data-a="rdall">ใช้ทั้งห้อง (${cls.total})</button></div>`:'';
  const cur=R.cur;
  let stage;
  if(block)stage=`<div class="rstage idle" aria-live="polite"><span class="poolchip hm-chip muted">${ic('users',16)}เฉพาะคนที่มา (${pool.length})</span>${ic('mood-empty',40)}<div class="rname" style="font-size:1.3rem;color:var(--text-secondary)">ยังไม่มีรายชื่อให้สุ่ม</div><div class="tip">ดูข้อความด้านบน</div></div>`;
  else if(R.mode==='group'){
    stage=R.groups?`<div class="rstage" style="align-items:stretch;text-align:left" aria-live="polite"><span class="hm-chip muted" style="align-self:flex-start">${ic('users',16)}${R.groups.length} กลุ่ม · ${pool.length} คน</span><div class="groups">${R.groups.map((g,i)=>`<div class="grp"><b><i style="background:${['#2f6fde','#148352','#e79a1c','#7c5cd6','#c93a3a','#0d6e6a','#9c2b63','#4b7314'][i%8]}"></i>กลุ่ม ${i+1} (${g.length})</b><div>${g.map((n,j)=>`${R.leaders&&j===0&&cardOn('random','gopts')?ic('crown',14)+' ':''}${n} ${nick(n)}`).join(' · ')}</div></div>`).join('')}</div></div>`:`<div class="rstage idle"><span class="poolchip hm-chip muted">${ic('users',16)}เฉพาะคนที่มา (${pool.length})</span>${ic('users-group',40)}<div class="rname" style="font-size:1.3rem;color:var(--text-secondary)">พร้อมจับกลุ่ม</div><div class="tip">กดปุ่ม หรือกด Space</div></div>`;
  }else if(cur){
    stage=`<div class="rstage" aria-live="polite"><span class="poolchip hm-chip muted">${ic('users',16)}${R.presentOnly?'เฉพาะคนที่มา':'ทั้งห้อง'} (${pool.length})</span>${cur.length===1?`<span class="rbadge">${cur[0]}</span><div class="rname">${fullName(cur[0])}</div><div class="tip">“${nick(cur[0])}” · เลขที่ ${cur[0]} · ${cls.name}</div>`
      :R.pair&&cardOn('random','pair')?`<div class="row" style="gap:18px;flex-wrap:wrap;justify-content:center">${cur.map(n=>`<div><span class="rbadge">${n}</span><div class="rname" style="font-size:calc(var(--u)*1.6)">${nick(n)}</div></div>`).join('<div class="tip" style="font-size:1.2rem">คู่กับ</div>')}</div>`
      :`<div class="row" style="gap:8px;flex-wrap:wrap;justify-content:center">${cur.map(n=>`<span class="hchip" style="min-height:calc(var(--u)*3)"><i>${n}</i>${nick(n)}</span>`).join('')}</div>`}${R.msg?`<div class="tip" style="color:var(--text-warning)">${R.msg}</div>`:''}</div>`;
  }else stage=`<div class="rstage idle" aria-live="polite"><span class="poolchip hm-chip muted">${ic('users',16)}${R.presentOnly?'เฉพาะคนที่มา':'ทั้งห้อง'} (${pool.length})</span>${ic('dice-3',40)}<div class="rname" style="font-size:1.3rem;color:var(--text-secondary)">พร้อมสุ่ม</div><div class="tip">กดปุ่ม หรือกด Space</div></div>`;
  const go=`<button class="primary go" data-a="rdgo" ${block?'disabled':''}>${ic(R.mode==='group'?'users-group':'dice-3',24)}${R.mode==='group'?'จับกลุ่ม':'สุ่มเลย'} <span style="opacity:.8;font-weight:400">(Space)</span></button>`;
  const seg=`<div class="seg" role="group" aria-label="โหมด"><button class="${R.mode==='pick'?'on':''}" data-a="rdmode" data-k="pick">สุ่มคน</button><button class="${R.mode==='group'?'on':''}" data-a="rdmode" data-k="group">จับกลุ่ม</button></div>`;
  const cardDefs={
    hist:()=>R.mode==='pick'?`<section class="card" aria-labelledby="hh"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 id="hh" style="font-size:1rem">${ic('users',20)} เรียกแล้ว ${inRound} · เหลือ ${remain} คนในรอบนี้</h2>${inRound?`<button class="ghost" data-a="rdreset">เริ่มรอบใหม่</button>`:''}</div><div class="pbar2" role="progressbar" aria-valuenow="${inRound}" aria-valuemax="${pool.length}"><div style="width:${pool.length?Math.min(100,inRound*100/pool.length):0}%"></div></div>${inRound?`<div class="hist">${R.called.map((n,i)=>`<span class="hchip${i===R.called.length-1?' last':''}"><i>${n}</i>${nick(n)}</span>`).join('')}</div>`:'<div class="tip">ยังไม่มีใครถูกเรียก</div>'}</section>`:'',
    opts:()=>`<section class="card" aria-labelledby="oh"><h2 id="oh" style="font-size:1rem">${ic('list-numbers',20)} ตัวเลือก</h2><div class="rctl" style="margin:6px 0 0"><button class="pill${R.presentOnly?' on':''}" data-a="rdpresent" aria-pressed="${R.presentOnly}">${ic(R.presentOnly?'check':'plus',16)}เฉพาะคนที่มา (${pool.length})</button>${R.mode==='pick'?`<button class="pill${R.norepeat?' on':''}" data-a="rdnorep" aria-pressed="${R.norepeat}">${ic(R.norepeat?'check':'plus',16)}ไม่ซ้ำจนครบ</button>`:''}<span class="step" role="group" aria-label="${R.mode==='group'?'กลุ่มละ':'จำนวน'}"><span class="tip">${R.mode==='group'?'กลุ่มละ':'จำนวน'}</span><button class="ib" data-a="rdstep" data-k="-1" aria-label="ลด">${ic('minus',20)}</button><b>${R.mode==='group'?(R.byGroups?R.ngroups:R.gsize):R.count}</b><button class="ib" data-a="rdstep" data-k="1" aria-label="เพิ่ม">${ic('plus',20)}</button></span></div></section>`,
    timer:()=>`<section class="card" aria-labelledby="tmh"><h2 id="tmh" style="font-size:1rem">${ic('stopwatch',20)} จับเวลาตอบ <span class="badge-sa">ข้อเสนอ SA</span></h2><div class="timer"><div class="tring">${ringSvg(R.timerSec?R.left/R.timerSec:0,96,R.left<=5?'var(--fill-danger)':'var(--accent)')}<div class="cap">${R.left}</div></div><div><div class="seg" role="group" aria-label="เวลา">${[10,30,60].map(s=>`<button class="${R.timerSec===s?'on':''}" data-a="tsec" data-k="${s}">${s} วิ</button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="primary" data-a="trun">${ic(R.run?'player-stop':'player-play',20)}${R.run?'หยุด':'เริ่มจับเวลา'}</button><button class="ghost" data-a="tres">ตั้งใหม่</button></div></div></div></section>`,
    pass:()=>`<section class="card" aria-labelledby="psh"><h2 id="psh" style="font-size:1rem">${ic('arrow-back-up',20)} ข้าม / เลิกทำ <span class="badge-sa">ข้อเสนอ SA</span></h2><div class="row" style="flex-wrap:wrap;margin-top:6px"><button data-a="rdpass" ${R.cur?'':'disabled'}>${ic('player-skip-forward',20)}ข้ามคนนี้ (ไม่นับว่าเรียกแล้ว)</button><button data-a="rdundo" ${R.cur?'':'disabled'}>${ic('arrow-back-up',20)}เลิกทำครั้งล่าสุด</button></div></section>`,
    range:()=>`<section class="card" aria-labelledby="rgh"><h2 id="rgh" style="font-size:1rem">${ic('selector',20)} ช่วงเลขที่ <span class="badge-sa">ข้อเสนอ SA</span></h2><div class="rctl" style="margin:6px 0 0"><button class="pill${R.useRange?' on':''}" data-a="rduse" aria-pressed="${R.useRange}">${ic(R.useRange?'check':'plus',16)}ใช้ช่วงเลขที่</button><span class="step"><button class="ib" data-a="rdr" data-k="0,-1">${ic('minus',20)}</button><b>${R.range[0]}</b><button class="ib" data-a="rdr" data-k="0,1">${ic('plus',20)}</button></span><span>ถึง</span><span class="step"><button class="ib" data-a="rdr" data-k="1,-1">${ic('minus',20)}</button><b>${R.range[1]}</b><button class="ib" data-a="rdr" data-k="1,1">${ic('plus',20)}</button></span></div></section>`,
    pair:()=>`<section class="card" aria-labelledby="prh"><h2 id="prh" style="font-size:1rem">${ic('users-group',20)} จับคู่ <span class="badge-sa">ข้อเสนอ SA</span></h2><div class="rctl" style="margin:6px 0 0"><button class="pill${R.pair?' on':''}" data-a="rdpair" aria-pressed="${R.pair}">${ic(R.pair?'check':'plus',16)}สุ่ม 2 คน แสดงเป็นคู่</button></div></section>`,
    gopts:()=>R.mode==='group'?`<section class="card" aria-labelledby="gph"><h2 id="gph" style="font-size:1rem">${ic('crown',20)} ตัวเลือกกลุ่ม <span class="badge-sa">ข้อเสนอ SA</span></h2><div class="rctl" style="margin:6px 0 0"><div class="seg"><button class="${!R.byGroups?'on':''}" data-a="rdby" data-k="0">กลุ่มละกี่คน</button><button class="${R.byGroups?'on':''}" data-a="rdby" data-k="1">กี่กลุ่ม</button></div><button class="pill${R.leaders?' on':''}" data-a="rdlead" aria-pressed="${R.leaders}">${ic('crown',16)}หัวหน้ากลุ่ม</button><button data-a="copygrp" ${R.groups?'':'disabled'}>${ic('copy',20)}คัดลอกกลุ่ม</button></div></section>`:'',
  };
  const cards=cardOrder('random').map(k=>cardDefs[k]?cardDefs[k]():'').join('');
  return `${pageHead('dice-3','สุ่มชื่อ',`${cls.name} · มาเรียนวันนี้ ${marked?pool.length+' คน':'ยังไม่ได้เช็คชื่อ'}`)}<div class="chiprow" style="margin-bottom:8px" role="group" aria-label="เลือกห้อง">${chips}</div>${notice}
   <div class="rcols"><div class="rcol">${stage}<div class="rctl">${seg}${go}</div></div><div class="rcol">${cards||'<div class="card tip">ปิดการ์ดทั้งหมดอยู่ — กด "ปรับการ์ด" เพื่อเปิด</div>'}</div></div>`;

/* ===================== โหมดฉายจอ (D27) ===================== */
const PJPAGE={scan:['สแกนส่งงาน','scan'],attendance:['เช็คชื่อ','user-check'],random:['สุ่มชื่อ','dice-3']};
function pjHtml(K){
  const P=S.pjPref||{th:'dark',sz:2},sz=+P.sz;
  const k=x=>Math.round(x*K);
  const [title,icon]=PJPAGE[S.page];
  let body='';
  if(S.page==='scan'){
    const sc=S.sc,a=AS(sc.asg),c=counts(sc.seats),last=sc.recent[0];
    body=`<div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px">
      <div style="min-width:0"><div class="s2">${CL(sc.cls).name} · ${a.title}</div>${last?`<div class="big" style="font-size:${k(64)}px">น้อง${nick(last.n)} <span class="okmark" style="font-size:${k(40)}px">${ic('check',k(44))}ส่งแล้ว</span></div>`:`<div class="big" style="font-size:${k(64)}px;color:var(--pj-t2)">รอสแกน…</div>`}</div>
      <div style="text-align:right;flex:none"><div class="stat">ส่งแล้ว ${c.sub} จาก ${c.counted} คน</div><div class="pbar" style="margin-top:${k(8)}px"><div style="width:${c.counted?c.sub*100/c.counted:0}%"></div></div></div></div>
     <div class="seatp" role="group" aria-label="ผังเลขที่">${Object.keys(sc.seats).map(n=>{const s=sc.seats[n],d=['scored','late','await'].includes(s);return `<div class="${d?'d':''}" ${s==='exc'?'style="opacity:.35"':''}>${d?ic('check',k(26)):''}${n}</div>`}).join('')}</div>`;
  }else if(S.page==='attendance'){
    const A=S.at,m=curMap(),cls=CL(A.cls),c=attCounts(m,cls.total),here=c.p+c.l;
    const lastN=A.scans[0]?A.scans[0].n:Object.keys(m).filter(n=>m[n]==='p'||m[n]==='l').map(Number).slice(-1)[0];
    body=`<div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px"><div style="min-width:0"><div class="s2">${cls.name} · ${dow(A.date)} ${fmtS(A.date)}</div>${lastN?`<div class="big" style="font-size:${k(48)}px">น้อง${nick(lastN)} <span class="okmark" style="font-size:${k(36)}px">${ic('check',k(40))}มาแล้ว</span></div>`:''}</div>
      <div style="text-align:right;flex:none"><div class="stat">มาแล้ว ${here} จาก ${cls.total} คน</div></div></div>
     <div class="seatp" role="group" aria-label="ผังเลขที่">${Array.from({length:cls.total},(_,i)=>i+1).map(n=>{const d=m[n]==='p'||m[n]==='l';return `<div class="${d?'d':''}">${d?`${n}${sz===1?`<small>${nick(n)}</small>`:''}`:n}</div>`}).join('')}</div>`;
  }else{
    const R=S.rd,cur=R.cur,block=rdBlock();

function gbGenCells(cid,w,k){
  const tot=CL(cid).total,cidx=CLASSES.findIndex(c=>c.id===cid),arr=[null];
  const exc=((GBEXC[cid]||{})[w.id])||[];
  let aw=w.aw;
  const order=ord(tot);
  const subbed=new Set();
  for(let n=1;n<=tot;n++){const h=(n*37+k*11+cidx*13)%100;if(h<w.rate)subbed.add(n)}
  const awSet=new Set(order.filter(n=>subbed.has(n)&&!exc.includes(n)).slice(0,aw));
  for(let n=1;n<=tot;n++){
    if(exc.includes(n)){arr.push({k:'exc',score:null,recv:null});continue}
    if(!subbed.has(n)){arr.push({k:'none',score:null,recv:null});continue}
    let recv=w.due?shift(w.due,((n+k)%5)-2):shift(w.assigned,n%6);
    if(recv<w.assigned)recv=w.assigned;if(recv>TODAY)recv=TODAY;
    const score=awSet.has(n)?null:Math.max(0,gbRound(w.full-((n*3+k)%5)*(w.full/10)));
    arr.push({k:'sub',score,recv});
  }
  return arr;
}

function gbCount(cid,w){
  const cs=gbCells(cid,w.id),tot=CL(cid).total;let sub=0,exc=0,aw=0,miss=0;
  for(let n=1;n<=tot;n++){const s=gbSt(w,cs[n]);if(s==='exc')exc++;else if(s==='await'){sub++;aw++}else if(s==='ok'||s==='late')sub++;else if(s==='miss')miss++}
  return{sub,exc,aw,miss,tot:tot-exc,all:tot};
}
function gbVisible(){
  const g=S.gb;
  return g.works.filter(w=>(!g.subj||w.subj===g.subj)&&(!g.type||w.t===g.type)&&!g.hidT.includes(w.t)&&(g.period==='term'||(w.assigned||'').slice(0,7)===g.month))
    .sort((a,b)=>a.assigned.localeCompare(b.assigned)||a.id.localeCompare(b.id,'en',{numeric:true}));
}
function gbRowsList(ws){
  const g=S.gb,cid=g.cls,tot=CL(cid).total,out=[];
  for(let n=1;n<=tot;n++){
    if(g.rows!=='all'){
      const st=ws.map(w=>gbSt(w,gbCells(cid,w.id)[n]));
      if(g.rows==='miss'&&!st.includes('miss'))continue;
      if(g.rows==='aw'&&!st.includes('await'))continue;
    }
    out.push(n);
  }
  return out;
}
function gbTotal(cid,n,ws){
  let sc=0,fs=0,star=false;
  ws.forEach(w=>{
    if(w.hid){star=true;return}
    const c=gbCells(cid,w.id)[n],s=gbSt(w,c);
    if(s==='ok'||s==='late'){sc+=c.score;fs+=w.full}else if(s==='miss'){fs+=w.full}
  });
  return{sc,fs,star,pct:fs?Math.round(sc/fs*100):null};
}
function gbNameCell(n){
  const full=fullName(n);
  return gbPortrait()||gbList()?`<span class="gb-no">${n}</span><span class="gb-nm" title="${full}">${nick(n)} ส.</span>`:`<span class="gb-no">${n}</span><span class="gb-nm" title="${full}">${full}</span>`;
}
function gbDueText(w){
  if(!w.due)return{t:'ไม่มีกำหนดส่ง',over:false};
  const d=dayDiff(TODAY,w.due);
  if(w.closed)return{t:fmtS(w.due),over:false,lock:true};
  if(d>0)return{t:`เลยกำหนด ${d} วัน`,short:fmtS(w.due),over:true};
  if(d===0)return{t:'ครบกำหนดวันนี้',short:fmtS(w.due),over:false,today:true};
  return{t:`กำหนด ${fmtS(w.due)}`,short:fmtS(w.due),over:false};
}
function gbDateText(w,recv){
  if(!w.due)return`ไม่มีกำหนดส่ง · รับ ${fmt(recv)}`;
  if(recv<=w.due)return`ส่งทันกำหนด · รับ ${fmt(recv)}`;
  return`ส่งช้า ${dayDiff(recv,w.due)} วัน · รับ ${fmt(recv)}`;
}

function gbStrip(ws,zone){
  const g=S.gb,keys=cardOrder('gradebook',zone);if(!keys.length)return'';
  const sel=gbWork(g.sel);
  let sumS=0,sumT=0,aw=0,miss=0;ws.forEach(w=>{const k=gbCount(g.cls,w);sumS+=k.sub;sumT+=k.tot;aw+=k.aw;miss+=k.miss});
  const rate=sumT?Math.round(sumS/sumT*100):0;
  const awList=ws.map(w=>({w,k:gbCount(g.cls,w)})).filter(x=>x.k.aw>0);
  const clList=g.works.filter(w=>!w.closed&&((!w.due&&dayDiff(TODAY,w.assigned)>=14)||(w.due&&dayDiff(TODAY,w.due)>=7)));
  const tile=(k)=>{
    if(k==='sum')return `<div class="gb-tile sum" role="group" aria-label="สรุปห้อง">${gbTouch()?'':`<span>งาน <b>${ws.length}</b></span>`}<span>อัตราส่ง <b>${rate}%</b></span><button class="gb-n" data-a="gbrows" data-k="aw">รอตรวจ <b>${aw}</b></button><button class="gb-n" data-a="gbrows" data-k="miss">ค้างส่ง <b>${miss}</b> ชิ้น</button></div>`;
    if(k==='await')return `<span class="menu"><button class="gb-tile" data-a="menu" data-k="gbc-await" aria-expanded="${S.menu==='gbc-await'}">${ic('hourglass-empty',20)}รอตรวจ ${awList.length} งาน ${ic('chevron-down',16)}</button>${S.menu==='gbc-await'?`<div class="pop gb-list" role="menu">${awList.length?awList.map(x=>`<button role="menuitem" data-a="gbpickaw" data-k="${x.w.id}"><span class="grow">${x.w.title}</span><b>${x.k.aw}</b></button>`).join(''):'<div class="tip" style="padding:8px 10px">ไม่มีงานที่รอตรวจ</div>'}</div>`:''}</span>`;
    if(k==='closing')return `<span class="menu"><button class="gb-tile" data-a="menu" data-k="gbc-closing" aria-expanded="${S.menu==='gbc-closing'}">${ic('lock',20)}ควรปิดรับ ${clList.length} งาน ${ic('chevron-down',16)}</button>${S.menu==='gbc-closing'?`<div class="pop gb-list" role="menu">${clList.length?clList.map(w=>`<div class="gb-li"><span class="grow">${w.title}<div class="tip">${w.due?`เลยกำหนด ${dayDiff(TODAY,w.due)} วัน`:'ไม่มีกำหนด · สั่งมานานแล้ว'}</div></span><button data-a="gbclose" data-k="${w.id}">ปิดรับ</button></div>`).join(''):'<div class="tip" style="padding:8px 10px">ไม่มีงานที่ควรปิดรับ</div>'}</div>`:''}</span>`;
    if(k==='follow'){
      const rows=[];for(let n=1;n<=CL(g.cls).total;n++){let m=0;ws.forEach(w=>{if(gbSt(w,gbCells(g.cls,w.id)[n])==='miss')m++});if(m)rows.push([n,m])}
      rows.sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
      return `<span class="menu"><button class="gb-tile" data-a="menu" data-k="gbc-follow" aria-expanded="${S.menu==='gbc-follow'}">${ic('flag',20)}ต้องติดตาม ${rows.length} คน ${ic('chevron-down',16)}</button>${S.menu==='gbc-follow'?`<div class="pop gb-list" role="menu">${rows.slice(0,8).map(r=>`<button role="menuitem" data-a="gbrows" data-k="miss"><span class="grow">${r[0]} ${nick(r[0])}</span><b>ค้าง ${r[1]}</b></button>`).join('')}</div>`:''}</span>`;
    }
    return'';
  };
  const bottom=k=>{
    if(k==='dist'){
      if(!sel)return'';const cs=gbCells(g.cls,sel.id),bins=[0,0,0,0,0];let sc=0,c=0;
      for(let n=1;n<=CL(g.cls).total;n++){const x=cs[n];if(x.k==='sub'&&x.score!=null){const p=x.score/sel.full*100;bins[p<50?0:p<60?1:p<70?2:p<80?3:4]++;sc+=x.score;c++}}
      const mx=Math.max(1,...bins);
      return `<section class="card gb-bcard" aria-label="การกระจายคะแนน"><b>${ic('chart-histogram',20)} การกระจายคะแนน · ${sel.title}</b> <span class="tip">เฉลี่ย ${c?(sc/c).toFixed(1):'–'}/${sel.full}</span><div class="gb-hist">${['<50','50–59','60–69','70–79','80+'].map((l,i)=>`<div><i style="height:${Math.round(bins[i]/mx*48)+2}px"></i><small>${bins[i]}</small><small>${l}</small></div>`).join('')}</div></section>`;
    }

    if(k==='legend')return `<div class="gb-legend" role="note" aria-label="คำอธิบายสัญลักษณ์"><span><i class="lg ok"></i>มีคะแนน</span><span><i class="lg late"></i>ส่งช้า</span><span><i class="lg aw">✓</i>รอตรวจ</span><span><i class="lg miss">–</i>ค้างส่ง</span><span><i class="lg pend">·</i>ยังไม่ถึงกำหนด</span><span><i class="lg exc"></i>ไม่นับ (ยกเว้น)</span><span><i class="lg pd"></i>รอส่งขึ้นระบบ</span><span><i class="lg fl"></i>ส่งไม่สำเร็จ</span><span><i class="lg us"></i>ยังไม่ได้บันทึก</span></div>`;
    if(k==='help'&&!gbTouch())return `<div class="tip gb-help">${ic('keyboard',16)} ลูกศร เลื่อนช่อง · Enter หรือพิมพ์ตัวเลข กรอกคะแนน · Enter ไปคนถัดไป · Esc ปิด · Alt+Enter ดูสถานะ/วันที่รับ · Space ที่หัวคอลัมน์ = เลือกงาน</div>`;
    return'';
  };
  if(zone==='top')return `<div class="gb-strip" role="group" aria-label="การ์ดสรุป">${keys.map(tile).join('')}</div>`;
  return keys.map(bottom).join('');
}

function gbSaveCell(next){
  const g=S.gb,p=g.pop;if(!p)return;
  const w=gbWork(p.aid),cs=gbCells(g.cls,p.aid),before={...cs[p.n]};
  const entryEl=document.getElementById('gb-entry');if(entryEl)p.entry=entryEl.value.trim();
  let cell;
  if(p.st==='none')cell={k:'none',score:null,recv:null};
  else if(p.st==='exc')cell={k:'exc',score:null,recv:null};
  else{
    let score=null;
    if(p.entry!==''){const v=parseFloat(p.entry);if(isNaN(v)||v<0||v>w.full||(v*2)%1!==0){p.err=`คะแนนต้อง 0–${w.full} (ทีละ 0.5)`;render();return}score=v}
    cell={k:'sub',score,recv:p.recv||(before.k==='sub'?before.recv:TODAY)};
  }
  cs[p.n]=cell;
  g.marks.unsaved=g.marks.unsaved.filter(x=>!(x[0]===p.aid&&x[1]===p.n));
  const stChanged=before.k!==cell.k,dateChanged=before.k==='sub'&&cell.k==='sub'&&before.recv!==cell.recv;
  g.log.unshift({t:'10:4'+(g.log.length%10),x:`${cell.k==='exc'?'ตั้ง “ยกเว้น”':cell.k==='none'?'ตั้ง “ยังไม่ส่ง”':cell.score==null?'รับงาน':'ให้คะแนน '+cell.score+'/'+w.full} เลขที่ ${p.n} · ${w.title}`});
  const prevPop=p;
  if(stChanged&&before.k!=='none'||dateChanged||(stChanged&&cell.k!=='sub')){
    const msg=dateChanged?`แก้วันที่รับเป็น ${fmtS(cell.recv)} แล้ว · ${gbDateText(w,cell.recv).split(' · ')[0]}`:cell.k==='exc'?`ตั้ง “ยกเว้น” เลขที่ ${p.n} แล้ว`:cell.k==='none'?`ตั้ง “ยังไม่ส่ง” เลขที่ ${p.n} แล้ว`:`บันทึกเลขที่ ${p.n} แล้ว`;
    const cid=g.cls,aid=p.aid,n=p.n;
    toast2(msg,{label:'เลิกทำ',fn:()=>{gbCells(cid,aid)[n]=before;S.toast=null;render()}});
  }
  if(next){
    const ws=gbVisible(),rows=gbRowsList(ws),i=rows.indexOf(p.n),nn=rows[i+1];
    if(nn!=null){gbOpenPop(p.aid,nn);g.foc={aid:p.aid,n:nn};render();return}
  }
  g.pop=null;g.refocus='cell';render();
}

function gbFormSave(){
  const g=S.gb,f=g.form;

  if(f.due&&f.due<f.assigned){f.err='วันกำหนดส่งต้องไม่ก่อนวันสั่งงาน';return false}
  if(!f.cls.length){f.err='เลือกอย่างน้อย 1 ห้อง';return false}

function gbApplyForm(adjust){
