<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ui-redesign รอบ 1 — เมนูใหม่ + หน้าหลัก (mockup กดได้จริง · ชื่อสมมติ)</title>
<!--
  ไฟล์เดียว เปิดจากดิสก์ได้ ไม่โหลดอะไรจากอินเทอร์เน็ต · ข้อมูลและชื่อนักเรียนสมมติทั้งหมด
  แถบควบคุมด้านบน (พื้นดำ) ไม่ใช่ส่วนของแอป: ใช้สลับ หน้า / อุปกรณ์ / ธีม / ขนาดตัวอักษร / โครงเมนู / สถานการณ์
  tokens คัดลอกจาก src/styles/tokens.css (light + dark) + ค่าที่ VP-1 อนุมัติ (D20): --text-muted, --shadow-card, --radius-xs, --ring-focus
  ขนาดทั้งหมดอิง --u (= ขนาดตัวอักษรที่ครูตั้ง 14–24px) แทน rem ของแอปจริง
-->
<style>
/* ===== tokens (light) ===== */
.frame{
  --surface-0:#f4f6fa;--surface-1:#eef1f6;--surface-2:#ffffff;--surface-3:#ffffff;
  --text-primary:#1a1f29;--text-secondary:#59616e;--text-muted:#646c79; /* VP-1 */
  --border:rgba(20,28,46,.10);--border-strong:rgba(20,28,46,.18);
  --accent:#2f6fde;--accent-hover:#275fc0;--on-accent:#fff;--bg-accent:#e6f0fc;--bg-accent-muted:rgba(47,111,222,.10);--text-accent:#1a56b0;--border-accent:#6f9fe0; /* VP-1 */
  --bg-success:#e3f6ec;--text-success:#12703f;--fill-success:#148352;--border-success:#a6e0c2; /* fill VP-1 */
  --bg-warning:#fbefd6;--text-warning:#8a5a08;--fill-warning:#e79a1c;--border-warning:#f0cf8c;
  --bg-danger:#fbe6e6;--text-danger:#a32626;--fill-danger:#c93a3a;--border-danger:#f0b2b2; /* fill VP-1 */
  --bg-purple:#efeafc;--text-purple:#5a3fb0;--fill-purple:#7c5cd6;--fill-accent:#2f6fde;
  --tint-aqua-bg:#d9f2f0;--tint-aqua-fg:#0d6e6a;--tint-violet-bg:#ece7fb;--tint-violet-fg:#5636b8;
  --tint-orange-bg:#fce8d8;--tint-orange-fg:#9a4f0c;--tint-green-bg:#e7f3d7;--tint-green-fg:#4b7314;
  --tint-blue-bg:#e0edfc;--tint-blue-fg:#1a56b0;--tint-magenta-bg:#f8e2ee;--tint-magenta-fg:#9c2b63;
  --shadow-pop:0 8px 28px rgba(20,28,46,.14),0 2px 6px rgba(20,28,46,.08);
  --shadow-card:0 1px 2px rgba(20,28,46,.06),0 2px 8px rgba(20,28,46,.05); /* VP-1 */
  --ring:0 0 0 3px var(--bg-accent-muted),0 0 0 1.5px var(--accent); /* VP-1 */
  --scrim:rgba(10,14,22,.45);
}
.frame[data-theme=dark]{
  --surface-0:#14171d;--surface-1:#1b1f27;--surface-2:#232833;--surface-3:#2a303c;
  --text-primary:#eef1f6;--text-secondary:#a7afbd;--text-muted:#8d96a6; /* VP-1 */
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);
  --accent:#5a92ee;--accent-hover:#6ea1f2;--on-accent:#0b1220;--bg-accent:#1d2b44;--bg-accent-muted:rgba(90,146,238,.16);--text-accent:#9cc2f2;--border-accent:#4a7fc4;
  --bg-success:#10331f;--text-success:#7fdca6;--fill-success:#1f9d63;--border-success:#26623f;
  --bg-warning:#3a2a08;--text-warning:#f0c674;--fill-warning:#e79a1c;--border-warning:#6b4e18;
  --bg-danger:#3a1616;--text-danger:#f0999a;--fill-danger:#dc4a4a;--border-danger:#6b2a2a;
  --bg-purple:#241a44;--text-purple:#c4b2f0;--fill-purple:#7c5cd6;--fill-accent:#5a92ee;
  --tint-aqua-bg:#123634;--tint-aqua-fg:#7ad6d0;--tint-violet-bg:#241a44;--tint-violet-fg:#c4b2f0;
  --tint-orange-bg:#3a2410;--tint-orange-fg:#f0b276;--tint-green-bg:#1e3410;--tint-green-fg:#a6d472;
  --tint-blue-bg:#16294a;--tint-blue-fg:#9cc2f2;--tint-magenta-bg:#3a162a;--tint-magenta-fg:#f0a0c6;
  --shadow-pop:0 10px 30px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.35);
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.6);
}
/* geometry: --u = ขนาดตัวอักษรที่ตั้ง (html font-size ของแอปจริง) */
.frame{
  --u:18px;--tap:44px;
  --fs-xs:max(13px,calc(var(--u)*.85));--fs-sm:max(13px,calc(var(--u)*.9));
  --radius-xs:6px;--radius-sm:8px;--radius:12px;--radius-lg:16px;
  --rail-w:max(96px,calc(var(--u)*5.75));
  --row-h:max(var(--tap),calc(var(--u)*3.2));
  --font-sans:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;background:#d9dde4;color:#1a1f29;line-height:1.6}
/* ===== แผงควบคุม (ไม่ใช่ส่วนของแอป) ===== */
.ctl{position:sticky;top:0;z-index:100;background:#1a1f29;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;align-items:center}
.ctl .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.ctl b{opacity:.7;font-weight:400;margin-right:2px;font-size:12px}
.ctl button{font:inherit;min-height:32px;padding:0 10px;border-radius:6px;background:#39414f;color:#fff;border:1px solid #4b5566;font-size:13px;cursor:pointer}
.ctl button.on{background:#2f6fde;border-color:#9cc2f2}
.note{font-size:13px;padding:6px 12px;background:#fff7d6;color:#5a4200;line-height:1.5}
.stage{padding:12px;display:flex;justify-content:center}
.fit{position:relative}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--surface-0);color:var(--text-primary);overflow:hidden;display:flex;box-shadow:0 6px 30px rgba(0,0,0,.3);font-family:var(--font-sans);font-size:var(--u);line-height:1.6;border-radius:6px}
.frame.phone{display:block}
/* ===== element defaults ตาม base.css ===== */
:where(.frame) button{font:inherit;color:var(--text-primary);cursor:pointer;border:.5px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius-sm);height:calc(var(--u)*2.53);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.3}
:where(.frame) button:hover{background:var(--surface-1)}
:where(.frame) button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
:where(.frame) button.primary:hover{background:var(--accent-hover)}
:where(.frame) button.ghost{border-color:transparent;background:transparent}
:where(.frame) button.ghost:hover{background:var(--surface-1)}
:where(.frame) button.icon{width:calc(var(--u)*2.53);height:calc(var(--u)*2.53);padding:0;flex:none}
:where(.frame) a{color:var(--text-accent);text-decoration:none}
.frame :focus-visible{outline:none;box-shadow:var(--ring)}
.frame h1,.frame h2,.frame h3{font-weight:500;margin:0;line-height:1.35}
.touch button:not(.lk){min-height:var(--tap);min-width:var(--tap)}
.touch select{min-height:var(--tap)}
svg{flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== rail (iPad / คอม) ===== */
.rail{width:var(--rail-w);flex:none;background:var(--surface-2);border-right:.5px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:10px 6px;height:100%;overflow-y:auto;overflow-x:hidden}
.rail-logo{width:calc(var(--u)*2.67);height:calc(var(--u)*2.67);border-radius:11px;margin:0 auto 8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.rail-gl{font-size:var(--fs-xs);color:var(--text-muted);text-align:center;padding:8px 0 2px;border-top:.5px solid var(--border);margin-top:4px;line-height:1.3;white-space:nowrap}
.rail-group:first-of-type .rail-gl{border-top:none;margin-top:0;padding-top:2px}
.rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;min-height:var(--tap);height:auto;font-size:var(--fs-xs);color:var(--text-secondary);border-radius:var(--radius-sm);border:none;background:transparent;text-decoration:none;width:100%;text-align:center;line-height:1.25;position:relative;white-space:nowrap}
.rail-item:hover{background:var(--surface-1)}
.rail-item.on{background:var(--bg-accent);color:var(--text-accent);font-weight:500}
.rail-item.on::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.rail-spacer{flex:1}
button.rail-item{height:auto;padding:6px 2px}
.frame:not(.touch) .rail-item{min-height:0;padding:5px 2px}
.frame:not(.touch) .todo-row button,.frame:not(.touch) .resume button,.frame:not(.touch) .banner button{min-height:40px}
.frame:not(.touch) .seg button{min-height:32px}
.frame:not(.touch) button.rail-item{padding:5px 2px}
.frame:not(.touch) .rail-gl{padding:6px 0 1px}
.rail-sync{display:flex;justify-content:center;padding:4px 0 6px}
.rail-sync .sync{flex-direction:column;gap:0;white-space:normal;text-align:center;max-width:100%}
.hide-gl .rail-gl{font-size:0;padding:4px 0 0;border-top:.5px solid var(--border)}
/* ===== bottom tabs (มือถือ) ===== */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-top:.5px solid var(--border);padding:6px 4px 10px;align-items:end}
.tab{position:relative;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-xs);color:var(--text-secondary);background:transparent;border:none;padding:4px 0;min-height:var(--tap);text-decoration:none;line-height:1.25;height:auto;border-radius:var(--radius-sm)}
.tab.on{color:var(--text-accent);font-weight:500}
.tab .ti{position:relative;z-index:1}
.tab .pip{position:absolute;left:50%;top:4px;width:44px;height:28px;margin-left:-22px;border-radius:14px;background:transparent}
.tab.on .pip{background:var(--bg-accent)}
.tab-scan{justify-content:flex-end;gap:3px}
.tab-scan-btn{width:clamp(56px,calc(var(--u)*3.5),64px);height:clamp(56px,calc(var(--u)*3.5),64px);border-radius:50%;margin-top:-18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;border:3px solid var(--surface-2);box-shadow:var(--shadow-pop)}
.tab-scan.on .tab-scan-btn{background:var(--accent-hover)}
/* ===== sheet เมนูมือถือ ===== */
.sheet-overlay{position:absolute;inset:0;z-index:160;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface-2);border-radius:16px 16px 0 0;padding:8px 12px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-pop)}
.sheet-grab{width:44px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 4px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 4px 10px;border-bottom:.5px solid var(--border)}
.sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-item{display:flex;align-items:center;gap:12px;min-height:56px;height:auto;padding:0 14px;font-size:1em;border:.5px solid var(--border);background:var(--surface-2);border-radius:var(--radius);color:var(--text-primary);text-decoration:none;justify-content:flex-start}
.sheet-item.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.sheet-item.danger{color:var(--text-danger);border-color:transparent}
.sheet-gl{font-size:var(--fs-xs);color:var(--text-muted);padding:6px 4px 0}
.sheet-item{font-weight:500}
/* ===== main ===== */
.main{flex:1;min-width:0;padding:20px 24px 40px;overflow-y:auto;height:100%;position:relative}
.phone .main{padding:14px 14px 96px}
.pad-sm .main{padding:16px 16px 40px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.uh-l{display:flex;align-items:center;gap:10px;min-width:0}
.uh-ic{width:calc(var(--u)*2.53);height:calc(var(--u)*2.53);border-radius:11px;flex:none;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center}
.uh-title{font-size:calc(var(--u)*1.27);font-weight:500;line-height:1.25}
.uh-sub{font-size:var(--fs-sm);color:var(--text-secondary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uh-sub .sep::before{content:"·";margin-right:8px}
.uh-act .on-hide{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.banner.hidebar{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.rail-item.optitem{outline:1px dashed var(--border-warning);outline-offset:-2px}
.uh-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:calc(var(--u)*2);padding:0 12px;border-radius:999px;border:.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent);font-weight:500}
.touch .pill{min-height:var(--tap)}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 10px;border-radius:999px;white-space:nowrap;min-height:28px}
.sync.online{background:var(--bg-success);color:var(--text-success)}
.sync.offline{background:var(--bg-warning);color:var(--text-warning)}
.sync.saving{background:var(--surface-1);color:var(--text-secondary)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5;min-height:24px}
.chip.danger{background:var(--bg-danger);color:var(--text-danger)}
.chip.warning{background:var(--bg-warning);color:var(--text-warning)}
.chip.muted{background:var(--surface-1);color:var(--text-secondary)}
.chip.accent{background:var(--bg-accent);color:var(--text-accent)}
.chip.success{background:var(--bg-success);color:var(--text-success)}
.chip.violet{background:var(--tint-violet-bg);color:var(--tint-violet-fg)}
.chip.aqua{background:var(--tint-aqua-bg);color:var(--tint-aqua-fg)}
.chip.orange{background:var(--tint-orange-bg);color:var(--tint-orange-fg)}
.chip.green{background:var(--tint-green-bg);color:var(--tint-green-fg)}
.chip.blue{background:var(--tint-blue-bg);color:var(--tint-blue-fg)}
.card{background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:16px}
.phone .card{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sec{color:var(--text-secondary)}
.sub{font-size:var(--fs-sm);color:var(--text-secondary)}
.xs{font-size:var(--fs-xs);color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== ต้องทำตอนนี้ ===== */
.todo{padding:0;overflow:hidden;border-left:4px solid var(--fill-warning);border-radius:var(--radius-lg)}
.todo-h .ic{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.todo-h{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;font-weight:500}
.todo-h .n{margin-left:auto}
.todo-row{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:var(--tap);border-top:.5px solid var(--border);flex-wrap:wrap}
.todo-row .ic{width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.todo-row .ic.warn{background:var(--bg-warning);color:var(--text-warning)}
.todo-row .ic.acc{background:var(--bg-accent);color:var(--text-accent)}
.todo-row .ic.dan{background:var(--bg-danger);color:var(--text-danger)}
.todo-row .t{flex:1 1 12em;min-width:0}
.todo-row button{height:auto;min-height:calc(var(--u)*2.2);font-size:var(--fs-sm);white-space:nowrap}
/* ===== ปุ่มลัด ===== */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
.phone .qa,.ipadP .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
.qa-btn{height:auto;min-height:calc(var(--u)*3.6);display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:10px 12px;border-radius:var(--radius);background:var(--surface-2);border:.5px solid var(--border);box-shadow:var(--shadow-card);text-align:left;color:inherit;text-decoration:none;min-width:0}
.qa-btn .ic{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:10px;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center;flex:none}
.qa-btn .t{font-weight:500;font-size:1em;line-height:1.3}
.qa-btn .s{font-size:var(--fs-xs);color:var(--text-secondary);line-height:1.3}
.qa-btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.qa-btn.primary .ic{background:rgba(255,255,255,.18);color:var(--on-accent)}
.qa-btn.primary .s{color:inherit;opacity:.85}
.qa-btn:hover{background:var(--surface-1)}.qa-btn.primary:hover{background:var(--accent-hover)}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 12px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);border:.5px solid var(--border-accent)}
.resume button{min-height:calc(var(--u)*2.2);height:auto;font-size:var(--fs-sm)}
/* ===== stat ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.phone .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{min-width:0;overflow-wrap:anywhere;white-space:normal;background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:10px 12px;text-align:left;height:auto;display:block;width:100%;min-width:0;cursor:pointer}
.stat:hover{background:var(--surface-1)}
.stat .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stat .lbl{font-size:var(--fs-xs);color:var(--text-secondary)}
.stat .val{font-size:calc(var(--u)*1.6);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0}
.stat .val small{font-size:var(--fs-xs);font-weight:400;color:var(--text-secondary)}
.stat .val.na{font-size:1em;font-weight:500;line-height:1.4;padding:calc(var(--u)*.2) 0}
.stat .hint{font-size:var(--fs-xs);color:var(--text-secondary);line-height:1.35}
.stat .ic{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic.accent{background:var(--bg-accent);color:var(--text-accent)}.ic.neutral{background:var(--surface-1);color:var(--text-secondary)}.ic.success{background:var(--bg-success);color:var(--text-success)}.ic.warning{background:var(--bg-warning);color:var(--text-warning)}.ic.danger{background:var(--bg-danger);color:var(--text-danger)}
.val.danger{color:var(--text-danger)}
/* ===== การ์ด grid ===== */
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.one .cols{grid-template-columns:minmax(0,1fr)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ch h2{font-size:1em;font-weight:500;display:flex;align-items:center;gap:6px}
.ch h2 svg{color:var(--text-secondary)}
.lk{font-size:var(--fs-sm);color:var(--text-accent);background:none;border:none;padding:0 6px;height:auto;min-height:var(--tap)}
.ch .seg{margin-left:auto}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:var(--radius-sm);background:var(--surface-1);border:.5px solid var(--border)}
.seg button{height:calc(var(--u)*1.87);min-height:0;padding:0 10px;border-radius:6px;font-size:var(--fs-sm);border:.5px solid transparent;background:transparent;color:var(--text-secondary)}
.seg button.on{background:var(--surface-2);color:var(--text-primary);font-weight:500;border-color:var(--border-strong)}
.touch .seg button{min-height:var(--tap)}
.asg{padding:10px 0;border-top:.5px solid var(--border)}
.asg:first-of-type{border-top:none;padding-top:4px}
.asg .ttl{font-weight:500}
.prog .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.prog{display:grid;grid-template-columns:3.2em minmax(0,1fr) minmax(3.6em,auto) auto;gap:8px;align-items:center;font-size:var(--fs-xs);margin-top:6px;min-height:28px}
.prog .n{font-variant-numeric:tabular-nums;color:var(--text-secondary);text-align:right}
.pbar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.pbar>div{height:100%;border-radius:4px;background:var(--fill-success)}
.phone .prog{grid-template-columns:3.2em minmax(0,1fr) minmax(3.6em,auto)}.phone .prog>:nth-child(4){grid-column:1/-1;justify-self:end}
.chipbtn{height:auto;min-height:32px;padding:2px 10px;border-radius:999px;font-size:var(--fs-xs);gap:4px}
.touch .chipbtn{min-height:var(--tap);min-width:0}
.chipbtn.danger{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.chipbtn.accent{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.chipbtn.muted{background:var(--surface-1);color:var(--text-primary)}
.namelist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:.5px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;border-radius:0;height:auto;min-height:var(--row-h);text-align:left;justify-content:flex-start}
.lrow:first-of-type{border-top:none}
.lrow:hover{background:var(--surface-1)}
.av{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:var(--bg-accent);color:var(--text-accent);display:inline-flex;align-items:center;justify-content:center;font-weight:500;flex:none;font-size:var(--fs-xs)}
.stack{display:flex;gap:2px;height:8px;margin-top:6px}.stack>i{display:block;border-radius:2px}
.att{padding:8px 0;border-top:.5px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;border-radius:0;height:auto;min-height:var(--row-h);text-align:left;display:block}
.att:first-of-type{border-top:none}
.att:hover{background:var(--surface-1)}
.empty{text-align:center;color:var(--text-secondary);padding:24px 12px}
.empty .ei{color:var(--text-muted);margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:.5px solid var(--border);align-items:center;flex-wrap:wrap}
.kv:first-of-type{border-top:none}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:8px}
.cls{border:.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface-1)}
.cls .nm{font-weight:500}
.cls{display:flex;flex-direction:column;gap:6px;padding:0}
.cls-main{display:block;width:100%;height:auto;text-align:left;background:transparent;border:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;padding:8px 10px}
.cls-main:hover{background:var(--surface-2)}
.cls>.chipbtn{align-self:flex-end;margin:0 8px 8px}
/* ===== drawer ===== */
.drawer-scrim{position:absolute;inset:0;z-index:120;background:var(--scrim);display:flex;justify-content:flex-end}
.drawer{width:min(420px,100%);background:var(--surface-2);height:100%;overflow-y:auto;border-left:.5px solid var(--border);padding:14px 16px 24px;display:flex;flex-direction:column;gap:6px}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.drawer-head .t{font-weight:500;font-size:calc(var(--u)*1.07);line-height:1.35}
.pref{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--border);min-height:calc(var(--u)*3.4)}
.pref:first-of-type{border-top:none}
.pref .ic{width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:8px;background:var(--bg-accent);color:var(--text-accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pref.off .ic{background:var(--surface-1);color:var(--text-muted)}
.pref.off .nm,.pref.off .ds{color:var(--text-muted)}
.pref .nm{font-weight:500;line-height:1.3}.pref .ds{font-size:var(--fs-xs);color:var(--text-secondary);line-height:1.3}
.pref .mv{display:flex;flex-direction:row;gap:4px}
.pref .mv button{width:32px;height:32px;min-height:0;min-width:0;padding:0;border-radius:8px}
.touch .pref .mv button{width:var(--tap);height:var(--tap)}
.pref .mv button:disabled{opacity:.35;cursor:default}
.switch{position:relative;width:calc(var(--u)*4);height:calc(var(--u)*2.4);min-width:52px;min-height:30px;border-radius:999px;background:var(--border-strong);border:none;padding:0;flex:none;transition:none}
.switch[aria-checked=true]{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:calc(100% / 1.75 - 6px);aspect-ratio:1;height:calc(100% - 6px);width:auto;border-radius:50%;background:#fff}
.switch[aria-checked=true]::after{left:auto;right:3px}
.lock{font-size:var(--fs-xs);color:var(--text-muted);display:flex;align-items:center;gap:4px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;z-index:300;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);font-size:1em;border:.5px solid var(--border-success);box-shadow:var(--shadow-pop);background:var(--bg-success);color:var(--text-success);width:min(440px,calc(100% - 24px))}
.phone .toast{bottom:86px}
.fab{position:absolute;right:16px;bottom:20px;z-index:140;background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning);box-shadow:var(--shadow-pop);font-weight:500;height:auto;min-height:var(--tap)}
.phone .fab{bottom:86px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--bg-accent);color:var(--text-accent);border:.5px solid var(--border-accent);font-size:var(--fs-sm)}
.banner button{margin-left:auto;height:auto;min-height:calc(var(--u)*2.2);font-size:var(--fs-sm)}
.opt{font-size:13px;letter-spacing:.02em;background:#fff7d6;color:#5a4200;border:1px solid #e8d48a;border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400;line-height:1.5}
.skel{height:1em;border-radius:6px;background:linear-gradient(90deg,var(--surface-1),var(--border),var(--surface-1));margin:6px 0}
</style>

function todoCard(sc){

  if(sc.termEnd)rows.push({ic:'calendar-event',cl:'warn',t:`<b>ภาคเรียนที่ ${sc.term.name} สิ้นสุดเมื่อ ${fmt(sc.term.end)} แล้ว</b> — พร้อมเริ่มภาคเรียนถัดไปไหม`,b:'เริ่มภาคเรียนใหม่'});
  if(sc.time>sc.lateAfter)sc.att.filter(a=>a.marked===0).forEach(a=>{const c=CLASSES.find(x=>x.id===a.c);rows.push({ic:'user-check',cl:'warn',t:`<b>${c.name} ยังไม่ได้เช็คชื่อ</b> · ${c.total} คน (เลยเวลา ${sc.lateAfter} แล้ว)`,b:'เช็คชื่อ'})});

  else if(sc.backupDays>7)rows.push({ic:'database-export',cl:'warn',t:`<b>สำรองข้อมูลล่าสุด ${sc.backupDays} วันที่แล้ว</b> · ควรสำรองสัปดาห์ละครั้ง`,b:'สำรองตอนนี้'});

    ${rows.map(r=>`<div class="todo-row"><span class="ic ${r.cl}">${ic(r.ic,20)}</span><span class="t">${r.t}</span><button data-a="todo">${r.b}</button></div>`).join('')}</section>`;

function attSummary(sc){
  const complete=sc.att.filter(a=>a.marked===CLASSES.find(c=>c.id===a.c).total).length;
  const none=sc.att.filter(a=>a.marked===0).length;
  if(none===sc.att.length)return `ยังไม่ได้เช็คชื่อ ${sc.att.length} ห้อง`;
  if(complete===sc.att.length)return 'วันนี้เช็คครบทุกห้อง';
  return `ยังเหลือ ${sc.att.length-complete} ห้อง`;
}

function stats(sc){
  const awaiting=[...sc.open,...sc.grading].reduce((n,a)=>n+a.per.reduce((m,p)=>m+p.a,0),0);
  const missing=sc.open.reduce((n,a)=>n+a.per.reduce((m,p)=>m+p.m,0),0);
  const complete=sc.att.filter(a=>a.marked===CLASSES.find(c=>c.id===a.c).total).length;
  const partial=sc.att.filter(a=>a.marked>0&&a.marked<CLASSES.find(c=>c.id===a.c).total).length;
  const marked=sc.att.filter(a=>a.marked>0);const pres=marked.reduce((n,a)=>n+a.p+a.l,0),tot=marked.reduce((n,a)=>n+a.marked,0);
  const pct=tot?Math.round(pres/tot*100):null;
  const stale=sc.offline?' '+CHIP('warning','ข้อมูลเก่า'):'';
  const st=(act,k,lbl,val,unit,icn,tone,hint,vt)=>`<button class="stat" data-a="${act}" data-k="${k}"><div class="top"><span class="lbl">${lbl}</span><span class="ic ${tone}">${ic(icn,20)}</span></div><div class="val${vt?' '+vt:''}">${val}${unit?`<small> ${unit}</small>`:''}</div><div class="hint">${hint}${stale}</div></button>`;
  const attHint=`เช็คครบ ${complete} จาก ${sc.att.length} ห้อง${partial?` · บางส่วน ${partial}`:''}`;
  return `<div class="stat-row">
    ${st('list','open','งานที่เปิดรับ',sc.open.length,'','clipboard-list','neutral','กดดูรายห้อง')}
    ${st('list','awaiting','รอตรวจ',awaiting,'ชิ้น','hourglass-empty','accent','รวมงานที่ปิดรับแล้ว')}
    ${st('list','missing','ยังไม่ส่ง',missing,'ชิ้น','alert-circle','danger','นับเฉพาะงานที่ยังรับอยู่',missing?'danger':'')}
    ${sc.past?st('nav','attendance','มาเรียนวันนี้','—','','user-check','success','ปีเก่า ไม่มีเช็คชื่อวันนี้','na')
      :pct==null?st('nav','attendance','มาเรียนวันนี้','ยังไม่ได้เช็คชื่อ','','user-check','success',attHint,'na'):st('nav','attendance','มาเรียนวันนี้',pct+'%','','user-check','success',attHint)}
  </div>`;
}
function progRow(a,p,sc){
  const c=CLASSES.find(x=>x.id===p.c);const d=den(p);const pct=Math.round(p.s/d*100);const tone=p.m>0?'var(--fill-warning)':'var(--fill-success)';
  const chips=[];
  if(p.m>0)chips.push(CHIPBTN('danger',`ยังไม่ส่ง ${p.m}`,'alert-circle','nav','gradebook'));
  if(p.a>0)chips.push(CHIPBTN('accent',`รอตรวจ ${p.a}`,'hourglass-empty','nav','gradebook'));
  if(!a.closed&&!sc.past&&notYet(p)>0)chips.push(CHIPBTN('muted',`สแกนห้องนี้`,'scan','nav','scan'));
  if(!chips.length)chips.push(CHIP('success','ครบแล้ว','circle-check'));
  return `<div class="prog"><span>${c.name}</span><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${c.name} ส่งแล้ว ${p.s} จาก ${d}"><div style="width:${pct}%;background:${tone}"></div></div><span class="n">${p.s}/${d}${p.x?`<br><span class="xs">ยกเว้น ${p.x}</span>`:''}</span><span class="chips">${chips.join('')}</span></div>`;
}

  if(a==='reset-yes'){S.prefs=DEFAULT_PREFS();S.confirmReset=false;S.live='คืนค่าเริ่มต้นแล้ว';save();return}
});
function save(){toast('บันทึกแล้ว · ใช้กับทุกเครื่อง')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.page!=='home'){S.page='home';S.confirmReset=false;render()}});
window.addEventListener('resize',render);
render();
</script>
</body>
