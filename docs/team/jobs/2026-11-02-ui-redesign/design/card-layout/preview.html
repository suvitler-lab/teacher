/* ===== viewer controls (NOT part of the app) ===== */
html{font-size:16px}
body.v{margin:0;background:#0e1117;color:#e8ebf1;font:14px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;min-height:100vh}
.cb{position:sticky;top:0;z-index:50;background:#171b24;border-bottom:1px solid #2a3140;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.cb .g{display:flex;align-items:center;gap:6px}
.cb .g>b{font-weight:500;color:#9aa4b6;margin-right:2px}
.cb button{font:inherit;font-size:13px;height:32px;padding:0 11px;border-radius:7px;border:1px solid #3a4356;background:#212734;color:#e8ebf1;cursor:pointer}
.cb button[aria-pressed=true]{background:#2f6fde;border-color:#2f6fde;color:#fff}
.cb button:focus-visible{outline:2px solid #9cc2f2;outline-offset:2px}
.meter{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:#cfd6e4}
.meter .pillm{background:#212734;border:1px solid #3a4356;border-radius:7px;padding:3px 10px;white-space:nowrap}
.meter b{color:#fff}
.meter .good{color:#7fdca6}
.work{display:flex;align-items:flex-start}
.stage{flex:1;min-width:0;padding:12px}
.fwrap{overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #2a3140}
.panel{width:290px;flex:none;position:sticky;top:56px;margin:12px 12px 12px 0;background:#171b24;border:1px solid #2a3140;border-radius:10px;padding:12px;font-size:13px;max-height:calc(100vh - 72px);overflow:auto}
.panel[hidden]{display:none}
.panel h3{margin:0 0 4px;font-size:14px;font-weight:500}
.panel p{margin:0 0 8px;color:#9aa4b6;font-size:12px}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;padding:5px 0;border-top:1px solid #2a3140}
.pr label{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
.pr label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .w{font-size:11px;color:#9aa4b6;border:1px solid #3a4356;border-radius:4px;padding:0 4px;margin-left:4px}
.pr button{height:28px;width:30px;padding:0}
.pr.off label{opacity:.55}
.note{margin-top:10px;font-size:12px;color:#9aa4b6;line-height:1.5}
.cols-info{margin-top:8px;font-size:12px;color:#cfd6e4;background:#212734;border-radius:6px;padding:6px 8px}

/* ===== app tokens (copied from src/styles/tokens.css) ===== */
.app{
  --surface-0:#f4f6fa;--surface-1:#eef1f6;--surface-2:#fff;--surface-3:#fff;
  --text-primary:#1a1f29;--text-secondary:#59616e;--text-muted:#646c79;
  --border:rgba(20,28,46,.10);--border-strong:rgba(20,28,46,.18);
  --accent:#2f6fde;--accent-hover:#275fc0;--on-accent:#fff;--bg-accent:#e6f0fc;--bg-accent-muted:rgba(47,111,222,.10);--text-accent:#1a56b0;--border-accent:#6f9fe0;
  --bg-success:#e3f6ec;--text-success:#12703f;--fill-success:#148352;--border-success:#a6e0c2;
  --bg-warning:#fbefd6;--text-warning:#8a5a08;--fill-warning:#e79a1c;--border-warning:#f0cf8c;
  --bg-danger:#fbe6e6;--text-danger:#a32626;--fill-danger:#c93a3a;--border-danger:#f0b2b2;
  --bg-purple:#efeafc;--text-purple:#5a3fb0;--fill-purple:#7c5cd6;
  --fill-accent:#2f6fde;--shadow-card:0 1px 2px rgba(20,28,46,.06),0 2px 8px rgba(20,28,46,.05);
  --radius-sm:8px;--radius:12px;--radius-lg:16px;--ring-focus:0 0 0 3px var(--bg-accent-muted);
  --tap:44px;--fs-xs:max(13px,.85rem);--fs-sm:max(13px,.9rem);--rail-w:max(96px,5.75rem);
  --row-h:calc(1rem*3.2);
  --rp-danger:var(--fill-danger);--rp-purple:var(--fill-purple);
}
.app[data-theme=dark]{
  --surface-0:#14171d;--surface-1:#1b1f27;--surface-2:#232833;--surface-3:#2a303c;
  --text-primary:#eef1f6;--text-secondary:#a7afbd;--text-muted:#8d96a6;
  --border:rgba(255,255,255,.10);--border-strong:rgba(255,255,255,.18);
  --accent:#5a92ee;--accent-hover:#6ea1f2;--on-accent:#0b1220;--fill-accent:#5a92ee;--shadow-card:0 1px 2px rgba(0,0,0,.4);
  --bg-accent:#1d2b44;--bg-accent-muted:rgba(90,146,238,.16);--text-accent:#9cc2f2;--border-accent:#4a7fc4;
  --bg-success:#10331f;--text-success:#7fdca6;--fill-success:#1f9d63;--border-success:#26623f;
  --bg-warning:#3a2a08;--text-warning:#f0c674;--border-warning:#6b4e18;
  --bg-danger:#3a1616;--text-danger:#f0999a;--fill-danger:#dc4a4a;--border-danger:#6b2a2a;
  --bg-purple:#241a44;--text-purple:#c4b2f0;
  --rp-danger:var(--text-danger);--rp-purple:var(--text-purple);
}
.app{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:1rem;line-height:1.6;color:var(--text-primary);background:var(--surface-0);display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);transform-origin:0 0;text-align:left}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3,.app p{margin:0}.app h1,.app h2,.app h3{font-weight:500}
.app button{font:inherit;cursor:pointer;border:.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);border-radius:var(--radius-sm);height:2.53rem;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.app.touch button{min-height:var(--tap)}
.app button:hover{background:var(--surface-1)}
.app button.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.app button.primary:hover{background:var(--accent-hover)}
.app button.ghost{background:transparent}
.app button:focus-visible,.app select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app select{font:inherit;height:2.27rem;border:.5px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-primary);padding:0 8px}
.app svg.i{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--text-secondary)}.sm{font-size:var(--fs-sm)}.xs{font-size:var(--fs-xs)}
.num{font-variant-numeric:tabular-nums}

/* rail + shell */
.rail{background:var(--surface-2);border-right:.5px solid var(--border);padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.rail-logo{width:2.67rem;height:2.67rem;border-radius:11px;margin:0 auto 8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:500}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:var(--fs-xs);line-height:1.25;color:var(--text-secondary);border-radius:var(--radius-sm);min-height:var(--tap);justify-content:center;position:relative}
.rail-item.on{background:var(--bg-accent);color:var(--text-accent);font-weight:500}
.rail-item.on::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.main{min-width:0;padding:20px 24px 40px}
.app.narrow .main{padding:16px 20px 32px}
.pg{width:100%}
.after .pg{max-width:96rem;margin-inline:auto}
.before.pg-home .pg{max-width:78rem}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.uh-l{display:flex;align-items:center;gap:10px}
.uh-ic{width:2.4rem;height:2.4rem;border-radius:10px;background:var(--bg-accent);color:var(--text-accent);display:flex;align-items:center;justify-content:center}
.uh-title{font-size:1.27rem;font-weight:500;line-height:1.25}
.uh-sub{font-size:var(--fs-sm);color:var(--text-secondary)}
.uh-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:2.27rem!important;border-radius:999px!important;padding:0 12px!important;font-size:var(--fs-sm);background:var(--surface-2)}
.app.touch .pill{height:auto!important;min-height:var(--tap)}
.pill.on{background:var(--bg-accent)!important;color:var(--text-accent);border-color:var(--border-accent)!important;font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
.bar .tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:2px 8px;min-height:1.6rem;border-radius:999px;white-space:nowrap;border:.5px solid transparent;line-height:1.5}
.chip.success{background:var(--bg-success);color:var(--text-success);border-color:var(--border-success)}
.chip.warning{background:var(--bg-warning);color:var(--text-warning);border-color:var(--border-warning)}
.chip.danger{background:var(--bg-danger);color:var(--text-danger);border-color:var(--border-danger)}
.chip.accent{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.chip.muted{background:var(--surface-1);color:var(--text-secondary);border-color:var(--border)}
.card{background:var(--surface-2);border:.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-card);container:card/inline-size;min-width:0}
.cardhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.cardhead h2{display:flex;align-items:center;gap:6px;font-size:1rem;line-height:1.35}
.cardhead h2 svg{color:var(--text-secondary)}
.cardhead .lk{font-size:var(--fs-sm);color:var(--text-accent);padding:0 8px;min-height:2rem;border:none;background:none;height:auto}
.rowline{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:.5px solid var(--border);min-height:var(--row-h)}
.rowline:first-of-type{border-top:none}
.rowline .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== THE CARD-LAYOUT SYSTEM (the thing being proposed) ===== */
.stack-col,.pg-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pg-cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:12px;align-items:start;min-width:0}
.pg-cols[data-n="1"]{max-width:48rem}
.split{display:grid;gap:12px;align-items:start;grid-template-columns:minmax(0,1fr)}

/** columns for a region: as many as fit with each column >= MIN_COL rem, never more than max or the number of cards */
const MIN_COL = 26, GAP = 0.75;
function colsFor(widthRem, max, count, minCol = MIN_COL) {
  const fit = Math.floor((widthRem + GAP) / (minCol + GAP));
  return Math.max(1, Math.min(max, count, fit));
}
/** keys in the teacher's order -> n columns. Next card goes to the column with the least weight so far (tie = leftmost). */
function splitColumns(keys, n, weightOf) {
  const cols = Array.from({ length: n }, () => ({ h: 0, keys: [] }));

    let t = cols[0];
    for (const c of cols) if (c.h < t.h) t = c;
    t.keys.push(k); t.h += weightOf(k);

  return cols.map((c) => c.keys);

    + `<div class="bar">${classChips(0)}<div class="stu-tb"><label class="stu-search">${ic("search", 18)}<span class="sm">ค้นหาชื่อ / รหัส</span></label><select aria-label="เรียง"><option>เรียงตามเลขที่</option></select></div></div>`;
  if (mode === "before") {
    const strip = keys.filter((k) => k === "sum" || k === "qr"), side = keys.filter((k) => k === "moved" || k === "recent");
    const two = side.length && S.w >= 1180;
    return top + `<div class="stack-col" style="margin-bottom:10px">${stack("students", strip)}</div>` + (two
      ? `<div class="split" style="grid-template-columns:minmax(0,1fr) 20rem">${listCard()}<div class="stack-col">${side.map((k) => CARDS.students[k].html()).join("")}</div></div>`
      : `<div class="stack-col">${listCard()}${side.map((k) => CARDS.students[k].html()).join("")}</div>`);
  }
  const split = pgRem >= 54 && keys.length > 0;
  S.info.students = split ? "แยก 2 ส่วน: รายชื่อ | แถบข้าง 20rem (ตรึง)" : keys.length ? "การ์ดอยู่ใต้รายชื่อ (ยกเว้นแถบตัวเลขอยู่บน)" : "ไม่มีการ์ด: รายชื่อเต็มกว้าง";
  if (split) return top + `<div class="split sm"><div>${listCard()}</div><aside class="aside sticky" aria-label="การ์ดข้างรายชื่อ">${region("students", keys, 1)}</aside></div>`;
  const pin = keys.includes("sum") ? ["sum"] : [], rest = keys.filter((k) => k !== "sum");
  return top + (pin.length ? `<div style="margin-bottom:12px">${CARDS.students.sum.html()}</div>` : "") + listCard() + (rest.length ? `<div class="pg-gap">${region("students", rest, 2)}</div>` : "");
};

/* ===== Home ===== */
PAGE.home = (pgRem, mode) => {
  const keys = vis("home");
  const top = head("home", "หน้าหลัก", "วันจันทร์ที่ 3 พ.ย. 2569 · ภาคเรียนที่ 2/2569", `<select aria-label="ภาคเรียน"><option>2/2569</option></select>`)
    + `<div class="card hm-todo"><div class="hm-todo-h"><span class="ic-s">${ic("alert", 20)}</span><h2>ต้องทำตอนนี้</h2><span class="chip warning" style="margin-left:auto">2 เรื่อง</span></div>
        <div class="hm-todo-row"><span style="flex:1 1 12em">ป.6/2 ยังไม่ได้เช็คชื่อวันนี้</span><button>เช็คชื่อ</button></div><div class="hm-todo-row"><span style="flex:1 1 12em">งาน “รายงานสังคมศึกษา” เลยกำหนด 18 คนยังไม่ส่ง</span><button>ดูงาน</button></div></div>
      <div class="hm-actions"><div class="hm-action primary"><span class="ic">${ic("qr", 22)}</span><div><div class="t">สแกนรับงาน</div><div class="s">เปิดเครื่องยิง</div></div></div><div class="hm-action"><span class="ic">${ic("check", 22)}</span><div><div class="t">เช็คชื่อ</div><div class="s">ป.6/2 ยังไม่เช็ค</div></div></div><div class="hm-action"><span class="ic">${ic("book", 22)}</span><div><div class="t">สมุดคะแนน</div><div class="s">ลงคะแนน</div></div></div><div class="hm-action"><span class="ic">${ic("users", 22)}</span><div><div class="t">สุ่มเรียกชื่อ</div><div class="s">ป.6/1</div></div></div></div>
      <div class="hm-stats"><div class="hm-stat"><span class="xs muted">งานที่เปิดรับ</span><div class="val">9</div></div><div class="hm-stat"><span class="xs muted">รอตรวจ</span><div class="val">14<small> ชิ้น</small></div></div><div class="hm-stat"><span class="xs muted">ยังไม่ส่ง</span><div class="val" style="color:var(--text-danger)">41<small> ชิ้น</small></div></div><div class="hm-stat"><span class="xs muted">มาเรียนวันนี้</span><div class="val">91<small>%</small></div></div></div>`;
  if (mode === "before") {
    const WIDE = ["open", "classes"], l = keys.filter((k) => WIDE.includes(k)), r = keys.filter((k) => !WIDE.includes(k));
    const one = !l.length || !r.length, w = S.w >= 1000 && !one;
    S.info.home = "แบบเดิม: ซ้าย (กว้าง) = งาน/ห้อง · ขวา = ที่เหลือ";
    return top + `<div class="hm-cols2${w ? " w" : ""}">${[l, r].filter((c) => c.length).map((c) => `<div class="stack-col">${c.map((k) => CARDS.home[k].html()).join("")}</div>`).join("")}</div>`;
  }
  S.info.home = "คอลัมน์สมดุลตามน้ำหนักการ์ด (ไม่เกิน 3)";
  return top + region("home", keys, 3);
};

/* ===== Settings ===== */
const formsHtml = () => {
  const sec = S.sec;
  const school = `<section class="card"><h2 class="set-title">${ic("school")} ข้อมูลโรงเรียน</h2><div class="grid2"><label class="field"><span>ชื่อโรงเรียน</span><input value="โรงเรียนบ้านตัวอย่าง" readonly></label><label class="field"><span>ชื่อครู</span><input value="ครูตัวอย่าง" readonly></label></div>
    <div class="set-row"><div class="set-l"><b>ธีม</b><div class="xs muted">ใช้กับทุกเครื่อง · บันทึกทันที</div></div><span class="seg"><span class="on">ตามเครื่อง</span><span>สว่าง</span><span>มืด</span></span></div></section>`;
  const display = `<section class="card"><h2 class="set-title">${ic("phone")} การแสดงผลบนเครื่องนี้</h2>
    <div class="set-row"><div class="set-l"><b>ขนาดตัวอักษร</b><div class="xs muted">ใหญ่ขึ้นสำหรับหน้าจอสัมผัส</div></div><span class="seg"><span>เล็ก</span><span class="on">กลาง</span><span>ใหญ่</span></span></div>
    <div class="set-row"><div class="set-l"><b>ความหนาแน่นของแถว</b></div><span class="seg"><span>แน่น</span><span class="on">ปกติ</span><span>โปร่ง</span></span></div>
    <div class="set-row"><div class="set-l"><b>ใช้ออฟไลน์</b><div class="xs muted">เก็บหน้าเว็บไว้ในเครื่อง</div></div><span class="switch" role="img" aria-label="เปิด"></span></div></section>`;
  const time = `<section class="card"><h2 class="set-title">${ic("clock")} เวลาเรียน</h2>${["คาบ 1 · 08:30–09:20", "คาบ 2 · 09:20–10:10", "คาบ 3 · 10:30–11:20", "คาบ 4 · 11:20–12:10"].map((t) => `<div class="set-row"><div class="set-l">${t}</div><button class="ghost" style="height:2.27rem">แก้ไข</button></div>`).join("")}
    <div class="set-row"><div class="set-l"><b>นับสายหลัง</b><div class="xs muted">กี่นาทีหลังเริ่มคาบ</div></div><span class="seg"><span>5</span><span class="on">10</span><span>15</span></span></div></section>`;
  const backup = `<section class="card"><h2 class="set-title">${ic("db")} สำรองและกู้คืน</h2><div class="set-row"><div class="set-l"><b>สำรองข้อมูลทั้งหมด</b><div class="xs muted">ดาวน์โหลดเป็นไฟล์ในเครื่องนี้</div></div><button class="primary">สำรองเลย</button></div>
    <div class="set-row"><div class="set-l"><b>กู้คืนจากไฟล์</b><div class="xs muted">แทนที่ข้อมูลปัจจุบัน</div></div><button>เลือกไฟล์</button></div></section>`;
  const danger = `<section class="card" style="border-color:var(--border-danger)"><h2 class="set-title" style="color:var(--text-danger)">${ic("alert")} เริ่มใหม่ (ล้างข้อมูล)</h2><div class="set-row"><div class="set-l">ลบข้อมูลทั้งหมดในระบบ ย้อนกลับไม่ได้</div><button style="color:var(--text-danger);border-color:var(--border-danger)">ล้างข้อมูล…</button></div></section>`;
  return sec === "general" ? school + display : sec === "time" ? time : sec === "backup" ? backup : danger;
};
PAGE.settings = (pgRem, mode) => {
  const keys = vis("settings");
  const nav = `<nav class="set-nav" aria-label="หมวดตั้งค่า">${[["general", "ทั่วไป", "gear"], ["time", "เวลาเรียน", "clock"], ["backup", "สำรองและกู้คืน", "db"], ["danger", "เริ่มใหม่", "alert"]].map(([k, l, i]) => `<button class="${S.sec === k ? "on" : ""}" data-sec="${k}">${ic(i, 20)} ${l}</button>`).join("")}</nav>`;
  const bodyW = pgRem - 11 - 0.75;
  let body = "";
  if (S.sec === "general") {
    body += `<div class="set-banner">${ic("alert", 20)} สำรองล่าสุด 9 วันก่อน · ควรสำรองสัปดาห์ละครั้ง <button class="primary" style="height:2.27rem">สำรองเลย</button></div>`;
    body += mode === "before" ? `<div class="set-cards">${keys.map((k) => CARDS.settings[k].html()).join("")}</div>` : region("settings", keys, 2, 20);
  }
  S.info.settings = mode === "before" ? "แบบเดิม: ฟอร์มยืดเต็มกว้าง" : `ฟอร์มกว้างไม่เกิน 52rem · วางคู่กันเมื่อพื้นที่ ≥ 60rem (ตอนนี้ ${bodyW.toFixed(0)}rem)`;
  body += `<div class="set-forms">${formsHtml()}</div>`;
  return head("gear", "ตั้งค่า", "จัดการระบบ · บางหมวดใช้ทุกเครื่อง", "") + `<div class="set-cols">${nav}<div class="set-body">${body}</div></div>`;
};

/* ===== render ===== */
function fill(app, mode, rem) {
  $$(".pg-cols", app).forEach((el) => {
    const pg = el.dataset.pg, keys = el.dataset.keys.split(","), max = +el.dataset.max;
    const n = colsFor(el.clientWidth / rem, max, keys.length, +el.dataset.min);
    el.dataset.n = n; el.style.setProperty("--n", n);
    const cols = splitColumns(keys, n, weightOf(pg));
    el.innerHTML = cols.map((c) => `<div class="pg-col">${c.map((k) => CARDS[pg][k].html()).join("")}</div>`).join("");
    S.info[pg + "_n"] = n; S.info[pg + "_cols"] = cols;
  });
}
function draw(mode) {
  const app = $("#app"), W = S.w, rem = W <= 1180 ? 18 : 16;
  document.documentElement.style.fontSize = rem + "px";
  app.className = `app ${mode} pg-${S.page}` + (W <= 1180 ? " touch" : "") + (W < 1000 ? " narrow" : "");
  app.dataset.theme = S.theme; app.style.width = W + "px"; app.style.setProperty("--vh", VH[W] + "px");
  app.innerHTML = rail() + `<main class="main"><div class="pg"></div></main>`;
  const pg = $(".pg", app), pgRem = pg.clientWidth / rem;
  pg.innerHTML = PAGE[S.page](pgRem, mode);
  fill(app, mode, rem);
  S.info.pgRem = pgRem;
  return app.offsetHeight;
}
function render() {
  const app = $("#app"), dev = $("#dev"), fw = $("#fwrap"), W = S.w;
  app.style.transform = "none";
  const hBefore = draw("before"), hAfter = draw("after");
  const h = draw(S.mode);
  app.classList.toggle("viewmode", S.view === "real");
  dev.className = "dev" + (S.view === "real" ? " real" : "");
  const sc = Math.min(1, ($("#stage").clientWidth - 24) / W);
  const boxH = S.view === "real" ? VH[W] : h;
  dev.style.width = W + "px"; dev.style.height = boxH + "px";
  dev.style.transform = `scale(${sc})`; dev.style.transformOrigin = "0 0";
  fw.style.width = W * sc + "px"; fw.style.height = boxH * sc + "px";
  const f = (x) => (x / VH[W]).toFixed(1);
  const cut = Math.round((1 - hAfter / hBefore) * 100);
  $("#meter").innerHTML = `<span class="pillm">ก่อน <b>${f(hBefore)}</b> หน้าจอ</span><span>→</span><span class="pillm">หลัง <b class="${cut > 0 ? "good" : ""}">${f(hAfter)}</b> หน้าจอ${cut > 0 ? ` (สั้นลง ${cut}%)` : ""}</span><span class="pillm" title="ความกว้างพื้นที่เนื้อหา">เนื้อหากว้าง ${S.info.pgRem.toFixed(0)}rem</span>`;
  buildPanel(); sync();
}
function buildPanel() {
  const pg = S.page, L = S.lay[pg], meta = CARDS[pg], p = $("#panel");
  p.hidden = !S.panel;
  if (!S.panel) return;
  const W = { 1: "S", 2: "M", 4: "L" };
  const cols = S.info[pg + "_cols"];
  const colTxt = cols ? cols.map((c, i) => `คอลัมน์ ${i + 1}: ${c.map((k) => meta[k].t).join(" · ") || "—"}`).join("<br>") : "";
  p.innerHTML = `<h3>ปรับการ์ด (จำลอง)</h3><p>ติ๊กเพื่อซ่อน/แสดง · ลูกศรเลื่อนลำดับ — ดูว่าเลย์เอาต์รับทุกลำดับและทุกชุดได้</p>
  ${L.order.map((k, i) => `<div class="pr${L.hidden.includes(k) ? " off" : ""}"><label><input type="checkbox" data-show="${k}" ${L.hidden.includes(k) ? "" : "checked"}><span class="t">${meta[k].t}</span><span class="w" title="น้ำหนัก">${W[meta[k].w]}</span></label><button data-mv="${k}" data-d="-1" aria-label="เลื่อน ${meta[k].t} ขึ้น" ${i === 0 ? "disabled" : ""}>↑</button><button data-mv="${k}" data-d="1" aria-label="เลื่อน ${meta[k].t} ลง" ${i === L.order.length - 1 ? "disabled" : ""}>↓</button></div>`).join("")}
  <div style="display:flex;gap:6px;margin-top:10px"><button data-reset="def">ค่าเริ่มต้น</button><button data-reset="all">แสดงครบ</button><button data-reset="one">เหลือใบเดียว</button></div>
  <div class="cols-info"><b>${S.info[pg] || ""}</b>${colTxt ? "<br>" + colTxt : ""}</div>
  <div class="note">น้ำหนัก S=1 M=2 L=4 (ประมาณความสูงการ์ด) · ใบถัดไปลงคอลัมน์ที่ยังสั้นกว่า เสมอกันให้ซ้ายก่อน</div>`;
}
function sync() {
  $$("[data-w]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.w === S.w)));
  $$("[data-page]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.page === S.page)));
  $$("[data-theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === S.theme)));
  $$("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)));
  $$("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === S.view)));
  $("#bpanel").setAttribute("aria-pressed", String(S.panel));
  document.body.dataset.t = S.theme;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button,input"); if (!t) return;
  const d = t.dataset;
  if (d.w) S.w = +d.w; else if (d.page) { S.page = d.page; } else if (d.theme) S.theme = d.theme; else if (d.mode) S.mode = d.mode; else if (d.view) S.view = d.view;
  else if (d.act === "panel" || t.id === "bpanel") S.panel = !S.panel;
  else if (d.sec) S.sec = d.sec;
  else if (d.mv) { const L = S.lay[S.page], i = L.order.indexOf(d.mv), j = i + +d.d; if (j >= 0 && j < L.order.length) [L.order[i], L.order[j]] = [L.order[j], L.order[i]]; }
  else if (d.show) { const L = S.lay[S.page]; L.hidden = t.checked ? L.hidden.filter((x) => x !== d.show) : [...L.hidden, d.show]; }
  else if (d.reset) { const L = S.lay[S.page]; if (d.reset === "def") S.lay[S.page] = JSON.parse(JSON.stringify(DEFAULT[S.page])); else if (d.reset === "all") L.hidden = []; else L.hidden = L.order.slice(1); }
  else return;
  render();
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
document.fonts.ready.then(render); render();

</script>
